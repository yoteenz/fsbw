name: All In One Standalone QA

on:
  push:
    paths:
      - 'all-in-one-enterprises/**'
  pull_request:
    paths:
      - 'all-in-one-enterprises/**'

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: all-in-one-enterprises
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: all-in-one-enterprises/package-lock.json
      - run: bash scripts/ci/aio-node-runtime-guard.sh
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/check-isolation.sh
