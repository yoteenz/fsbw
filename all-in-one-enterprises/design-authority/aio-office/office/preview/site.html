<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<title>AIO Office Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
 * Review chrome around the device: a quiet toolbar, the scaled device frame and the review guide. The device holds the
 * AIO OFFICE in its own fixed ivory / obsidian / gold world; the chrome follows the viewer's light or dark theme.
 */
:root {
  --bg: #ebe6dc;
  --fg: #17171a;
  --muted: #6a665e;
  --line: #d7cfc1;
  --btn: #fbf8f2;
  --panel: #f6f2ea;
  --on-bg: #19191b;
  --on-fg: #edb63f;
  --frame: #0f0f10;
  --ok: #2f7d43;
  --warn: #9a6a12;
  --bad: #962a2a;
  --chrome: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
  --body: Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) { --bg: #121214; --fg: #efeae2; --muted: #a29d94; --line: #34322e; --btn: #1d1d20; --panel: #19191c; --on-bg: #edb63f; --on-fg: #141416; --frame: #000; --ok: #7cc48f; --warn: #e3b25b; --bad: #e08a80; color-scheme: dark; }
}
:root[data-theme='dark'] { --bg: #121214; --fg: #efeae2; --muted: #a29d94; --line: #34322e; --btn: #1d1d20; --panel: #19191c; --on-bg: #edb63f; --on-fg: #141416; --frame: #000; --ok: #7cc48f; --warn: #e3b25b; --bad: #e08a80; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--body); }
.viewer { max-width: 2960px; margin: 0 auto; padding: 14px 16px 28px; display: grid; gap: 10px; }
.v-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.v-top h1 { margin: 0; font: 800 22px/1.1 var(--chrome); letter-spacing: 0.04em; text-transform: uppercase; }
.v-top p { margin: 0; color: var(--muted); font-size: 14px; max-width: 90ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.tools .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools .group > span { font: 600 11px/1 var(--chrome); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.tools button, .tools select, .guide button { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--fg); height: 34px; padding: 0 12px; border-radius: 9px; cursor: pointer; font: 700 12px/1 var(--chrome); letter-spacing: 0.1em; text-transform: uppercase; }
.tools select { padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; max-width: 220px; }
.tools button[aria-pressed='true'] { background: var(--on-bg); border-color: var(--on-bg); color: var(--on-fg); }
.tools button:disabled, .guide button:disabled { opacity: 0.45; cursor: default; }
.tools button:focus-visible, .tools select:focus-visible, .guide button:focus-visible { outline: 2px solid #e7ab3c; outline-offset: 2px; }
.v-addr { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font: 600 11px/1.3 var(--chrome); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.v-addr code { font: 500 12px/1.3 ui-monospace, Menlo, monospace; letter-spacing: 0; text-transform: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; overflow-wrap: anywhere; }
.v-body { display: grid; gap: 16px; align-items: start; }
@media (min-width: 1180px) { .v-body.has-guide { grid-template-columns: minmax(0, 1fr) 330px; } }
#stage { display: grid; justify-items: center; min-width: 0; }
#sizer { position: relative; max-width: 100%; }
.device { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: top left; background: #f3f0ea; border-radius: 14px; box-shadow: 0 0 0 6px var(--frame), 0 24px 60px rgba(0, 0, 0, 0.28); }
.device[data-device='phone'] { border-radius: 34px; box-shadow: 0 0 0 10px var(--frame), 0 24px 60px rgba(0, 0, 0, 0.3); }
.device[data-device='tablet'] { border-radius: 26px; box-shadow: 0 0 0 12px var(--frame), 0 24px 60px rgba(0, 0, 0, 0.3); }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; }
.device[data-device='phone'] .screen, .device[data-device='tablet'] .screen { scrollbar-width: none; }
.device[data-device='phone'] .screen::-webkit-scrollbar, .device[data-device='tablet'] .screen::-webkit-scrollbar { display: none; }
.ao-root .tile:hover, .ao-root .lane:hover, .ao-root .acard:hover { border-color: #e7ab3c; }
.ao-root .arow:hover, .ao-root .qa:hover, .ao-root .crow:hover, .ao-root .entry:hover, .ao-root .area:hover, .ao-root .mrow:hover, .ao-root .frow:hover, .ao-root .erow:hover, .ao-root .xrow[data-sim]:hover { background: #fbf3e0; }
.ao-root [data-k], .ao-root [data-view], .ao-root [data-area], .ao-root .head__chev { cursor: pointer; }
.proto-toast { position: absolute; left: 50%; bottom: 96px; z-index: 80; transform: translateX(-50%); width: max-content; max-width: 86%; padding: 11px 15px 10px; border-radius: 10px; background: #19191b; color: #f3dfae; font: 600 11.5px/1.35 Roboto, Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3); }
.device[data-vp='tablet'] .proto-toast { bottom: 140px; font-size: 14px; }
.device[data-vp='desktop'] .proto-toast { bottom: 40px; font-size: 14px; }

/* guide */
.guide { display: grid; gap: 12px; align-content: start; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
.guide[hidden] { display: none; }
@media (min-width: 1180px) { .guide { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }
.g-sec { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.g-sec:last-child { border-bottom: 0; padding-bottom: 0; }
.g-sec h2 { margin: 0; font: 700 11px/1.2 var(--chrome); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.g-sec p { margin: 0; }
.g-fam { font: 700 15px/1.25 var(--chrome); letter-spacing: 0.03em; }
.g-muted { color: var(--muted); font-size: 13px; }
.g-live { font: 500 12px/1.4 ui-monospace, Menlo, monospace; color: var(--fg); overflow-wrap: anywhere; }
.g-tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font: 700 11px/1.2 var(--chrome); letter-spacing: 0.1em; background: var(--btn); border: 1px solid var(--line); }
.g-tag--approved_root, .g-tag--approved_authority { border-color: var(--ok); color: var(--ok); }
.g-tag--new_for_review { border-color: #e7ab3c; color: var(--warn); }
.g-tag--honest_state { border-style: dashed; color: var(--muted); }
.g-tag--not_designed, .g-tag--broken { border-color: var(--bad); color: var(--bad); }
.g-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.g-list li { display: grid; gap: 1px; }
.g-plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.guide .g-link { all: unset; cursor: pointer; color: var(--fg); text-decoration: underline; text-decoration-color: #e7ab3c; text-underline-offset: 3px; font-size: 13.5px; }
.guide .g-link.is-on { font-weight: 700; }
.guide .g-link:focus-visible { outline: 2px solid #e7ab3c; outline-offset: 2px; }
.g-journey { display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: var(--btn); border: 1px solid #e7ab3c; }
.g-row { display: flex; flex-wrap: wrap; gap: 6px; }
.g-legend { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.g-bad { color: var(--bad); }

/*
 * AIO OFFICE visual authority studio — HOME · WORK · REPORTS · MORE.
 * Deterministic UI assembly over approved photography (HYBRID_HARD_RULE). Design authority only: nothing in src imports
 * this file and it is never deployed. Shell values are the approved AIO OFFICE staff frame
 * (AIO_CLIENT_MIGRATION_RESPONSIVE_BLUEPRINT: header 77 / 68 px, sidebar 138 px, tablet dock 113 px) with WORK in place
 * of FILING. Viewport is set by studio.js on <html data-vp>: mobile < 700 · tablet 700–1023 · desktop ≥ 1024 · wide ≥ 1900.
 */

.ao-root {
  --text: Roboto, Arial, sans-serif;
  --cond: 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --page: #f3f0ea;
  --page-2: #ece7dd;
  --card: #fffdf9;
  --line: #e7e1d6;
  --line-2: #d9d1c3;
  --ink: #111112;
  --ink-2: #3b3b3f;
  --ink-3: #66666c;
  --ink-4: #8b8b90;
  --gold-hi: #f7d27a;
  --gold: #f1c158;
  --gold-lo: #e7ab3c;
  --gold-ink: #9a6a12;
  --obsidian: #19191b;
  --nav-gold: #edb63f;
  --ok: #2f7d43;
  --ok-bg: #e7f1e8;
  --warn: #a8670f;
  --warn-bg: #fbefd6;
  --bad: #962a2a;
  --bad-bg: #f6e3e1;
  --mute-bg: #eeebe5;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 6px 18px rgba(70, 48, 18, 0.07), 0 1px 2px rgba(70, 48, 18, 0.06);
  --r-card: 12px;
  --r-ctl: 9px;
}

.ao-root * {
  box-sizing: border-box;
}
.ao-root {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 13px/1.35 var(--text);
  text-transform: uppercase;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'tnum' 1;
}
.ao-root img {
  display: block;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ── icons ── */
.ico {
  width: 20px;
  height: 20px;
  flex: none;
  fill: currentColor;
  color: inherit;
}
.ico--drawn {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tile__ico {
  width: 26px;
  height: 26px;
  color: var(--gold-lo);
  stroke-width: 1.7;
}

/* ── shell ── */
.ao {
  position: relative;
  min-height: 100%;
}
/* full-page captures: the dock sits at the end of the page, where it would be after scrolling */
html.full .dock,
html.full .side {
  position: absolute;
}
.head {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  background: rgba(252, 251, 249, 0.97);
  box-shadow: 0 1px 0 rgba(17, 17, 18, 0.06);
}
.head__lockup {
  width: auto;
  flex: none;
}
.head__ctx {
  display: grid;
  gap: 5px;
  align-content: center;
  margin-right: auto;
  border-left: 1px solid rgba(17, 17, 18, 0.2);
  white-space: nowrap;
}
.head__ctx small {
  font: 500 12.5px/1 var(--text);
  letter-spacing: 0.16em;
  color: #55555a;
}
.head__ctx b {
  font: 500 15px/1 var(--text);
  letter-spacing: 0.08em;
  color: #18181a;
}
.head__tool {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  border: 0;
  background: none;
  padding: 0;
  color: var(--ink);
}
.head__dot {
  position: absolute;
  top: 0;
  right: 1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold-lo);
  box-shadow: 0 0 0 2px #fcfbf9;
}
.head__plus {
  border-radius: var(--r-ctl);
  background: linear-gradient(180deg, var(--gold), var(--gold-lo));
  box-shadow: 0 2px 6px rgba(160, 110, 20, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  color: var(--ink);
}
.head__field {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid #e2e0dc;
  border-radius: 10px;
  background: rgba(243, 242, 240, 0.9);
  color: #8b8b90;
  font: 400 13px/1 var(--text);
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
}
.head__field .ico {
  width: 19px;
  height: 19px;
  color: #2a2a2d;
}
.head__rule {
  width: 1px;
  height: 35px;
  background: rgba(17, 17, 18, 0.12);
  flex: none;
}
.head__avatar {
  flex: none;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(145deg, var(--gold-hi), var(--gold-lo));
  box-shadow: 0 3px 8px rgba(70, 48, 18, 0.18);
}
.head__avatar span {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #17171a;
  border: 2px solid #fbf6ea;
  color: var(--gold-hi);
  font: 700 15px/1 var(--cond);
  letter-spacing: 0.04em;
}
.head__who {
  display: grid;
  gap: 4px;
  flex: none;
  white-space: nowrap;
}
.head__who b {
  font: 600 13px/1.1 var(--text);
  letter-spacing: 0.06em;
}
.head__who span {
  font: 500 10.5px/1.1 var(--text);
  letter-spacing: 0.14em;
  color: #55555a;
}
.head__chev {
  width: 13px;
  height: 13px;
  flex: none;
}

/* bottom dock (phone + tablet) */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  align-items: center;
  background: rgba(252, 251, 249, 0.98);
  box-shadow: 0 -6px 22px rgba(70, 48, 18, 0.08), 0 -1px 0 rgba(255, 255, 255, 0.9);
}
.dock__item {
  display: grid;
  justify-items: center;
  align-content: center;
  justify-self: center;
  color: #3b3b40;
}
.dock__item .ico {
  color: #19191b;
}
.dock__item.is-on {
  background: var(--obsidian);
  color: var(--nav-gold);
  box-shadow: 0 4px 10px rgba(20, 16, 10, 0.18);
}
.dock__item.is-on .ico {
  color: var(--nav-gold);
}
/* the sheet glyphs carry different inner padding: the approved optical-size factors */
.navi:nth-child(1) .ico { transform: scale(0.854); }
.navi:nth-child(2) .ico { transform: scale(0.958); }
.navi:nth-child(3) .ico { transform: scale(0.917); }
.navi:nth-child(4) .ico { transform: scale(1.25); }
.navi:nth-child(5) .ico { transform: scale(0.875); }

/* desktop sidebar */
.side {
  position: fixed;
  left: 0;
  bottom: 0;
  z-index: 25;
  width: 138px;
  display: flex;
  flex-direction: column;
  gap: 5.5px;
  padding-top: 23px;
  background: rgba(250, 249, 247, 0.97);
  border-top-right-radius: 16px;
  box-shadow: 1px 0 0 rgba(17, 17, 18, 0.05), 8px 0 22px rgba(70, 48, 18, 0.05);
}
.side__item {
  display: flex;
  align-items: center;
  gap: 17px;
  height: 60px;
  margin-right: 3px;
  padding-left: 23px;
  border-radius: 0 6px 6px 0;
  color: #1b1b1d;
  font: 500 13.5px/1 var(--text);
  letter-spacing: 0.06em;
}
.side__item .ico {
  width: 23px;
  height: 23px;
}
.side__item.is-on {
  background: var(--obsidian);
  color: var(--nav-gold);
  box-shadow: inset 5px 0 0 #f1b440, 0 4px 10px rgba(20, 16, 10, 0.16);
}
.side__foot {
  margin-top: auto;
  padding: 0 14px 18px;
}
.side__foot img {
  width: 100%;
  opacity: 0.92;
}

/* ── photography ── */
.plate {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.plate > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}
.plate--light::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, rgba(247, 242, 233, 0.9) 0%, rgba(247, 242, 233, 0.72) 30%, rgba(247, 242, 233, 0.12) 58%, rgba(247, 242, 233, 0) 72%);
}
.plate--dark::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, rgba(12, 12, 14, 0.78) 0%, rgba(12, 12, 14, 0.5) 34%, rgba(12, 12, 14, 0.05) 64%, rgba(12, 12, 14, 0) 80%);
}
.plate--fade::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 34%;
  z-index: -1;
  background: linear-gradient(180deg, rgba(243, 240, 234, 0), var(--page));
}
.hero__kicker {
  margin: 0;
  font: 500 11px/1 var(--text);
  letter-spacing: 0.22em;
}
.hero__title {
  margin: 8px 0 0;
  font: 800 30px/0.98 var(--cond);
  letter-spacing: 0.005em;
}
.hero__title span {
  display: block;
}
.hero__sub {
  margin: 8px 0 0;
  font: 400 12px/1.38 var(--text);
  letter-spacing: 0.02em;
  color: var(--ink-2);
}
.plate--dark .hero__kicker {
  color: var(--gold);
}
.plate--dark .hero__title {
  color: #fbf7ef;
}
.plate--dark .hero__sub {
  color: rgba(251, 247, 239, 0.86);
}
.credit {
  position: absolute;
  right: 10px;
  bottom: 8px;
  font: 500 8.5px/1 var(--text);
  letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* ── surfaces ── */
.main {
  position: relative;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
}
.sec {
  margin-top: 22px;
}
.sec__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.sec__title {
  margin: 0;
  font: 700 18px/1 var(--cond);
  letter-spacing: 0.03em;
}
.sec__sub {
  margin: 5px 0 0;
  font: 400 11px/1.3 var(--text);
  letter-spacing: 0.03em;
  color: var(--ink-3);
}
.sample {
  display: inline-block;
  white-space: nowrap;
  margin-left: 8px;
  padding: 3px 5px 2px;
  border: 1px dashed #b9b2a6;
  border-radius: 4px;
  font: 600 8px/1 var(--text);
  letter-spacing: 0.16em;
  color: #8a8275;
  vertical-align: 3px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-ctl);
  background: #fffdf9;
  font: 600 11px/1 var(--cond);
  letter-spacing: 0.1em;
  color: var(--ink);
  white-space: nowrap;
}
.btn .ico {
  width: 14px;
  height: 14px;
}
.btn--gold {
  border: 0;
  background: linear-gradient(180deg, var(--gold), var(--gold-lo));
  box-shadow: 0 2px 6px rgba(160, 110, 20, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}
.btn--ghost[aria-disabled='true'] {
  color: var(--ink-4);
  border-style: dashed;
}
.arrow {
  display: grid;
  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: linear-gradient(180deg, var(--gold), var(--gold-lo));
  box-shadow: 0 2px 5px rgba(160, 110, 20, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  color: var(--ink);
}
.arrow .ico {
  width: 14px;
  height: 14px;
}
.arrow--quiet {
  background: #f6efe0;
  box-shadow: inset 0 0 0 1px #ead9b3;
  color: var(--gold-ink);
}
.chev {
  width: 14px;
  height: 14px;
  color: var(--ink-4);
}

/* status words: always a word, never colour alone */
.st {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 7px 3px;
  border-radius: 5px;
  font: 700 9.5px/1 var(--text);
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.st::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: currentColor;
}
.st--warn { color: var(--warn); background: var(--warn-bg); }
.st--bad { color: var(--bad); background: var(--bad-bg); }
.st--ok { color: var(--ok); background: var(--ok-bg); }
.st--mute { color: #6b665d; background: var(--mute-bg); }
.st--gold { color: #8a5d0c; background: #faecc8; }
.st--plain::before { display: none; }
.chip {
  display: inline-block;
  padding: 4px 7px 3px;
  border: 1px solid var(--line-2);
  border-radius: 5px;
  font: 600 9.5px/1 var(--text);
  letter-spacing: 0.08em;
  color: var(--ink-2);
  white-space: nowrap;
  background: #fbf9f5;
}
.tag-vis {
  display: inline-block;
  padding: 3px 5px 2px;
  border-radius: 4px;
  font: 600 8.5px/1 var(--text);
  letter-spacing: 0.12em;
  white-space: nowrap;
}
.tag-vis--internal { background: #ece8e1; color: #5d584f; }
.tag-vis--client { border: 1px solid #c9b48a; color: #7a5a19; }

/* ── HOME: attention cards + list ── */
.cards {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.acard {
  position: relative;
  display: grid;
  align-content: start;
  min-height: 98px;
  padding: 12px 11px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
  box-shadow: var(--shadow);
}
.acard__n {
  font: 800 32px/0.9 var(--cond);
}
.acard__l {
  margin-top: 7px;
  font: 700 11px/1.12 var(--cond);
  letter-spacing: 0.07em;
}
.acard__s {
  margin-top: 3px;
  font: 400 9.5px/1.2 var(--text);
  letter-spacing: 0.05em;
  color: var(--ink-3);
}
.acard .arrow {
  position: absolute;
  right: 9px;
  top: 10px;
  width: 24px;
  height: 24px;
}
.acard.is-on {
  border-color: var(--gold-lo);
  box-shadow: 0 0 0 1.5px var(--gold-lo), 0 8px 20px rgba(160, 110, 20, 0.16);
}
.acard.is-on::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -8px;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  transform: rotate(45deg);
  background: var(--card);
  border-right: 1.5px solid var(--gold-lo);
  border-bottom: 1.5px solid var(--gold-lo);
}
.acard--bad .acard__n { color: var(--bad); }
.alist {
  margin-top: 12px;
  overflow: hidden;
}
.alist__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--line);
}
.alist__title {
  font: 700 13px/1 var(--cond);
  letter-spacing: 0.08em;
}
.alist__count {
  display: block;
  margin-top: 6px;
  font: 500 10px/1 var(--text);
  letter-spacing: 0.1em;
  color: var(--ink-3);
}
.link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 600 10.5px/1 var(--cond);
  letter-spacing: 0.12em;
  color: var(--gold-ink);
  white-space: nowrap;
}
.link .ico {
  width: 12px;
  height: 12px;
}
.arow {
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) auto;
  gap: 4px 10px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #efe9df;
}
.arow:last-of-type {
  border-bottom: 0;
}
.arow__pri {
  grid-row: span 2;
  align-self: start;
  margin-top: 1px;
}
.arow__pri .st {
  width: 100%;
  justify-content: flex-start;
}
.arow__who {
  font: 700 13px/1.1 var(--cond);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.arow__what {
  grid-column: 2;
  font: 400 11px/1.3 var(--text);
  letter-spacing: 0.02em;
  color: var(--ink-2);
}
.arow__to {
  grid-column: 2;
  display: flex;
  align-items: center;
  gap: 4px;
  font: 600 9.5px/1 var(--text);
  letter-spacing: 0.1em;
  color: var(--gold-ink);
}
.arow__to .ico {
  width: 10px;
  height: 10px;
}
.arow__age {
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
  font: 500 9.5px/1 var(--text);
  letter-spacing: 0.08em;
  color: var(--ink-4);
  white-space: nowrap;
}
.arow__go {
  grid-column: 3;
  grid-row: 2 / span 2;
  justify-self: end;
}
.agroup {
  padding: 9px 14px 6px;
  background: #f8f4ec;
  border-bottom: 1px solid #efe9df;
  font: 700 9.5px/1 var(--text);
  letter-spacing: 0.16em;
  color: var(--ink-3);
}
.honest {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px 11px;
  background: #f7f3eb;
  border-top: 1px dashed var(--line-2);
  font: 500 9.5px/1.4 var(--text);
  letter-spacing: 0.07em;
  color: #6b665d;
}
.honest .ico {
  width: 13px;
  height: 13px;
  margin-top: 0;
  color: #8a8275;
}
.honest b {
  font-weight: 700;
  color: #4f4a42;
}

/* WORK ACROSS AIO tiles */
.tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.tile {
  position: relative;
  display: grid;
  align-content: start;
  min-height: 98px;
  padding: 11px 10px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.tile__n {
  position: absolute;
  top: 11px;
  right: 10px;
  font: 600 9px/1 var(--text);
  letter-spacing: 0.12em;
  color: #b0a898;
}
.tile__name {
  margin-top: 9px;
  font: 700 11.5px/1.08 var(--cond);
  letter-spacing: 0.05em;
}
.tile__sig {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.sig {
  font: 600 9px/1.25 var(--text);
  letter-spacing: 0.07em;
}
.sig--warn { color: var(--warn); }
.sig--ok { color: var(--ok); }
.sig--mute { color: #8a8275; }
.sig--bad { color: var(--bad); }
.tile--none {
  background: repeating-linear-gradient(135deg, #faf7f1 0 8px, #f4efe6 8px 9px);
  box-shadow: none;
  border-style: dashed;
}
.tile--none .tile__ico {
  color: #b0a898;
}

/* client rows */
.crow {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: 4px 11px;
  align-items: center;
  padding: 11px 14px;
  border-bottom: 1px solid #efe9df;
}
.crow:last-child {
  border-bottom: 0;
}
.badge {
  grid-row: span 2;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--obsidian);
  color: var(--gold-hi);
  font: 700 12px/1 var(--cond);
  letter-spacing: 0.06em;
}
.badge--pre {
  background: #e9e4da;
  color: #6b665d;
}
.crow__name {
  font: 700 13px/1.1 var(--cond);
  letter-spacing: 0.04em;
}
.crow__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.crow__state {
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
}
.crow__time {
  grid-column: 3;
  grid-row: 2;
  justify-self: end;
  font: 500 9.5px/1 var(--text);
  letter-spacing: 0.08em;
  color: var(--ink-4);
}
/* activity rows */
.erow {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 4px 10px;
  align-items: start;
  padding: 10px 14px;
  border-bottom: 1px solid #efe9df;
}
.erow:last-child {
  border-bottom: 0;
}
.erow__mark {
  width: 12px;
  height: 12px;
  margin-top: 1px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--gold), var(--gold-lo));
}
.erow__text {
  font: 400 11.5px/1.3 var(--text);
  letter-spacing: 0.02em;
  color: var(--ink);
}
.erow__meta {
  grid-column: 2;
  display: flex;
  gap: 6px;
  align-items: center;
}
.erow__time {
  font: 500 9.5px/1.2 var(--text);
  letter-spacing: 0.08em;
  color: var(--ink-4);
  white-space: nowrap;
}

/* quick actions */
.qa {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  gap: 2px 11px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid #efe9df;
}
.qa:last-child {
  border-bottom: 0;
}
.qa__ico {
  grid-row: span 2;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: #f6efe0;
  color: var(--gold-ink);
}
.qa__ico .ico {
  width: 18px;
  height: 18px;
}
.qa__label {
  grid-column: 2;
  font: 700 12.5px/1.1 var(--cond);
  letter-spacing: 0.06em;
}
.qa__to {
  grid-column: 2;
  font: 500 9.5px/1.2 var(--text);
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.qa .chev {
  grid-column: 3;
  grid-row: 1 / span 2;
}
.qa__head {
  padding: 13px 12px 11px;
  border-bottom: 1px solid var(--line);
}
.qa__grant {
  margin-left: 6px;
  font: 600 8px/1 var(--text);
  letter-spacing: 0.14em;
  color: #8a8275;
}

/* ── WORK ── */
.mine {
  padding: 14px;
}
.mine__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.mine__title {
  display: flex;
  align-items: center;
  gap: 9px;
  font: 700 16px/1 var(--cond);
  letter-spacing: 0.06em;
}
.mine__title .ico {
  width: 20px;
  height: 20px;
  color: var(--gold-lo);
}
.mine__stats {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.stat {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 6px 9px 5px;
  border-radius: 7px;
  background: #f6f1e7;
  font: 600 9.5px/1 var(--text);
  letter-spacing: 0.1em;
  color: var(--ink-2);
}
.stat b {
  font: 800 15px/1 var(--cond);
  color: var(--ink);
}
.stat--bad b {
  color: var(--bad);
}
.mrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 10px;
  align-items: center;
  padding: 9px 0;
  border-top: 1px solid #efe9df;
}
.mine__rows {
  margin-top: 10px;
}
.mrow__who {
  font: 700 12.5px/1.1 var(--cond);
  letter-spacing: 0.04em;
}
.mrow__what {
  font: 400 10.5px/1.25 var(--text);
  letter-spacing: 0.02em;
  color: var(--ink-2);
}
.mrow__due {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  font: 600 9.5px/1 var(--text);
  letter-spacing: 0.08em;
  color: var(--ink-3);
}
.mrow__st {
  grid-column: 2;
  grid-row: 2;
  justify-self: end;
}
.lanes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}
.lane {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.lane__img {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  background: #2a2723;
}
.lane__img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.lane__no {
  position: absolute;
  left: 7px;
  top: 7px;
  padding: 3px 5px 2px;
  border-radius: 4px;
  background: rgba(17, 17, 18, 0.62);
  color: #f6e7c4;
  font: 600 8.5px/1 var(--text);
  letter-spacing: 0.14em;
}
.lane__standin {
  position: absolute;
  right: 6px;
  top: 6px;
  padding: 3px 5px 2px;
  border-radius: 4px;
  background: rgba(150, 42, 42, 0.86);
  color: #fff;
  font: 700 7.5px/1 var(--text);
  letter-spacing: 0.12em;
}
.lane__go {
  position: absolute;
  right: 7px;
  bottom: 7px;
}
.lane__body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 5px 6px;
  align-content: start;
  padding: 8px 8px 9px 9px;
}
.lane__name {
  grid-column: 1 / -1;
  font: 700 11.5px/1.08 var(--cond);
  letter-spacing: 0.04em;
  min-height: 25px;
}
.lane__sig {
  display: grid;
  gap: 3px;
  align-self: end;
}
.lane .arrow {
  width: 26px;
  height: 26px;
}
.lane--none .lane__img img {
  filter: grayscale(0.85) brightness(0.75);
}
.lane--none .lane__img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(30, 28, 25, 0.35);
}
.lane--none {
  background: #f7f3ec;
}
.queue {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding: 13px 14px;
}
.queue__ico {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: var(--obsidian);
  color: var(--nav-gold);
  flex: none;
}
.queue__t {
  font: 700 13.5px/1.1 var(--cond);
  letter-spacing: 0.06em;
}
.queue__s {
  margin-top: 3px;
  font: 400 10.5px/1.3 var(--text);
  letter-spacing: 0.02em;
  color: var(--ink-3);
}
.queue .arrow {
  margin-left: auto;
}

/* ── REPORTS ── */
.figs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.fig {
  position: relative;
  display: grid;
  align-content: start;
  min-height: 108px;
  padding: 12px 12px 11px;
}
.fig__l {
  font: 700 10.5px/1.15 var(--cond);
  letter-spacing: 0.1em;
  color: var(--ink-2);
}
.fig__v {
  margin-top: 9px;
  font: 800 30px/0.95 var(--cond);
}
.fig__s {
  margin-top: 7px;
  font: 500 9.5px/1.3 var(--text);
  letter-spacing: 0.07em;
  color: var(--ink-3);
}
.fig__grant {
  position: absolute;
  top: 11px;
  right: 10px;
}
.fig--locked {
  background: #1b1b1d;
  border-color: #1b1b1d;
  color: #f4ead6;
}
.fig--locked .fig__l {
  color: var(--gold);
}
.fig--locked .fig__s {
  color: rgba(244, 234, 214, 0.72);
}
.period {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.select {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 10px 0 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-ctl);
  background: #fffdf9;
  font: 600 10.5px/1 var(--cond);
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.select .ico {
  width: 12px;
  height: 12px;
}
.bars {
  padding: 12px 14px 6px;
}
.bar {
  display: grid;
  grid-template-columns: 128px minmax(0, 1fr) 28px;
  gap: 10px;
  align-items: center;
  padding: 4.5px 0;
}
.bar__l {
  font: 500 10px/1.15 var(--text);
  letter-spacing: 0.05em;
  color: var(--ink-2);
}
.bar__t {
  position: relative;
  height: 10px;
  border-radius: 3px;
  background: #efe9de;
  overflow: hidden;
}
.bar__t i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 3px;
  background: linear-gradient(90deg, #f0c461, #e3a637);
}
.bar__v {
  font: 700 12px/1 var(--cond);
  text-align: right;
}
.bar--none .bar__t {
  background: repeating-linear-gradient(135deg, #f4efe6 0 5px, #ebe4d7 5px 6px);
}
.bar--none .bar__v {
  font: 600 8px/1.1 var(--text);
  letter-spacing: 0.08em;
  color: #8a8275;
  text-align: right;
}
.bar--none {
  grid-template-columns: 128px minmax(0, 1fr) 84px;
}
.frow {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  gap: 3px 10px;
  align-items: center;
  padding: 9px 14px;
  border-bottom: 1px solid #efe9df;
}
.frow:last-child {
  border-bottom: 0;
}
.frow__dot {
  grid-row: span 2;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
}
.frow__t {
  font: 700 12px/1.1 var(--cond);
  letter-spacing: 0.04em;
}
.frow__s {
  font: 500 9.5px/1.2 var(--text);
  letter-spacing: 0.08em;
  color: var(--ok);
}
.frow__d {
  grid-column: 3;
  grid-row: span 2;
  font: 500 10px/1 var(--text);
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.empty {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 16px 14px;
}
.empty__frame {
  position: relative;
  height: 74px;
  border-radius: 8px;
  background:
    linear-gradient(180deg, transparent 24px, #ebe4d7 24px 25px, transparent 25px 49px, #ebe4d7 49px 50px, transparent 50px),
    repeating-linear-gradient(135deg, #f7f3ec 0 7px, #f1ebe0 7px 8px);
  border: 1px dashed #d6cdbd;
}
.empty__frame span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 700 10px/1 var(--text);
  letter-spacing: 0.16em;
  color: #8a8275;
}
.empty__t {
  font: 500 10.5px/1.4 var(--text);
  letter-spacing: 0.05em;
  color: var(--ink-2);
}
.area {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 5px 10px;
  align-items: center;
  padding: 10px 13px;
  border-bottom: 1px solid #efe9df;
}
.area:last-child {
  border-bottom: 0;
}
.area__ico {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: #f6efe0;
  color: var(--gold-ink);
}
.area__ico .ico {
  width: 15px;
  height: 15px;
}
.area__ico {
  grid-row: 1 / span 2;
}
.area__t {
  grid-column: 2;
  font: 700 12.5px/1.1 var(--cond);
  letter-spacing: 0.06em;
}
.area > .st {
  grid-column: 2;
  justify-self: start;
  padding: 3px 6px 2px;
  font-size: 8.5px;
}
.area > .chev {
  grid-column: 3;
  grid-row: 1 / span 2;
}
.area.is-on {
  background: #fbf3e0;
  box-shadow: inset 3px 0 0 var(--gold-lo);
}
.xrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 10px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #efe9df;
}
.xrow:last-child {
  border-bottom: 0;
}
.xrow__t {
  font: 700 12px/1.1 var(--cond);
  letter-spacing: 0.05em;
}
.xrow__s {
  font: 500 9.5px/1.25 var(--text);
  letter-spacing: 0.06em;
  color: var(--ink-3);
}
.xrow__t,
.xrow__s {
  grid-column: 1;
}
.xrow > .st {
  grid-row: 1 / span 2;
  grid-column: 2;
}
.selector {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.selector .seg {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 11px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-ctl);
  background: #fffdf9;
  font: 700 10.5px/1 var(--cond);
  letter-spacing: 0.1em;
  white-space: nowrap;
}
.seg.is-on {
  background: var(--obsidian);
  border-color: var(--obsidian);
  color: var(--nav-gold);
}
.seg i {
  font-style: normal;
  font: 600 8px/1 var(--text);
  letter-spacing: 0.1em;
  color: #8a8275;
}
.seg--grant i {
  color: var(--gold-ink);
}
.seg--none {
  border-style: dashed;
  color: #8a8275;

/*
 * AIO OFFICE unified review — the office's shared components, built on the approved root tokens in studio.css
 * (ivory working surfaces, obsidian + gold, Roboto Condensed display / Roboto text, square-rounded 8–10 px controls,
 * status always a word). Viewport compositions follow the approved frame: [data-vp] mobile · tablet · desktop, wide.
 */

/* links and hit targets */
[data-go], [data-sim], [data-act], [data-gap] { cursor: pointer; }
.lnk { color: var(--gold-ink); }

/* breadcrumb + page header */
.pg { display: grid; gap: 10px; padding: 14px 0 6px; }
.pg__top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pg__back { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: #fffdf9; color: var(--ink); padding: 0; }
.pg__back .ico { width: 15px; height: 15px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; font: 600 10px/1.3 var(--text); letter-spacing: 0.12em; color: var(--ink-3); }
.crumbs a { color: var(--gold-ink); }
.crumbs i { display: inline-grid; width: 9px; height: 9px; color: #b9b1a3; }
.crumbs i .ico { width: 9px; height: 9px; }
.pg__main { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pg__text { display: grid; gap: 6px; min-width: 0; }
.pg__title { margin: 0; font: 800 26px/1 var(--cond); letter-spacing: 0.01em; }
.pg__sub { margin: 0; max-width: 680px; font: 400 12px/1.4 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.pg__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pg__acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn--sm { height: 30px; padding: 0 10px; font-size: 10px; }
.btn--sm .ico { width: 13px; height: 13px; }
.btn--icon { width: 30px; padding: 0; }

/* lane band */
.lane-band { position: relative; }
.band__standin { position: absolute; right: 14px; top: 14px; }

/* client context */
.ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--obsidian); color: #f4ead6; box-shadow: 0 6px 18px rgba(20, 16, 10, 0.18); }
.ctx .badge { background: #2b2b2e; color: var(--gold-hi); }
.ctx .badge--pre { background: #3a3833; color: #c9c1b2; }
.ctx__t { display: grid; gap: 3px; min-width: 0; flex: 1 1 160px; }
.ctx__t b { font: 700 14px/1.05 var(--cond); letter-spacing: 0.05em; }
.ctx__t small { font: 500 9.5px/1.2 var(--text); letter-spacing: 0.1em; color: rgba(244, 234, 214, 0.72); }
.ctx__acts { display: flex; gap: 6px; margin-left: auto; }
.ctx .btn { background: #232326; border-color: #3a3a3e; color: #f4ead6; }
.ctx .btn .ico { color: var(--gold); }

/* tabs (lane sections) */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin-top: 12px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; flex: none; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: #fffdf9; font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; color: var(--ink); white-space: nowrap; }
.tab i { font-style: normal; min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; border-radius: 5px; background: #f1ebdf; font: 700 9.5px/1 var(--text); color: var(--ink-2); }
.tab.is-on { background: var(--obsidian); border-color: var(--obsidian); color: var(--nav-gold); }
.tab.is-on i { background: #2b2b2e; color: var(--gold-hi); }
.tab--mute { border-style: dashed; color: #8a8275; }

/* filters */
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line-2); background: #fbf9f5; font: 600 9.5px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-2); }
.fchip i { font-style: normal; font-weight: 700; color: var(--ink); }
.fchip.is-on { background: var(--gold-soft, #faecc8); border-color: #e5c57f; color: #6d4a08; }

/* rows (list on phone, table rows on wider screens) */
.rows { overflow: hidden; }
.rows__empty { padding: 18px 14px; font: 500 11px/1.4 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: 'lead t s' 'lead m s'; gap: 3px 11px; align-items: center; padding: 11px 14px; border-bottom: 1px solid #efe9df; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #fbf3e0; }
.row__lead { grid-area: lead; }
.row__t { grid-area: t; display: grid; gap: 3px; min-width: 0; }
.row__t b { font: 700 12.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.row__t small { font: 400 10.5px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.row__m { grid-area: m; font: 500 9.5px/1.2 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.row__s { grid-area: s; justify-self: end; }
.row > .chev { display: none; }
.row__ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #f6efe0; color: var(--gold-ink); }
.row__ico .ico { width: 18px; height: 18px; }
[data-vp='tablet'] .row, [data-vp='desktop'] .row { grid-template-columns: auto minmax(0, 1.6fr) minmax(0, 1fr) auto 14px; grid-template-areas: 'lead t m s chev'; }
[data-vp='tablet'] .row > .chev, [data-vp='desktop'] .row > .chev { display: block; grid-area: chev; }
[data-vp='tablet'] .row__s, [data-vp='desktop'] .row__s { justify-self: start; }

/* key / value */
.kv { display: grid; gap: 1px; margin: 0; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.kv__i { display: grid; gap: 5px; padding: 11px 13px; background: var(--card); }
.kv dt { font: 600 9px/1 var(--text); letter-spacing: 0.16em; color: var(--ink-3); }
.kv dd { margin: 0; font: 700 12.5px/1.25 var(--cond); letter-spacing: 0.03em; }
.kv dd small { display: block; margin-top: 3px; font: 400 10px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-3); }
.kv--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .kv--3, [data-vp='tablet'] .kv--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 4px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tl__i { position: relative; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid #efe9df; }
.tl__i:last-child { border-bottom: 0; }
.tl__dot { grid-row: span 3; width: 9px; height: 9px; margin-top: 3px; border-radius: 3px; background: linear-gradient(180deg, var(--gold), var(--gold-lo)); }
.tl__w { font: 600 9.5px/1 var(--text); letter-spacing: 0.12em; color: var(--ink-3); }
.tl__t { font: 500 11.5px/1.35 var(--text); letter-spacing: 0.02em; }
.tl__m { font: 500 9.5px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }

/* related records */
.rel { overflow: hidden; }
.rel__i { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: 'l s c' 't s c' 'w s c'; gap: 3px 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid #efe9df; }
.rel__i:last-child { border-bottom: 0; }
.rel__i:hover { background: #fbf3e0; }
.rel__l { grid-area: l; font: 700 9px/1 var(--text); letter-spacing: 0.16em; color: var(--gold-ink); }
.rel__t { grid-area: t; font: 700 12.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.rel__i small { grid-area: w; font: 400 10px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-3); }
.rel__i .st { grid-area: s; }
.rel__i .chev { grid-area: c; }

/* states */
.stb { display: grid; gap: 10px; padding: 16px; border-style: dashed; background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f7f2e8 10px 11px); }
.stb__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.stb__head b { font: 700 14px/1.1 var(--cond); letter-spacing: 0.05em; }
.stb p { margin: 0; font: 400 11.5px/1.5 var(--text); letter-spacing: 0.03em; color: var(--ink-2); max-width: 640px; }
.stb__fields { display: flex; flex-wrap: wrap; gap: 6px; }
.stb__fields span { padding: 5px 8px; border-radius: 6px; border: 1px dashed #cfc6b6; font: 600 9px/1 var(--text); letter-spacing: 0.12em; color: #8a8275; background: #fffdf9; }
.stb__gap { font: 600 9px/1.3 var(--text); letter-spacing: 0.12em; color: #8a8275; }
.notice { border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
.notice--bad { background: var(--bad-bg); color: var(--bad); border-color: #e8c6c2; }
.notice--bad b, .notice--bad .ico { color: var(--bad); }
.notice--gold { background: #fbf3e0; border-color: #ecd59f; }
.design-only { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 9px 12px; border-radius: 10px; background: #19191b; color: #f3dfae; font: 600 9.5px/1.4 var(--text); letter-spacing: 0.1em; }
.design-only .ico { width: 13px; height: 13px; color: var(--gold); flex: none; }
.design-only b { color: var(--gold); }

/* stepper */
.steps { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.steps li { display: flex; align-items: center; gap: 10px; font: 600 10.5px/1.2 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.steps i { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line-2); font: 700 10px/1 var(--text); font-style: normal; background: #fffdf9; }
.steps i .ico { width: 11px; height: 11px; }
.steps .is-done { color: var(--ink-2); }
.steps .is-done i { background: var(--ok-bg); border-color: #b9d8be; color: var(--ok); }
.steps .is-on { color: var(--ink); }
.steps .is-on i { background: linear-gradient(180deg, var(--gold), var(--gold-lo)); border-color: transparent; color: var(--ink); }
[data-vp='desktop'] .steps--h { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
[data-vp='desktop'] .steps--h li { flex-direction: column; text-align: center; font-size: 9px; }

/* split layouts */
.split { display: grid; gap: 16px; align-items: start; }
.split > * { min-width: 0; }
[data-vp='desktop'] .split { grid-template-columns: minmax(0, 1fr) 340px; }
[data-vp='desktop'][data-wide='1'] .split { grid-template-columns: minmax(0, 1fr) 400px; }
[data-vp='tablet'] .split--tab { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.split3 { display: grid; gap: 16px; align-items: start; }
.split3 > * { min-width: 0; }
[data-vp='desktop'] .split3 { grid-template-columns: minmax(0, 1fr) 340px; }
[data-vp='desktop'][data-wide='1'] .split3 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 360px; }
.aside { display: grid; gap: 16px; }
.grid2 { display: grid; gap: 12px; }
[data-vp='tablet'] .grid2, [data-vp='desktop'] .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { display: grid; gap: 12px; }
[data-vp='tablet'] .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='desktop'][data-wide='1'] .grid3 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* stat tiles (lane landings) */
.lstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
[data-vp='tablet'] .lstats, [data-vp='desktop'] .lstats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lstat { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.lstat b { font: 800 26px/0.95 var(--cond); }
.lstat span { font: 700 10px/1.2 var(--cond); letter-spacing: 0.1em; color: var(--ink-2); }
.lstat small { font: 500 9px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.lstat--bad b { color: var(--bad); }
.lstat--none b { font-size: 13px; line-height: 1.2; color: #8a8275; }

/* kanban board (dispatch, factoring, insurance pipeline) */
.board { display: grid; gap: 10px; }
[data-vp='tablet'] .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .board { grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
.col { display: grid; gap: 8px; align-content: start; padding: 10px; border-radius: 12px; background: #efe9de; }
.col__h { display: flex; justify-content: space-between; align-items: center; font: 700 10px/1 var(--cond); letter-spacing: 0.14em; color: var(--ink-2); padding: 2px 2px 4px; }
.col__h i { font-style: normal; color: var(--ink-3); }
.card { display: grid; gap: 6px; padding: 11px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.card:hover { border-color: var(--gold-lo); }
.card b { font: 700 12.5px/1.1 var(--cond); letter-spacing: 0.04em; }
.card small { font: 400 10px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.card__m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 600 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }

/* fleet cards (vehicles & fleet) */
.fleet { display: grid; gap: 10px; grid-template-columns: repeat(1, minmax(0, 1fr)); }
[data-vp='tablet'] .fleet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .fleet { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='desktop'][data-wide='1'] .fleet { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.unit { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.unit:hover { border-color: var(--gold-lo); }
.unit__top { display: flex; align-items: center; gap: 10px; }
.unit__ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--obsidian); color: var(--gold); }
.unit__ico .ico { width: 22px; height: 22px; }
.unit__t { display: grid; gap: 3px; min-width: 0; }
.unit__t b { font: 800 16px/1 var(--cond); letter-spacing: 0.04em; }
.unit__t small { font: 500 10px/1.2 var(--text); letter-spacing: 0.06em; color: var(--ink-2); }
.unit__links { display: flex; flex-wrap: wrap; gap: 5px; }
.unit__links span { display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 5px; background: #f6f1e7; font: 600 8.5px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-2); }
.unit__links span.is-warn { background: var(--warn-bg); color: var(--warn); }
.unit__links span.is-bad { background: var(--bad-bg); color: var(--bad); }

/* readiness */
.meter { height: 8px; border-radius: 4px; background: #efe9de; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #f0c461, #e3a637); border-radius: 4px; }

/* document preview */
.doc { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.doc__sheet { position: relative; display: grid; align-content: start; gap: 7px; height: 140px; padding: 16px 12px; border-radius: 6px; background: #fff; border: 1px solid #e3ddd1; box-shadow: 0 6px 16px rgba(70, 48, 18, 0.1); }
.doc__sheet i { display: block; height: 6px; border-radius: 3px; background: #ece6da; }
.doc__sheet i.s { width: 60%; }
.doc--missing .doc__sheet { place-items: center; align-content: center; border-style: dashed; background: #faf7f1; }
.doc--missing .doc__sheet span { font: 700 9px/1.2 var(--text); letter-spacing: 0.14em; color: var(--bad); text-align: center; }
.doc__meta { display: grid; gap: 6px; justify-items: start; }
.doc__meta b { font: 700 14px/1.15 var(--cond); letter-spacing: 0.04em; }
.doc__meta small { font: 500 10px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
[data-vp='desktop'] .doc--big { grid-template-columns: 260px minmax(0, 1fr); }
[data-vp='desktop'] .doc--big .doc__sheet { height: 330px; gap: 11px; padding: 28px 22px; }

/* message thread */
.msgs { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 11px 13px; border-radius: 12px; display: grid; gap: 5px; }
.msg b { font: 700 10px/1 var(--text); letter-spacing: 0.12em; }
.msg span { font: 400 12px/1.45 var(--text); letter-spacing: 0.02em; }
.msg small { font: 500 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.msg--client { background: var(--card); border: 1px solid var(--line); justify-self: start; }
.msg--staff { background: #fbf0d6; border: 1px solid #ecd59f; justify-self: end; }
.msg--internal { background: repeating-linear-gradient(135deg, #2a2a2d 0 8px, #262629 8px 9px); color: #f3dfae; justify-self: stretch; max-width: none; border-left: 4px solid var(--gold); }
.msg--internal small { color: rgba(243, 223, 174, 0.7); }
.composer { display: flex; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.composer span:first-child { flex: 1; font: 400 11px/1 var(--text); letter-spacing: 0.06em; color: var(--ink-4); }

/* search + switcher + confirm sheets (inside the device) */
.ovl { position: fixed; inset: 0; z-index: 60; background: rgba(17, 15, 12, 0.5); }
.ovl__panel { position: fixed; z-index: 61; left: 50%; top: 70px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 120px); overflow: auto; padding: 14px; border-radius: 14px; background: var(--page); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); display: grid; gap: 10px; }
.ovl__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ovl__input { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--gold-lo); background: #fffdf9; }
.ovl__input input { flex: 1; border: 0; background: none; outline: none; font: 500 13px/1 var(--text); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); min-width: 0; }
.sim-note { padding: 10px 12px; border-radius: 10px; background: #19191b; color: #f3dfae; font: 600 10px/1.45 var(--text); letter-spacing: 0.08em; }
.sim-note b { color: var(--gold); }

/* misc */
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.big-n { font: 800 34px/0.95 var(--cond); }
.muted { color: var(--ink-3); }
.mb0 { margin-bottom: 0; }
.embed { display: grid; gap: 10px; }
.embed__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--obsidian); color: #f3dfae; font: 600 10px/1.4 var(--text); letter-spacing: 0.1em; }
.embed__bar b { color: var(--gold); }
.embed__shot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); }
.embed__shot img { width: 100%; height: auto; }
.flow-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.flow-steps { display: flex; gap: 4px; flex-wrap: wrap; }
.flow-steps a { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line-2); background: #fffdf9; font: 700 10px/1 var(--text); color: var(--ink-2); }
.flow-steps a.is-on { background: var(--obsidian); color: var(--gold); border-color: var(--obsidian); }
.cards-ln { display: grid; gap: 10px; }
[data-vp='tablet'] .cards-ln { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .cards-ln { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pathc { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pathc:hover { border-color: var(--gold-lo); }
.pathc__img { height: 90px; border-radius: 8px; overflow: hidden; background: #e9e3d8; }
.pathc__img img { width: 100%; height: 100%; object-fit: cover; }
.pathc b { font: 800 16px/1 var(--cond); letter-spacing: 0.04em; }
.pathc small { font: 400 11px/1.4 var(--text); letter-spacing: 0.02em; color: var(--ink-2); }
.gate { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #fbf3e0; border: 1px solid #ecd59f; margin-top: 12px; }
.gate .ico { width: 18px; height: 18px; color: var(--gold-ink); flex: none; margin-top: 1px; }
.gate b { display: block; font: 700 12px/1.2 var(--cond); letter-spacing: 0.06em; }
.gate span { font: 400 11px/1.45 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }

[data-vp='mobile'] .pg__title { font-size: 24px; }
[data-vp='desktop'] .pg__title { font-size: 34px; }
[data-vp='desktop'] .pg { padding-top: 20px; }

/* actions column (records) */
.acts { display: grid; overflow: hidden; }
.acts__h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px; border-bottom: 1px solid #efe9df; }
.acts__h b { font: 700 12px/1 var(--cond); letter-spacing: 0.12em; }
.acts__i { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 3px 10px; padding: 11px 14px; border-bottom: 1px solid #efe9df; font: 700 11.5px/1.15 var(--cond); letter-spacing: 0.06em; }
.acts__i .ico { width: 16px; height: 16px; color: var(--gold-ink); grid-row: span 2; }
.acts__i small { grid-column: 2; font: 400 9.5px/1.35 var(--text); letter-spacing: 0.03em; color: var(--ink-3); }
.acts__i:hover { background: #fbf3e0; }
.acts__i--pri { background: linear-gradient(180deg, #fbefcf, #f8e6bb); }
.acts__i--off { grid-template-columns: minmax(0, 1fr); color: #8a8275; cursor: default; background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f7f2e8 10px 11px); }
.acts__i--off small { grid-column: 1; }
.acts__i--off:hover { background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f7f2e8 10px 11px); }
.acts__note { display: flex; gap: 8px; align-items: center; padding: 10px 14px; font: 600 9px/1.35 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.acts__note .ico { width: 13px; height: 13px; }
.tag-vis--sim { background: #19191b; color: var(--gold); }

/* overlays */
.ovl__t { font: 800 16px/1 var(--cond); letter-spacing: 0.06em; }
.ovl__p { margin: 0; font: 400 11.5px/1.5 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.ovl__results .rows { max-height: none; }
[data-vp='mobile'] .ovl__panel--sheet { top: auto; bottom: 0; transform: translateX(-50%); width: 100%; border-radius: 16px 16px 0 0; padding-bottom: 26px; }

/* page rhythm */
.stack { display: grid; gap: 16px; align-content: start; }
.stack > .sec, .aside > .sec { margin-top: 0; }
.ret { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.links { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='tablet'] .links { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='desktop'] .links { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lk { display: grid; gap: 6px; align-content: start; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 92px; }
.lk[data-go]:hover { border-color: var(--gold-lo); }
.lk__l { display: flex; align-items: center; gap: 6px; font: 700 9px/1 var(--text); letter-spacing: 0.16em; color: var(--gold-ink); }
.lk__l .ico { width: 14px; height: 14px; }
.lk b { font: 700 12.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.lk--none { background: #faf7f1; border-style: dashed; box-shadow: none; }
.lk--none b { color: #8a8275; }
.check { display: grid; overflow: hidden; }
.check__i { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #efe9df; }
.check__i:last-child { border-bottom: 0; }
.check__i b { font: 700 12px/1.15 var(--cond); letter-spacing: 0.04em; }
.check__i small { display: block; font: 400 9.5px/1.3 var(--text); letter-spacing: 0.04em; color: var(--ink-3); margin-top: 2px; }
.check__m { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line-2); }
.check__m .ico { width: 12px; height: 12px; }
.check__m--ok { background: var(--ok-bg); border-color: #b9d8be; color: var(--ok); }
.check__m--bad { background: var(--bad-bg); border-color: #e8c6c2; color: var(--bad); }
.check__m--gold { background: #fbf0d6; border-color: #ecd59f; color: var(--gold-ink); }
.win { display: grid; gap: 10px; }
[data-vp='tablet'] .win, [data-vp='desktop'] .win { grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; }
.win__h { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 6px; font: 700 10px/1 var(--cond); letter-spacing: 0.14em; color: var(--ink-2); }
.win__h i { font-style: normal; color: var(--ink-3); }
.phone-shot { width: 100%; max-width: 360px; margin: 0 auto; border-radius: 26px; overflow: hidden; border: 8px solid #141416; box-shadow: 0 16px 40px rgba(20, 16, 10, 0.25); background: #fff; }
.phone-shot img { width: 100%; height: auto; }
.flowv { display: grid; gap: 16px; align-items: start; }
[data-vp='tablet'] .flowv { grid-template-columns: 340px minmax(0, 1fr); }
[data-vp='desktop'] .flowv { grid-template-columns: 380px minmax(0, 1fr); }
[data-vp='desktop'][data-wide='1'] .flowv { grid-template-columns: 420px minmax(0, 1fr) 420px; }
.ext { display: inline-flex; align-items: center; gap: 6px; color: var(--gold-ink); font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; text-decoration: underline; text-underline-offset: 3px; }
.mig-hero { position: relative; }
.paths { display: grid; gap: 10px; }
[data-vp='tablet'] .paths, [data-vp='desktop'] .paths { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ftypes { display: flex; flex-wrap: wrap; gap: 8px; }
.ftypes span { display: inline-grid; place-items: center; min-width: 56px; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fffdf9; font: 700 10px/1 var(--cond); letter-spacing: 0.1em; }
.provs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.provs span { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: #fffdf9; font: 700 9.5px/1 var(--cond); letter-spacing: 0.08em; }
.provs img { width: 18px; height: 18px; object-fit: contain; }
.secure { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 12px; align-items: center; padding: 14px; }
.secure img { width: 100%; height: 86px; object-fit: cover; border-radius: 8px; }
.secure b { display: block; font: 800 14px/1.1 var(--cond); letter-spacing: 0.05em; margin-bottom: 4px; }
.secure span { font: 400 11px/1.45 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.cta-wide { display: flex; justify-content: center; margin-top: 14px; }
.cta-wide .btn { width: 100%; max-width: 560px; height: 48px; justify-content: center; font-size: 13px; }
.thumbs { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='tablet'] .thumbs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
[data-vp='desktop'] .thumbs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
[data-vp='desktop'][data-wide='1'] .thumbs { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.thumb { display: grid; gap: 6px; align-content: start; }
.thumb__img { aspect-ratio: 853 / 1536; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); }
.thumb__img img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.thumb:hover .thumb__img { border-color: var(--gold-lo); }
.thumb b { font: 700 9.5px/1.2 var(--cond); letter-spacing: 0.08em; }

function laneSignals(l, compact) {
  if (l.none) return [`<span class="sig sig--mute">NO STAFF WORKSPACE YET</span>`];
  const out = [];
  if (l.att === null) out.push(`<span class="sig sig--mute">${compact ? 'NOT CONNECTED YET' : 'ATTENTION NOT CONNECTED YET'}</span>`);
  else if (l.att === 0) out.push(`<span class="sig sig--ok">NOTHING NEEDS ATTENTION</span>`);
  else out.push(`<span class="sig sig--warn">${l.att} NEED${l.att === 1 ? 'S' : ''} ATTENTION</span>`);
  if (l.blocked) out.push(`<span class="sig sig--bad">${l.blocked} BLOCKED</span>`);
  return out;
}

/* ═══════════════ mount ═══════════════ */
async function mount() {
  const sheet = await (await fetch(`${P}/migration/icons/aio-icon-sheet.svg`)).text();
  const holder = document.createElement('div');
  holder.style.display = 'none';
  holder.innerHTML = sheet;
  document.body.appendChild(holder);
  const body = { home, work, reports, more, kit }[PAGE]();
  const app = document.createElement('div');
  app.className = 'ao';
  app.innerHTML = PAGE === 'kit' ? body : `${header()}${nav()}${body}`;
  document.body.appendChild(app);
  if (VP === 'desktop' && WIDE) document.documentElement.style.setProperty('--pad-x', '24px');
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
  document.documentElement.dataset.ready = '1';
}
if (!EMBED) mount();

  const [type, id] = key.split(':');
  const r = rec(type, id);
  if (!r) return null;
  return { lane: OWNER_LABEL[type], title: RECORD_TYPES[type].title(r), go: recRoute(type, id), why, status: statusOf(type, r, statusWord(r)) };
}
/** A linked card on a record: what this record is connected to in another service (or that nothing is). */

  if (!item) return `<div class="lk lk--none"><span class="lk__l">${ico(icon)}${label}</span><b>${none}</b></div>`;
  return `<div class="lk" data-go="${item.go}"><span class="lk__l">${ico(icon)}${label}</span><b>${item.title}</b>${item.status ? st(item.status) : ''}</div>`;
}

    });

  thread(t) {
    meta('MESSAGES › CONVERSATION', 'NEW · FOR REVIEW', 'LIVE: PARTIAL · MESSAGES');

      .map(([k, who, text, when]) => `<div class="msg msg--${k}"><b>${k === 'internal' ? `INTERNAL NOTE · ${who}` : who}</b><span>${text}</span><small>${when}</small></div>`)

};

];
const migStatus = (m) => SESSION.status[`mig:${m.id}`] ?? m.stage;
const migLife = (m) => SESSION.status[`miglife:${m.id}`]?.[0] ?? m.life;
const migIdx = (life) => MIG_LIFE.findIndex(([k]) => k === life);
const branchScreens = (b) => MIG_SCREENS.filter((s) => s.branch === b);
const screenAt = (id) => {
  const s = MIG_SCREENS.find((x) => x.id === id);

const GATE = `<div class="gate">${ico('lock')}<div><b>STAFF PREPARATION DOES NOT MAKE A CLIENT ACTIVE.</b><span>APPROVAL LANDS A CLIENT ON PREBUILT. THE CLIENT IS INVITED AND CONFIRMS THEIR OWN INFORMATION — ONLY THAT CONFIRMATION MAKES THEM ACTIVE.</span></div></div>`;
const caseRow = (m) => ({ go: `intake/case/${m.id}`, lead: icoTile(MIG_BRANCH[m.branch][3]), title: m.name, sub: `${MIG_BRANCH[m.branch][0]} · ${m.files} FILES · ${m.source}`, meta: `${staffName(m.owner)} · STARTED ${m.started}`, status: migStatus(m) });

function intakePage(r) {
  const [, a, b, c] = r.seg;
  if (!a) return intakeRoot();
  if (a === 'case') return intakeCase(b, r);
  if (a === 'flow') return flowViewer(b, Number(c) || 0, r);
  if (INTAKE_SECTIONS.some(([k]) => k === a)) return intakeSection(a);
  return missing(r);
}

/* ── the approved flow, one authority screen at a time ── */
function flowViewer(branch, n, r) {
  const list = branchScreens(branch);
  if (!list.length) return missing(r);
  const i = Math.max(0, Math.min(n, list.length - 1));
  const s = list[i];
  const [bt, bs] = MIG_BRANCH[branch];
  const client = branch === 'activation';
  meta(`INTAKE › ${bt} › ${s.name}`, 'APPROVED AUTHORITY', `LIVE: ${s.route}`, `${s.id} — the approved screen, unchanged. ${client ? 'It shows the client office.' : 'It predates the five-root decision, so its own dock still shows FILING; the office navigation around it is the approved five roots, and the live React flow renders the current dock.'}`);
  const life = MIG_LIFE.find(([k]) => k === s.life);
  const gate = ['PREBUILT', 'CLIENT_CONFIRMATION_REQUIRED'].includes(s.life) ? GATE : '';
  const nav = `<div class="flow-nav">${i > 0 ? `<span class="btn" data-go="intake/flow/${branch}/${i - 1}">${ico('back')}PREVIOUS</span>` : ''}${i < list.length - 1 ? `<span class="btn btn--gold" data-go="intake/flow/${branch}/${i + 1}">NEXT · ${list[i + 1].name} ${ico('fwd')}</span>` : `<span class="btn btn--gold" data-go="intake">${ico('pass')}BACK TO INTAKE</span>`}</div>`;
  const detail = `<div class="flowd panel" style="padding:16px">
      <div class="pg__chips">${st([`STEP ${i + 1} OF ${list.length}`, 'gold'])}${life ? st([life[1], s.life === 'ACTIVE' ? 'ok' : s.life === 'PREBUILT' ? 'mute' : 'gold']) : ''}${client ? st(['CLIENT OFFICE', 'mute']) : ''}</div>
      <h2 class="flowd__t">${s.name}</h2>
      <p class="sec__sub">${client ? 'SHOWN FROM THE CLIENT’S OFFICE. STAFF SEE IT; ONLY THE CLIENT ACTS ON IT.' : 'WHAT STAFF CAN DO ON THIS SCREEN:'}</p>
      <ul>${s.interactions.map((x) => `<li>${ico('pass')}${x.toUpperCase()}</li>`).join('')}</ul>
      ${nav}

    INTAKE_IN_PROGRESS: [{ label: 'CHECK THE CLASSIFICATIONS', sim: 'mig-cls', ico: 'search', effect: 'CONFIRM WHAT AIO READ FROM EACH FILE.' }],
    MIGRATION_REVIEW_REQUIRED: m.conflicts
      ? [{ label: 'SETTLE CONFLICTS', sim: 'mig-conf', ico: 'filter', effect: 'DECIDE EACH CONFLICT; NOTHING IS MERGED SILENTLY.' }, { label: 'SEND FOR FOUNDER REVIEW', sim: 'mig-send', effect: 'PUT THE CASE IN THE FOUNDER REVIEW QUEUE.' }]
      : [
          { label: 'APPROVE · LANDS ON PREBUILT', sim: 'mig-approve', ico: 'pass', founder: true, effect: 'CREATE THE CLIENT AS PREBUILT — PREPARED, NOT ACTIVE. NO SERVICE STARTS.', set: `mig:${m.id}=PREBUILT · NOT ACTIVE YET|mute;miglife:${m.id}=PREBUILT` },
          { label: 'SEND BACK TO STAFF', sim: 'mig-back', founder: true, effect: 'RETURN THE CASE WITH NOTES.' },
          ...(FOUNDER ? [] : [{ label: 'SEND FOR FOUNDER REVIEW', sim: 'mig-send', effect: 'PUT THE CASE IN THE FOUNDER REVIEW QUEUE.' }]),
        ],
    PREBUILT: [{ label: 'SEND ACTIVATION INVITE', sim: 'mig-invite', ico: 'letter', effect: 'EMAIL THE CLIENT A SECURE LINK TO REVIEW AND CONFIRM THEIR INFORMATION.', set: `mig:${m.id}=INVITED · AWAITING CLIENT|gold;miglife:${m.id}=CLIENT_CONFIRMATION_REQUIRED` }, { label: 'MARK ACTIVE', off: 'ONLY THE CLIENT’S CONFIRMATION MAKES A CLIENT ACTIVE' }],
    CLIENT_CONFIRMATION_REQUIRED: [{ label: 'RESEND INVITE', sim: 'mig-resend', ico: 'letter', effect: 'SEND THE SAME SECURE LINK AGAIN.' }, { label: 'CONFIRM ON THE CLIENT’S BEHALF', off: 'NOT ALLOWED — THE CLIENT CONFIRMS IN THEIR OWN OFFICE' }],
    ACTIVE: [{ label: 'NOTHING LEFT TO DO', off: 'THE CLIENT CONFIRMED · ACTIVE' }],
  }[life];
  const main = `${section('LIFECYCLE', 'WHERE THIS CLIENT IS. STAFF WORK STOPS AT PREBUILT.', stepper(MIG_LIFE.map(([, t]) => t), migIdx(life)))}
    ${section('THE CASE', '', kv([['PATH', MIG_BRANCH[m.branch][0]], ['SOURCE', m.source], ['FILES', String(m.files)], ['WHAT AIO FOUND', m.found], ['CONFLICTS', String(m.conflicts)], ['OWNER', staffName(m.owner)], ['STARTED', m.started], ['CLIENT RECORD', m.client ? `<a class="lnk" data-go="client/${m.client}">${clientName(m.client)}</a>` : 'NONE UNTIL APPROVAL LANDS ON PREBUILT']], 2))}
    ${section('APPROVED SCREEN FOR THIS STEP', 'THE AUTHORITY SCREEN STAFF USE HERE.', `<div class="grid2"><div class="thumb" data-go="intake/flow/${b}/${idx}" style="max-width:220px"><div class="thumb__img"><img src="mig/${m.screen}.jpg" alt=""></div><b>${MIG_SCREENS.find((s) => s.id === m.screen)?.name ?? ''}</b><small>OPEN FULL SIZE</small></div>${['PREBUILT', 'CLIENT_CONFIRMATION_REQUIRED'].includes(life) ? GATE : ''}</div>`)}`;
  const head = pageHead({ trail: [['INTAKE', 'intake'], [INTAKE_SECTIONS.find(([k]) => k === m.section)?.[1] ?? 'CASES', `intake/${m.section}`], [m.name]], title: m.name, sub: `${MIG_BRANCH[m.branch][0]} · SAMPLE CASE`, chips: [migStatus(m)], actions: VP === 'desktop' ? '' : actionsBar(acts.filter((a) => !a.off).slice(0, 1)) });
  return `<main class="main">${head}${m.client ? ctxBar(m.client) : ''}<div class="split" style="margin-top:14px"><div class="stack">${main}${section('HISTORY', '', timeline(histFor(`mig:${m.id}`, [[m.confirmed ?? 'OCT 7, 2026', m.confirmed ? 'CLIENT CONFIRMED — ACTIVE' : 'CASE UPDATED', m.confirmed ? 'CLIENT' : staffName(m.owner), m.confirmed ? 'client' : 'internal'], [m.started, `${m.files} FILES RECEIVED`, staffName(m.owner), 'internal']])))}</div>
    <aside class="aside">${actionsPanel(acts)}${m.client ? section('RELATED', '', related([{ lane: 'CLIENT 360', title: clientName(m.client), go: `client/${m.client}`, why: LIFE[client(m.client).life][0] }])) : ''}</aside></div></main>`;
}


/*
 * AIO OFFICE unified review — WORK. MY WORK, ALL OPEN WORK and the twelve lane workspaces. Each lane is purpose-built
 * from its own contract (records, statuses, sections) — a load board for DISPATCH, expiry windows for COMPLIANCE, a
 * close stepper for BOOKKEEPING, readiness meters for ROAD READY — and every lane shares one grammar: the lane band
 * (its own photograph from WORK), section tabs, a landing, queues, a directory, record pages, and honest states for
 * sections the product has not built. An "@client" route filters a lane to one client (the client context).
 */
const withCtx = (route, r) => `${route}${r.client ? `@${r.client}` : ''}`;
const forClient = (list, r) => (r.client ? list.filter((x) => x.client === r.client) : list);
const vals = (o) => Object.values(o);

function laneFrame(slug, r, { tab, tabsList, kicker, title, sub, body }) {
  const l = laneBySlug(slug);
  const cur = tabsList.find(([k]) => k === tab);
  const c = r.client && client(r.client);
  const filtered = c ? `${ctxBar(r.client)}<div class="notice panel honest notice--gold" style="margin-top:8px">${ico('filter')}<span>SHOWING ${c.name} ONLY. CLEAR THE CLIENT TO SEE EVERY CLIENT IN THIS LANE.</span></div>` : '';
  return `<main class="main">${laneBand(l, kicker, title, sub)}
    <div class="after-band"><div class="panel" style="padding:10px 12px"><div class="pg__top"><button class="pg__back" data-act="back" aria-label="Back">${ico('back')}</button>${crumbs([['WORK', 'work'], [l.name, withCtx(`work/${slug}`, r)], ...(cur && cur[0] !== tabsList[0][0] ? [[cur[1]]] : [])])}<span style="margin-left:auto">${sample()}</span></div>
    ${tabs(tabsList.map(([k, t, n, tone]) => [k, t, n, withCtx(k === tabsList[0][0] ? `work/${slug}` : `work/${slug}/${k}`, r), tone]), tab)}</div></div>
    ${filtered}${returnBar()}<div style="margin-top:14px">${body}</div></main>`;
}
const lstat = (n, label, s = '', tone = '', go = '') => `<div class="lstat ${tone ? `lstat--${tone}` : ''}" ${go ? `data-go="${go}"` : ''}><b>${n}</b><span>${label}</span>${s ? `<small>${s}</small>` : ''}</div>`;
const serviceChips = (names) => `<div class="pill-row" style="margin-bottom:12px">${SERVICES.filter(([n]) => names.includes(n)).map(([n, w, t]) => st([`${n} · ${w}`, t])).join('')}</div>`;
const recRow = (type) => (x) => ({ go: recRoute(type, x.id), lead: badge(client(x.client)), title: RECORD_TYPES[type].title(x), sub: clientName(x.client), meta: x.due ? `DUE ${x.due}` : x.exp ? `EXPIRES ${x.exp}` : '', status: statusOf(type, x, statusWord(x)) });

function workPage(r) {
  const [, lane, tab] = r.seg;
  if (lane === 'mine') return myWorkPage(r);
  if (lane === 'queue') return allOpenWork(r);
  const L = LANE_PAGES[lane];
  if (!L) return missing(r);
  return L(tab, r);
}

/* ── MY WORK and ALL OPEN WORK ── */
const MY_WORK = [
  ['request', 'req-hf-mc', 'DUE OCT 10'],
  ['policy', 'pol-dh', 'DUE OCT 14'],
  ['quarter', 'ifta-rl-q3', 'DUE OCT 31'],
  ['deadline', 'dl-abc-med', 'DUE OCT 29'],
  ['thread', 'th-mt', 'REPLY TODAY'],
  ['document', 'doc-tk-1', 'REVIEW TODAY'],
  ['shipment', 'sh-4471', 'DEMO · PAUSED'],
];
function myWorkPage(r) {
  meta('WORK › MY WORK', 'NEW · FOR REVIEW', 'LIVE: PARTIAL — ASSIGNMENT EXISTS IN SOME LANES ONLY');
  const items = MY_WORK.map(([type, id, due]) => ({ type, r: rec(type, id), due })).filter((x) => !r.filter || RECORD_TYPES[x.type].lane === r.filter || (r.filter === 'other' && !RECORD_TYPES[x.type].lane));
  const lanesIn = [...new Set(MY_WORK.map(([t]) => RECORD_TYPES[t].lane || 'other'))];
  return `<main class="main">${pageHead({ trail: [['WORK', 'work'], ['MY WORK']], title: 'MY WORK', sub: 'EVERYTHING ASSIGNED TO YOU, ACROSS LANES. EACH ROW OPENS ITS CASE.', chips: [['SAMPLE', 'mute']] })}
    <div class="lstats">${lstat(7, 'ASSIGNED TO YOU')}${lstat(3, 'DUE THIS WEEK')}${lstat(1, 'BLOCKED', 'WAITING ON THE CLIENT', 'bad', 'rec/request/req-hf-mc')}${lstat(1, 'PAUSED SERVICE', 'BROKERAGE DEMO', '', 'work/brokerage')}</div>
    ${filterChips([['all', 'ALL', MY_WORK.length], ...lanesIn.map((l) => [l, l === 'other' ? 'DOCUMENTS & MESSAGES' : laneLabel(l), MY_WORK.filter(([t]) => (RECORD_TYPES[t].lane || 'other') === l).length])], r.filter || 'all', 'work/mine')}
    ${rows(items.map((x) => ({ go: recRoute(x.type, x.r.id), lead: icoTile(OWNER_ICON[x.type]), title: RECORD_TYPES[x.type].title(x.r), sub: `${OWNER_LABEL[x.type]} · ${clientName(x.r.client)}`, meta: x.due, status: statusOf(x.type, x.r, statusWord(x.r)) })))}
    ${notice('DRIVERS & CARRIERS AND MECHANIC / MAINTENANCE DO NOT ASSIGN WORK TO STAFF YET.')}</main>`;
}
function openWorkList() {
  const out = [];
  for (const [type, def] of Object.entries(RECORD_TYPES)) {
    if (!def.lane || ['vehicle', 'driver', 'profile', 'subscription'].includes(type)) continue;
    for (const x of vals(def.table)) {
      const s = statusOf(type, x, statusWord(x));
      if (isOpen(s)) out.push({ type, x, s, lane: def.lane });
    }
  }
  return out;
}
function allOpenWork(r) {
  meta('WORK › ALL OPEN WORK', 'NEW · FOR REVIEW', 'LIVE: NOT BUILT — NO CROSS-LANE QUEUE YET', 'Reads each lane’s own records; nothing is copied into a second queue.');
  const all = openWorkList().filter((w) => !r.client || w.x.client === r.client);
  const list = all.filter((w) => !r.filter || w.lane === r.filter);
  const lanes = [...new Set(all.map((w) => w.lane))];
  return `<main class="main">${pageHead({ trail: [['WORK', 'work'], ['ALL OPEN WORK']], title: 'ALL OPEN WORK', sub: 'SEARCH, FILTER AND SORT OPEN WORK ACROSS CLIENTS. SORTED BY STATUS, MOST URGENT FIRST.', chips: [['SAMPLE', 'mute']], actions: `<span class="btn btn--sm" data-act="search">${ico('search')}SEARCH</span><span class="btn btn--sm" data-act="switch">${ico('people')}CLIENT</span>` })}
    ${r.client ? ctxBar(r.client) : ''}
    ${filterChips([['all', 'ALL LANES', all.length], ...lanes.map((l) => [l, laneLabel(l), all.filter((w) => w.lane === l).length])], r.filter || 'all', 'work/queue')}
    ${rows(
      list
        .sort((a, b) => ['bad', 'warn', 'gold', 'mute'].indexOf(a.s[1]) - ['bad', 'warn', 'gold', 'mute'].indexOf(b.s[1]))
        .map((w) => ({ go: recRoute(w.type, w.x.id), lead: icoTile(OWNER_ICON[w.type]), title: RECORD_TYPES[w.type].title(w.x), sub: clientName(w.x.client), meta: `${laneLabel(w.lane)}${w.x.owner ? ` · ${staffName(w.x.owner)}` : ''}`, status: w.s })),
      'NOTHING OPEN',
    )}</main>`;
}

    meta(`WORK › PERMITTING & AUTHORITIES${tab !== 'overview' ? ` › ${SEC[tab] ?? tab}` : ''}`, tab === 'boc3' ? 'HONEST STATE' : 'NEW · FOR REVIEW', tab === 'boc3' ? 'LIVE: NOT BUILT — PARTNER / MANUAL WORKFLOW' : 'LIVE: PARTIAL · SERVICE REQUESTS');
