[data-vp='desktop'] .head__field {
  flex: 0 1 370px;
  min-width: 160px;
}
[data-vp='desktop'] .head__bell {
  width: 28px;
  height: 28px;
  margin-left: 30px;
}
[data-vp='desktop'] .head__bell .ico {
  width: 24px;
  height: 24px;
}
[data-vp='desktop'] .head__rule {
  margin-left: 30px;
}
[data-vp='desktop'] .head__avatar {
  width: 54px;
  height: 54px;
  margin-left: 20px;
}
[data-vp='desktop'] .head__avatar span {
  font-size: 17px;
}
[data-vp='desktop'] .head__who {
  width: 100px;
  margin-left: 14px;
  gap: 5px;
}
[data-vp='desktop'] .head__who b {
  font: 500 16px/1.1 var(--text);
  letter-spacing: 0.08em;
}
[data-vp='desktop'] .head__who span {
  font: 500 12px/1.1 var(--text);
  letter-spacing: 0.16em;
}
[data-vp='desktop'] .head__chev {
  width: 15px;
  height: 15px;
  margin-left: 7px;
}
[data-vp='desktop'] .side {
  top: 68px;
}
[data-vp='desktop'] .main {
  margin-left: 138px;
  padding: 0 var(--pad-x, 16px) 40px;
}
[data-vp='desktop'] .bleed {
  margin: 0 calc(-1 * var(--pad-x, 16px));
}
[data-vp='desktop'] .hero {
  height: 300px;
  padding: 44px 48px 0;
}
[data-vp='desktop'] .hero__kicker {
  font-size: 15px;
  letter-spacing: 0.22em;
}
[data-vp='desktop'] .hero__title {
  margin-top: 10px;
  font-size: 56px;
  line-height: 50px;
}
[data-vp='desktop'] .hero__sub {
  max-width: 420px;
  margin-top: 10px;
  font-size: 15px;
  line-height: 21px;
}
[data-vp='desktop'] .band {
  height: 214px;
  padding: 36px 48px 0;
}
[data-vp='desktop'] .band .hero__title {
  font-size: 46px;
  line-height: 42px;
}
[data-vp='desktop'] .band .hero__sub {
  max-width: 560px;
}
[data-vp='desktop'] .measure {
  max-width: 1480px;
  margin: 0 auto;
}
/* the plate stays full-bleed; its words align with the content measure (ultra-wide) */
[data-vp='desktop'] .plate {
  padding-left: max(48px, calc((var(--dw) - 138px - 2 * var(--pad-x, 16px) - 1480px) / 2 + var(--pad-x, 16px) + 32px));
}
[data-wide='1'] .hero {
  height: 360px;
}
.lock--split {
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr);
  column-gap: 32px;
}
.lock__areas {
  grid-column: 2;
  grid-row: 1 / span 5;
  align-self: start;
  padding: 14px;
  border-radius: 10px;
  background: #f7f3eb;
  border: 1px dashed var(--line-2);
}
.lock__areas h4 {
  margin: 0 0 10px;
  font: 700 10px/1.3 var(--text);
  letter-spacing: 0.16em;
  color: var(--ink-3);
}
.lock__areas div {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
[data-vp='desktop'] .sec__title {
  font-size: 20px;
}
[data-vp='desktop'] .after-band {
  margin-top: -24px;
  position: relative;
  z-index: 2;
}

/*
 * AIO OFFICE unified review — the office's shared components, built on the approved root tokens in studio.css
 * (ivory working surfaces, obsidian + gold, Roboto Condensed display / Roboto text, square-rounded 8–10 px controls,
 * status always a word). Viewport compositions follow the approved frame: [data-vp] mobile · tablet · desktop, wide.
 */

/* links and hit targets */
[data-go], [data-sim], [data-act], [data-gap] { cursor: pointer; }
.lnk { color: var(--gold-ink); }

/* breadcrumb + page header */
.pg { display: grid; gap: 10px; padding: 14px 0 6px; }
.pg__top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pg__back { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: #fffdf9; color: var(--ink); padding: 0; }
.pg__back .ico { width: 15px; height: 15px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; font: 600 10px/1.3 var(--text); letter-spacing: 0.12em; color: var(--ink-3); }
.crumbs a { color: var(--gold-ink); }
.crumbs i { display: inline-grid; width: 9px; height: 9px; color: #b9b1a3; }
.crumbs i .ico { width: 9px; height: 9px; }
.pg__main { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pg__text { display: grid; gap: 6px; min-width: 0; }
.pg__title { margin: 0; font: 800 26px/1 var(--cond); letter-spacing: 0.01em; }
.pg__sub { margin: 0; max-width: 680px; font: 400 12px/1.4 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.pg__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pg__acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn--sm { height: 30px; padding: 0 10px; font-size: 10px; }
.btn--sm .ico { width: 13px; height: 13px; }
.btn--icon { width: 30px; padding: 0; }

/* lane band */
.lane-band { position: relative; }
.band__standin { position: absolute; right: 14px; top: 14px; }

/* client context */
.ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--obsidian); color: #f4ead6; box-shadow: 0 6px 18px rgba(20, 16, 10, 0.18); }
.ctx .badge { background: #2b2b2e; color: var(--gold-hi); }
.ctx .badge--pre { background: #3a3833; color: #c9c1b2; }
.ctx__t { display: grid; gap: 3px; min-width: 0; flex: 1 1 160px; }
.ctx__t b { font: 700 14px/1.05 var(--cond); letter-spacing: 0.05em; }
.ctx__t small { font: 500 9.5px/1.2 var(--text); letter-spacing: 0.1em; color: rgba(244, 234, 214, 0.72); }
.ctx__acts { display: flex; gap: 6px; margin-left: auto; }
.ctx .btn { background: #232326; border-color: #3a3a3e; color: #f4ead6; }
.ctx .btn .ico { color: var(--gold); }

/* tabs (lane sections) */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin-top: 12px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; flex: none; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: #fffdf9; font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; color: var(--ink); white-space: nowrap; }
.tab i { font-style: normal; min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; border-radius: 5px; background: #f1ebdf; font: 700 9.5px/1 var(--text); color: var(--ink-2); }
.tab.is-on { background: var(--obsidian); border-color: var(--obsidian); color: var(--nav-gold); }
.tab.is-on i { background: #2b2b2e; color: var(--gold-hi); }
.tab--mute { border-style: dashed; color: #8a8275; }

/* filters */
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line-2); background: #fbf9f5; font: 600 9.5px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-2); }
.fchip i { font-style: normal; font-weight: 700; color: var(--ink); }
.fchip.is-on { background: var(--gold-soft, #faecc8); border-color: #e5c57f; color: #6d4a08; }

/* rows (list on phone, table rows on wider screens) */
.rows { overflow: hidden; }
.rows__empty { padding: 18px 14px; font: 500 11px/1.4 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: 'lead t s' 'lead m s'; gap: 3px 11px; align-items: center; padding: 11px 14px; border-bottom: 1px solid #efe9df; }
.row:last-child { border-bottom: 0; }
.row:hover { background: #fbf3e0; }
.row__lead { grid-area: lead; }
.row__t { grid-area: t; display: grid; gap: 3px; min-width: 0; }
.row__t b { font: 700 12.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.row__t small { font: 400 10.5px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.row__m { grid-area: m; font: 500 9.5px/1.2 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.row__s { grid-area: s; justify-self: end; }
.row > .chev { display: none; }
.row__ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #f6efe0; color: var(--gold-ink); }
.row__ico .ico { width: 18px; height: 18px; }
[data-vp='tablet'] .row, [data-vp='desktop'] .row { grid-template-columns: auto minmax(0, 1.6fr) minmax(0, 1fr) auto 14px; grid-template-areas: 'lead t m s chev'; }
[data-vp='tablet'] .row > .chev, [data-vp='desktop'] .row > .chev { display: block; grid-area: chev; }
[data-vp='tablet'] .row__s, [data-vp='desktop'] .row__s { justify-self: start; }

/* key / value */
.kv { display: grid; gap: 1px; margin: 0; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.kv__i { display: grid; gap: 5px; padding: 11px 13px; background: var(--card); }
.kv dt { font: 600 9px/1 var(--text); letter-spacing: 0.16em; color: var(--ink-3); }
.kv dd { margin: 0; font: 700 12.5px/1.25 var(--cond); letter-spacing: 0.03em; }
.kv dd small { display: block; margin-top: 3px; font: 400 10px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-3); }
.kv--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kv--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .kv--3, [data-vp='tablet'] .kv--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 4px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.tl__i { position: relative; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid #efe9df; }
.tl__i:last-child { border-bottom: 0; }
.tl__dot { grid-row: span 3; width: 9px; height: 9px; margin-top: 3px; border-radius: 3px; background: linear-gradient(180deg, var(--gold), var(--gold-lo)); }
.tl__w { font: 600 9.5px/1 var(--text); letter-spacing: 0.12em; color: var(--ink-3); }
.tl__t { font: 500 11.5px/1.35 var(--text); letter-spacing: 0.02em; }
.tl__m { font: 500 9.5px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }

/* related records */
.rel { overflow: hidden; }
.rel__i { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: 'l s c' 't s c' 'w s c'; gap: 3px 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid #efe9df; }
.rel__i:last-child { border-bottom: 0; }
.rel__i:hover { background: #fbf3e0; }
.rel__l { grid-area: l; font: 700 9px/1 var(--text); letter-spacing: 0.16em; color: var(--gold-ink); }
.rel__t { grid-area: t; font: 700 12.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.rel__i small { grid-area: w; font: 400 10px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-3); }
.rel__i .st { grid-area: s; }
.rel__i .chev { grid-area: c; }

/* states */
.stb { display: grid; gap: 10px; padding: 16px; border-style: dashed; background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f7f2e8 10px 11px); }
.stb__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.stb__head b { font: 700 14px/1.1 var(--cond); letter-spacing: 0.05em; }
.stb p { margin: 0; font: 400 11.5px/1.5 var(--text); letter-spacing: 0.03em; color: var(--ink-2); max-width: 640px; }
.stb__fields { display: flex; flex-wrap: wrap; gap: 6px; }
.stb__fields span { padding: 5px 8px; border-radius: 6px; border: 1px dashed #cfc6b6; font: 600 9px/1 var(--text); letter-spacing: 0.12em; color: #8a8275; background: #fffdf9; }
.stb__gap { font: 600 9px/1.3 var(--text); letter-spacing: 0.12em; color: #8a8275; }
.notice { border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
.notice--bad { background: var(--bad-bg); color: var(--bad); border-color: #e8c6c2; }
.notice--bad b, .notice--bad .ico { color: var(--bad); }
.notice--gold { background: #fbf3e0; border-color: #ecd59f; }
.design-only { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 9px 12px; border-radius: 10px; background: #19191b; color: #f3dfae; font: 600 9.5px/1.4 var(--text); letter-spacing: 0.1em; }
.design-only .ico { width: 13px; height: 13px; color: var(--gold); flex: none; }
.design-only b { color: var(--gold); }

/* stepper */
.steps { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.steps li { display: flex; align-items: center; gap: 10px; font: 600 10.5px/1.2 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.steps i { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line-2); font: 700 10px/1 var(--text); font-style: normal; background: #fffdf9; }
.steps i .ico { width: 11px; height: 11px; }
.steps .is-done { color: var(--ink-2); }
.steps .is-done i { background: var(--ok-bg); border-color: #b9d8be; color: var(--ok); }
.steps .is-on { color: var(--ink); }
.steps .is-on i { background: linear-gradient(180deg, var(--gold), var(--gold-lo)); border-color: transparent; color: var(--ink); }
[data-vp='desktop'] .steps--h { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
[data-vp='desktop'] .steps--h li { flex-direction: column; text-align: center; font-size: 9px; }

/* split layouts */
.split { display: grid; gap: 16px; align-items: start; }
.split > * { min-width: 0; }
[data-vp='desktop'] .split { grid-template-columns: minmax(0, 1fr) 340px; }
[data-vp='desktop'][data-wide='1'] .split { grid-template-columns: minmax(0, 1fr) 400px; }
[data-vp='tablet'] .split--tab { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.split3 { display: grid; gap: 16px; align-items: start; }
.split3 > * { min-width: 0; }
[data-vp='desktop'] .split3 { grid-template-columns: minmax(0, 1fr) 340px; }
[data-vp='desktop'][data-wide='1'] .split3 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 360px; }
.aside { display: grid; gap: 16px; }
.grid2 { display: grid; gap: 12px; }
[data-vp='tablet'] .grid2, [data-vp='desktop'] .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { display: grid; gap: 12px; }
[data-vp='tablet'] .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='desktop'][data-wide='1'] .grid3 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* stat tiles (lane landings) */
.lstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
[data-vp='tablet'] .lstats, [data-vp='desktop'] .lstats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lstat { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.lstat b { font: 800 26px/0.95 var(--cond); }
.lstat span { font: 700 10px/1.2 var(--cond); letter-spacing: 0.1em; color: var(--ink-2); }
.lstat small { font: 500 9px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
.lstat--bad b { color: var(--bad); }
.lstat--none b { font-size: 13px; line-height: 1.2; color: #8a8275; }

/* kanban board (dispatch, factoring, insurance pipeline) */
.board { display: grid; gap: 10px; }
[data-vp='tablet'] .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .board { grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
.col { display: grid; gap: 8px; align-content: start; padding: 10px; border-radius: 12px; background: #efe9de; }
.col__h { display: flex; justify-content: space-between; align-items: center; font: 700 10px/1 var(--cond); letter-spacing: 0.14em; color: var(--ink-2); padding: 2px 2px 4px; }
.col__h i { font-style: normal; color: var(--ink-3); }
.card { display: grid; gap: 6px; padding: 11px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.card:hover { border-color: var(--gold-lo); }
.card b { font: 700 12.5px/1.1 var(--cond); letter-spacing: 0.04em; }
.card small { font: 400 10px/1.3 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.card__m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 600 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }

/* fleet cards (vehicles & fleet) */
.fleet { display: grid; gap: 10px; grid-template-columns: repeat(1, minmax(0, 1fr)); }
[data-vp='tablet'] .fleet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .fleet { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='desktop'][data-wide='1'] .fleet { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.unit { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.unit:hover { border-color: var(--gold-lo); }
.unit__top { display: flex; align-items: center; gap: 10px; }
.unit__ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--obsidian); color: var(--gold); }
.unit__ico .ico { width: 22px; height: 22px; }
.unit__t { display: grid; gap: 3px; min-width: 0; }
.unit__t b { font: 800 16px/1 var(--cond); letter-spacing: 0.04em; }
.unit__t small { font: 500 10px/1.2 var(--text); letter-spacing: 0.06em; color: var(--ink-2); }
.unit__links { display: flex; flex-wrap: wrap; gap: 5px; }
.unit__links span { display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 5px; background: #f6f1e7; font: 600 8.5px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-2); }
.unit__links span.is-warn { background: var(--warn-bg); color: var(--warn); }
.unit__links span.is-bad { background: var(--bad-bg); color: var(--bad); }

/* readiness */
.meter { height: 8px; border-radius: 4px; background: #efe9de; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #f0c461, #e3a637); border-radius: 4px; }

/* document preview */
.doc { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.doc__sheet { position: relative; display: grid; align-content: start; gap: 7px; height: 140px; padding: 16px 12px; border-radius: 6px; background: #fff; border: 1px solid #e3ddd1; box-shadow: 0 6px 16px rgba(70, 48, 18, 0.1); }
.doc__sheet i { display: block; height: 6px; border-radius: 3px; background: #ece6da; }
.doc__sheet i.s { width: 60%; }
.doc--missing .doc__sheet { place-items: center; align-content: center; border-style: dashed; background: #faf7f1; }
.doc--missing .doc__sheet span { font: 700 9px/1.2 var(--text); letter-spacing: 0.14em; color: var(--bad); text-align: center; }
.doc__meta { display: grid; gap: 6px; justify-items: start; }
.doc__meta b { font: 700 14px/1.15 var(--cond); letter-spacing: 0.04em; }
.doc__meta small { font: 500 10px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }
[data-vp='desktop'] .doc--big { grid-template-columns: 260px minmax(0, 1fr); }
[data-vp='desktop'] .doc--big .doc__sheet { height: 330px; gap: 11px; padding: 28px 22px; }

/* message thread */
.msgs { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 11px 13px; border-radius: 12px; display: grid; gap: 5px; }
.msg b { font: 700 10px/1 var(--text); letter-spacing: 0.12em; }
.msg span { font: 400 12px/1.45 var(--text); letter-spacing: 0.02em; }
.msg small { font: 500 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.msg--client { background: var(--card); border: 1px solid var(--line); justify-self: start; }
.msg--staff { background: #fbf0d6; border: 1px solid #ecd59f; justify-self: end; }
.msg--internal { background: repeating-linear-gradient(135deg, #2a2a2d 0 8px, #262629 8px 9px); color: #f3dfae; justify-self: stretch; max-width: none; border-left: 4px solid var(--gold); }
.msg--internal small { color: rgba(243, 223, 174, 0.7); }
.composer { display: flex; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.composer span:first-child { flex: 1; font: 400 11px/1 var(--text); letter-spacing: 0.06em; color: var(--ink-4); }

/* search + switcher + confirm sheets (inside the device) */
.ovl { position: fixed; inset: 0; z-index: 60; background: rgba(17, 15, 12, 0.5); }
.ovl__panel { position: fixed; z-index: 61; left: 50%; top: 70px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 120px); overflow: auto; padding: 14px; border-radius: 14px; background: var(--page); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); display: grid; gap: 10px; }
.ovl__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ovl__input { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--gold-lo); background: #fffdf9; }
.ovl__input input { flex: 1; border: 0; background: none; outline: none; font: 500 13px/1 var(--text); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); min-width: 0; }
.sim-note { padding: 10px 12px; border-radius: 10px; background: #19191b; color: #f3dfae; font: 600 10px/1.45 var(--text); letter-spacing: 0.08em; }
.sim-note b { color: var(--gold); }

/* misc */
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.big-n { font: 800 34px/0.95 var(--cond); }
.muted { color: var(--ink-3); }
.mb0 { margin-bottom: 0; }
.embed { display: grid; gap: 10px; }
.embed__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--obsidian); color: #f3dfae; font: 600 10px/1.4 var(--text); letter-spacing: 0.1em; }
.embed__bar b { color: var(--gold); }
.embed__shot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); }
.embed__shot img { width: 100%; height: auto; }
.flow-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.flow-steps { display: flex; gap: 4px; flex-wrap: wrap; }
.flow-steps a { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--line-2); background: #fffdf9; font: 700 10px/1 var(--text); color: var(--ink-2); }
.flow-steps a.is-on { background: var(--obsidian); color: var(--gold); border-color: var(--obsidian); }
.cards-ln { display: grid; gap: 10px; }
[data-vp='tablet'] .cards-ln { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='desktop'] .cards-ln { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pathc { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.pathc:hover { border-color: var(--gold-lo); }
.pathc__img { height: 90px; border-radius: 8px; overflow: hidden; background: #e9e3d8; }
.pathc__img img { width: 100%; height: 100%; object-fit: cover; }
.pathc b { font: 800 16px/1 var(--cond); letter-spacing: 0.04em; }
.pathc small { font: 400 11px/1.4 var(--text); letter-spacing: 0.02em; color: var(--ink-2); }
.gate { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #fbf3e0; border: 1px solid #ecd59f; margin-top: 12px; }
.gate .ico { width: 18px; height: 18px; color: var(--gold-ink); flex: none; margin-top: 1px; }
.gate b { display: block; font: 700 12px/1.2 var(--cond); letter-spacing: 0.06em; }
.gate span { font: 400 11px/1.45 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }

[data-vp='mobile'] .pg__title { font-size: 24px; }
[data-vp='desktop'] .pg__title { font-size: 34px; }
[data-vp='desktop'] .pg { padding-top: 20px; }

/* actions column (records) */
.acts { display: grid; overflow: hidden; }
.acts__h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px; border-bottom: 1px solid #efe9df; }
.acts__h b { font: 700 12px/1 var(--cond); letter-spacing: 0.12em; }
.acts__i { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 3px 10px; padding: 11px 14px; border-bottom: 1px solid #efe9df; font: 700 11.5px/1.15 var(--cond); letter-spacing: 0.06em; }
.acts__i .ico { width: 16px; height: 16px; color: var(--gold-ink); grid-row: span 2; }
.acts__i small { grid-column: 2; font: 400 9.5px/1.35 var(--text); letter-spacing: 0.03em; color: var(--ink-3); }
.acts__i:hover { background: #fbf3e0; }
.acts__i--pri { background: linear-gradient(180deg, #fbefcf, #f8e6bb); }
.acts__i--off { grid-template-columns: minmax(0, 1fr); color: #8a8275; cursor: default; background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f7f2e8 10px 11px); }
.acts__i--off small { grid-column: 1; }
.acts__i--off:hover { background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f7f2e8 10px 11px); }
.acts__note { display: flex; gap: 8px; align-items: center; padding: 10px 14px; font: 600 9px/1.35 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.acts__note .ico { width: 13px; height: 13px; }
.tag-vis--sim { background: #19191b; color: var(--gold); }

/* overlays */
.ovl__t { font: 800 16px/1 var(--cond); letter-spacing: 0.06em; }
.ovl__p { margin: 0; font: 400 11.5px/1.5 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.ovl__results .rows { max-height: none; }
[data-vp='mobile'] .ovl__panel--sheet { top: auto; bottom: 0; transform: translateX(-50%); width: 100%; border-radius: 16px 16px 0 0; padding-bottom: 26px; }

/* page rhythm */
.stack { display: grid; gap: 16px; align-content: start; }
.stack > .sec, .aside > .sec { margin-top: 0; }
.ret { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.links { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
[data-vp='tablet'] .links { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='desktop'] .links { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lk { display: grid; gap: 6px; align-content: start; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 92px; }
.lk[data-go]:hover { border-color: var(--gold-lo); }
.lk__l { display: flex; align-items: center; gap: 6px; font: 700 9px/1 var(--text); letter-spacing: 0.16em; color: var(--gold-ink); }
.lk__l .ico { width: 14px; height: 14px; }
.lk b { font: 700 12.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.lk--none { background: #faf7f1; border-style: dashed; box-shadow: none; }
.lk--none b { color: #8a8275; }
.check { display: grid; overflow: hidden; }
.check__i { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #efe9df; }
.check__i:last-child { border-bottom: 0; }
.check__i b { font: 700 12px/1.15 var(--cond); letter-spacing: 0.04em; }
.check__i small { display: block; font: 400 9.5px/1.3 var(--text); letter-spacing: 0.04em; color: var(--ink-3); margin-top: 2px; }
.check__m { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line-2); }
.check__m .ico { width: 12px; height: 12px; }
.check__m--ok { background: var(--ok-bg); border-color: #b9d8be; color: var(--ok); }
.check__m--bad { background: var(--bad-bg); border-color: #e8c6c2; color: var(--bad); }
.check__m--gold { background: #fbf0d6; border-color: #ecd59f; color: var(--gold-ink); }
.win { display: grid; gap: 10px; }
[data-vp='tablet'] .win, [data-vp='desktop'] .win { grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; }
.win__h { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 6px; font: 700 10px/1 var(--cond); letter-spacing: 0.14em; color: var(--ink-2); }
.win__h i { font-style: normal; color: var(--ink-3); }
.phone-shot { width: 100%; max-width: 360px; margin: 0 auto; border-radius: 26px; overflow: hidden; border: 8px solid #141416; box-shadow: 0 16px 40px rgba(20, 16, 10, 0.25); background: #fff; }
.phone-shot img { width: 100%; height: auto; }
.flowv { display: grid; gap: 16px; align-items: start; }
[data-vp='tablet'] .flowv { grid-template-columns: 340px minmax(0, 1fr); }
[data-vp='desktop'] .flowv { grid-template-columns: 380px minmax(0, 1fr); }
[data-vp='desktop'][data-wide='1'] .flowv { grid-template-columns: 420px minmax(0, 1fr) 420px; }
.ext { display: inline-flex; align-items: center; gap: 6px; color: var(--gold-ink); font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; text-decoration: underline; text-underline-offset: 3px; }
.mig-hero { position: relative; }
.paths { display: grid; gap: 10px; }
[data-vp='tablet'] .paths, [data-vp='desktop'] .paths { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ftypes { display: flex; flex-wrap: wrap; gap: 8px; }
.ftypes span { display: inline-grid; place-items: center; min-width: 56px; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fffdf9; font: 700 10px/1 var(--cond); letter-spacing: 0.1em; }
.provs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.provs span { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: #fffdf9; font: 700 9.5px/1 var(--cond); letter-spacing: 0.08em; }
.provs img { width: 18px; height: 18px; object-fit: contain; }
.secure { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 12px; align-items: center; padding: 14px; }
.secure img { width: 100%; height: 86px; object-fit: cover; border-radius: 8px; }
.secure b { display: block; font: 800 14px/1.1 var(--cond); letter-spacing: 0.05em; margin-bottom: 4px; }
.secure span { font: 400 11px/1.45 var(--text); letter-spacing: 0.03em; color: var(--ink-2); }
.cta-wide { display: flex; justify-content: center; margin-top: 14px; }
.cta-wide .btn { width: 100%; max-width: 560px; height: 48px; justify-content: center; font-size: 13px; }
.thumbs { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-vp='tablet'] .thumbs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
[data-vp='desktop'] .thumbs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
[data-vp='desktop'][data-wide='1'] .thumbs { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.thumb { display: grid; gap: 6px; align-content: start; }
.thumb__img { aspect-ratio: 853 / 1536; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); }
.thumb__img img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.thumb:hover .thumb__img { border-color: var(--gold-lo); }
.thumb b { font: 700 9.5px/1.2 var(--cond); letter-spacing: 0.08em; }
.thumb small { font: 500 8.5px/1.2 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.thumb.is-on .thumb__img { outline: 3px solid var(--gold); outline-offset: 1px; }
.conf { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #efe9df; }
.conf:last-child { border-bottom: 0; }
.conf b { font: 700 12px/1.2 var(--cond); letter-spacing: 0.05em; }
.conf__opts { display: flex; flex-wrap: wrap; gap: 6px; }
.flowd { display: grid; gap: 12px; align-content: start; }
.flowd__t { margin: 0; font: 800 22px/1 var(--cond); letter-spacing: 0.02em; }
.flowd ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.flowd li { display: flex; gap: 8px; align-items: center; font: 600 10.5px/1.3 var(--text); letter-spacing: 0.06em; }
.flowd li .ico { width: 14px; height: 14px; color: var(--gold-ink); }
.row--static:hover, .rel__i--static:hover { background: none; }
.lk { min-width: 0; }
.lk b { overflow-wrap: anywhere; }
.lk .st { justify-self: start; max-width: 100%; white-space: normal; }

/* ultra-wide: office pages keep the approved roots' 1480 px content measure; photographic bands stay full-bleed */
[data-vp='desktop'][data-wide='1'] .main > :not(.bleed) { max-width: 1480px; margin-left: auto; margin-right: auto; }

/*
 * AIO OFFICE deeper-workspace grammar. Built on the approved root tokens (studio.css): ivory work surfaces, obsidian
 * stages, gold for selection and the path forward, hairlines for structure, condensed figures as instruments.
 *
 *   CHOOSE → WORK → ACT. Every workspace has a selector, a working stage and a context panel, shaped differently for
 *   the work (a truck, a month, a calendar, a company). On desktop the workspace fits the screen; only lists scroll.
 */
.ao-root {
  --paper: #fffdf9;
  --rule: #ece5d8;
  --rule-2: #e2d9c8;
  --tint: #fbf3e0;
  --stage: #141416;
  --stage-2: #1c1c1f;
  --stage-line: #2e2c28;
  --stage-ink: #f2e9d6;
  --stage-mute: #a59c8b;
  --gold-rule: linear-gradient(90deg, #f7d27a, #e7ab3c);
  --gold-fill: linear-gradient(180deg, #f3c862, #e5a93a);
  --metal: linear-gradient(160deg, #f9e2a6 0%, #d9a640 38%, #f5d488 62%, #b9872c 100%);
  /* LOCKED · type scale (px at 1×): never below 9 */
  --fs-micro: 9px; /* letter-spaced labels: section labels, column heads, dt */
  --fs-label: 10px; /* compact data labels and metadata */
  --fs-row: 12px; /* row titles, table text */
  --fs-body: 13px; /* panel body */
  --fs-h: 17px; /* panel headings */
  /* LOCKED · motion: precise, soft, weighted — transform and opacity only for movement */
  --m-micro: 130ms; /* press, hover, chip feedback */
  --m-select: 190ms; /* tabs, selection, thumbs */
  --m-panel: 260ms; /* panel content, drawers in */
  --m-context: 320ms; /* larger context changes (a new truck, a new client) */
  --m-out: 200ms; /* anything leaving */
  --ease-out: cubic-bezier(0.22, 0.9, 0.28, 1); /* settles without bounce */
  --ease-in: cubic-bezier(0.4, 0, 0.9, 0.6);
  --ease-std: cubic-bezier(0.3, 0.6, 0.2, 1);
  /* LOCKED · material: three elevations, one gold edge */
  --e0: none;
  --e1: 0 1px 0 rgba(255, 255, 255, 0.85) inset, 0 1px 2px rgba(48, 34, 12, 0.05), 0 8px 22px rgba(48, 34, 12, 0.06);
  --e2: 0 1px 0 rgba(255, 255, 255, 0.85) inset, 0 3px 8px rgba(48, 34, 12, 0.08), 0 18px 40px rgba(48, 34, 12, 0.12);
  --e-stage: 0 18px 40px rgba(20, 16, 10, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.05), inset 0 0 0 1px #2c2a26;
  --gold-edge: 0 0 0 1px rgba(231, 171, 60, 0.75), 0 6px 18px rgba(214, 150, 40, 0.22);
  --focus: 0 0 0 2px var(--paper), 0 0 0 4px #c98d1d;
}

/* ── frame ── */
/* controls start bare: every workspace control styles itself (zero specificity, so any class wins) */
:where(.ws-main) :where(button) { appearance: none; margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: inherit; cursor: pointer; }
:where(.ws-main) :where(input) { font: inherit; color: inherit; }
.ws-main { position: relative; }
[data-vp='desktop'] .ws-main { padding: 0; }
[data-vp='tablet'] .ws-main { padding: 0 0 113px; }
[data-vp='mobile'] .ws-main { padding: 0 0 74px; }
.ws { box-sizing: border-box; display: grid; gap: 12px; padding: 14px 18px 16px; min-width: 0; }
.ws > * { min-width: 0; min-height: 0; }
[data-vp='desktop'] .ws { height: calc(var(--dh) - 68px); grid-template-rows: auto minmax(0, 1fr); }
[data-vp='desktop'][data-wide='1'] .ws { padding: 20px 28px 24px; gap: 16px; }
/* ultra-wide: a workspace is a tool, not a reading page — it takes the whole screen (the 1480 measure is for reading pages) */
[data-vp='desktop'][data-wide='1'] .ws-main > .ws { max-width: none; margin: 0; }
[data-vp='tablet'] .ws { height: calc(var(--dh) - 77px - 113px); padding: 12px 16px 14px; }
[data-vp='mobile'] .ws { padding: 10px 12px 16px; gap: 10px; }

/* ── workspace bar: identity · instruments · tools ── */
.wsb { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; min-height: 50px; }
.wsb__id { display: grid; gap: 5px; }
.wsb__no { font: 700 10px/1 var(--text); letter-spacing: 0.22em; color: var(--gold-ink); }
.wsb__t { margin: 0; font: 800 27px/0.9 var(--cond); letter-spacing: 0.01em; white-space: nowrap; }
.wsb__tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
[data-vp='mobile'] .wsb { gap: 10px; min-height: 0; }
[data-vp='mobile'] .wsb__t { font-size: 22px; }

/* readouts: figures as instruments, never cards */
.ros { display: flex; align-items: stretch; }
.ro { display: grid; gap: 5px; align-content: center; padding: 2px 16px; border-left: 1px solid var(--rule-2); text-align: left; background: none; color: inherit; }
.ro:first-child { border-left: 0; padding-left: 0; }
.ro b { font: 800 25px/0.85 var(--cond); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.ro span { font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: var(--ink-3); white-space: nowrap; }
.ro--bad b { color: var(--bad); }
.ro--warn b { color: var(--warn); }
.ro--gold b { color: var(--gold-ink); }
.ro[data-a] { cursor: pointer; border-radius: 0; }
.ro[data-a]:hover span { color: var(--ink); }
.ro.is-on span { color: var(--ink); }
.ro.is-on b { text-decoration: underline; text-decoration-color: var(--gold-lo); text-decoration-thickness: 3px; text-underline-offset: 5px; }
[data-vp='mobile'] .ro { padding: 0 10px; }
[data-vp='mobile'] .ro b { font-size: 20px; }

/* segmented choice (sections, phases, filters) */
.wseg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: #ece6da; }
.wseg__b { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 8px; font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; color: var(--ink-2); white-space: nowrap; }
.wseg__b i { font-style: normal; font: 700 9.5px/1 var(--text); color: var(--ink-3); }
.wseg__b:hover { background: rgba(255, 253, 249, 0.6); }
.wseg__b.is-on { background: var(--obsidian); color: var(--nav-gold); box-shadow: 0 2px 8px rgba(20, 16, 10, 0.18); }
.wseg__b.is-on i { color: var(--gold-hi); }
.wseg__b--quiet { color: #8a8275; }
.wseg--scroll { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.wseg--scroll::-webkit-scrollbar { display: none; }

/* small controls */
.wbtn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--paper); font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; color: var(--ink); white-space: nowrap; }
.wbtn .ico { width: 15px; height: 15px; }
.wbtn:hover { border-color: var(--gold-lo); }
.wbtn--gold { background: var(--gold-fill); border-color: transparent; color: #19140a; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 4px 12px rgba(180, 120, 20, 0.22); }
.wbtn--dark { background: var(--obsidian); border-color: var(--obsidian); color: var(--nav-gold); }
.wbtn--sm { height: 28px; padding: 0 10px; font-size: 9.5px; }
.wbtn--icon { width: 34px; padding: 0; }
.wfld { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--paper); font: 500 10px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-4); min-width: 0; }
.wfld .ico { width: 15px; height: 15px; color: var(--ink-3); }
.wfld input { all: unset; flex: 1; min-width: 60px; font: 600 10.5px/1 var(--text); letter-spacing: 0.08em; color: var(--ink); text-transform: uppercase; }
.wfld input::placeholder { color: var(--ink-4); }
.chipsel { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 4px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--paper); font: 700 11px/1 var(--cond); letter-spacing: 0.08em; }
.chipsel .badge { width: 26px; height: 26px; font-size: 10px; border-radius: 7px; }
.chipsel .ico { width: 14px; height: 14px; color: var(--ink-3); }

/* status pip: a word is always next to it */
.pip { display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: #b9b1a3; flex: none; }
.pip--ok { background: var(--ok); }
.pip--warn { background: #d18a1b; }
.pip--bad { background: var(--bad); }
.pip--gold { background: var(--gold-lo); }
.pip--mute { background: #c8c0b1; }
.sw { display: inline-flex; align-items: center; gap: 6px; font: 700 9.5px/1 var(--text); letter-spacing: 0.12em; white-space: nowrap; }
.sw--ok { color: var(--ok); }
.sw--warn { color: var(--warn); }
.sw--bad { color: var(--bad); }
.sw--gold { color: var(--gold-ink); }
.sw--mute { color: #8a8275; }

/* ── regions ── */
.rg { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.rg__h { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px; border-bottom: 1px solid var(--rule); flex: none; }
.rg__t { font: 700 10px/1 var(--text); letter-spacing: 0.2em; color: var(--ink-2); }
.rg__n { font: 700 10px/1 var(--text); color: var(--ink-4); }
.rg__h > :last-child:not(:first-child) { margin-left: auto; }
.rg__b { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #d8cfbf transparent; }
.rg--flat { box-shadow: none; }

/* selectable rows */
.pk { position: relative; display: grid; align-items: center; gap: 3px 12px; padding: 11px 14px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.pk:last-child { border-bottom: 0; }
.pk:hover { background: #fcf7ec; }
.pk.is-sel { background: var(--tint); }
.pk::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold-fill); transform: scaleY(0); transition: transform var(--m-select) var(--ease-out); }
.pk.is-sel::before { transform: scaleY(1); }
.pk__t { font: 700 var(--fs-row)/1.15 var(--cond); letter-spacing: 0.04em; min-width: 0; }
.pk__s { font: 500 9.5px/1.25 var(--text); letter-spacing: 0.08em; color: var(--ink-3); min-width: 0; }
.grp { padding: 14px 14px 6px; font: 700 9px/1 var(--text); letter-spacing: 0.2em; color: var(--ink-3); display: flex; justify-content: space-between; }

/* avatar initials (owners) */
.av { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #2a2a2d; color: var(--gold-hi); font: 700 9px/1 var(--text); letter-spacing: 0.04em; flex: none; }
.av--you { background: var(--gold-fill); color: #1a140a; }

/* ── context panel: what this is · what matters · the one next step ── */
.cx { display: flex; flex-direction: column; min-height: 0; }
.cx__h { display: grid; gap: 8px; padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); flex: none; }
.cx__crumb { display: flex; align-items: center; gap: 6px; font: 700 var(--fs-micro)/1 var(--text); letter-spacing: 0.12em; color: var(--ink-3); min-width: 0; white-space: nowrap; overflow: hidden; }
.cx__crumb > :is(a, span) { flex: none; }
.cx__crumb > :first-child:is(a, span) { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cx__crumb .ico { flex: none; }
.cx__hd { display: grid; gap: 8px; min-width: 0; }
.cx__crumb a { color: var(--gold-ink); cursor: pointer; }
.cx__crumb .ico { width: 9px; height: 9px; }
.cx__back { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--paper); margin-right: 4px; cursor: pointer; }
.cx__back .ico { width: 12px; height: 12px; }
.cx__t { margin: 0; font: 800 var(--fs-h)/1.08 var(--cond); letter-spacing: 0.02em; text-wrap: balance; }
.cx__b { flex: 1; min-height: 0; overflow: auto; display: grid; align-content: start; gap: 14px; padding: 14px 16px 16px; scrollbar-width: thin; }
.cx__lead { margin: 0; font: 600 13px/1.35 var(--text); letter-spacing: 0.02em; color: var(--ink); }

/* facts: label / value on hairlines */
.fx { margin: 0; display: grid; }
.fx > div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.fx > div:last-child { border-bottom: 0; }
.fx dt { font: 700 9px/1.3 var(--text); letter-spacing: 0.13em; color: var(--ink-3); }
.fx dd { margin: 0; font: 700 11.5px/1.25 var(--cond); letter-spacing: 0.04em; min-width: 0; overflow-wrap: anywhere; }
.fx dd a { color: var(--gold-ink); cursor: pointer; }
.fx dd small { display: block; margin-top: 2px; font: 500 9px/1.3 var(--text); letter-spacing: 0.08em; color: var(--ink-3); }

/* next action: the one thing to do, then the rest */
.nx { display: grid; gap: 10px; padding: 13px 14px 14px; border-radius: 12px; background: linear-gradient(180deg, #fbf1d8, #f8ead0); border: 1px solid #ecd59f; position: relative; }
.nx::before { content: ''; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold-rule); }
.nx__l { font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: var(--gold-ink); }
.nx__t { font: 800 14px/1.15 var(--cond); letter-spacing: 0.03em; text-wrap: balance; }
.nx__acts { display: flex; flex-wrap: wrap; gap: 6px; }
.nx--calm { background: #f6f2ea; border-color: var(--line); }
.nx--calm::before { background: #cfc6b6; }
.nx--done { background: var(--ok-bg); border-color: #b9d8be; }
.nx--done::before { background: var(--ok); }

.simtag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; background: var(--obsidian); color: var(--gold); font: 700 9px/1 var(--text); letter-spacing: 0.1em; }
.founder { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 4px; border: 1px solid #e5c57f; color: var(--gold-ink); font: 700 9px/1 var(--text); letter-spacing: 0.1em; }

/* mini history */
.mh { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.mh li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0; }
.mh li::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: #cfc6b6; transform: translateY(-1px); }
.mh li.is-sim::before { background: var(--gold-lo); }
.mh b { font: 600 10.5px/1.3 var(--text); letter-spacing: 0.03em; }
.mh small { font: 600 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); white-space: nowrap; }
.sec-l { display: flex; justify-content: space-between; align-items: center; font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: var(--ink-3); padding-bottom: 4px; }

/* honest "not in the product yet" line — one line, never a block */
.ntb { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 9px; border: 1px dashed #cfc6b6; background: #faf7f1; font: 600 9.5px/1.35 var(--text); letter-spacing: 0.09em; color: #7d7568; }
.ntb .ico { width: 13px; height: 13px; flex: none; color: #9b9282; }
.ntb b { color: var(--ink-2); }

/* shared document chip */
.dch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--rule-2); background: #fffefb; }
.dch__sheet { width: 26px; height: 32px; border-radius: 3px; border: 1px solid #ddd5c6; background: repeating-linear-gradient(180deg, #fff 0 5px, #efe9dd 5px 6px); flex: none; }
.dch__sheet--miss { background: #faf7f1; border-style: dashed; }
.dch b { display: block; font: 700 10.5px/1.15 var(--cond); letter-spacing: 0.04em; }
.dch small { font: 600 9px/1.2 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.vis { display: inline-flex; align-items: center; height: 15px; padding: 0 5px; border-radius: 3px; font: 700 9px/1 var(--text); letter-spacing: 0.1em; background: #efe9de; color: var(--ink-2); }
.vis--client { background: var(--ok-bg); color: var(--ok); }

/* ═══════════════ CONTROLS · STATES (locked) ═══════════════
 * Square-rounded geometry everywhere. Gold means ACTIVE · SELECTED · READY · NEXT · FOCUSED — never decoration.
 * Every state is carried by shape or contrast as well as light: selection = obsidian or a gold bar, focus = a ring. */
.wbtn:hover:not(:disabled) { border-color: #d9b56a; }
.wbtn:active:not(:disabled) { transform: translateY(1px); }
.wbtn--gold:hover:not(:disabled) { filter: brightness(1.04); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) inset, 0 7px 20px rgba(196, 132, 24, 0.34); }
.wbtn--gold:active:not(:disabled) { box-shadow: inset 0 2px 5px rgba(110, 72, 8, 0.28); }
.wbtn--dark:hover:not(:disabled) { box-shadow: 0 0 0 1px rgba(231, 171, 60, 0.55); }
.wbtn--ghost { background: transparent; border-color: #3e3a34; color: #e9dcc0; }
.wbtn:disabled { opacity: 0.45; cursor: default; }
.wbtn.is-loading { cursor: progress; filter: saturate(0.85); }
.spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(26, 20, 10, 0.22); border-top-color: #1a140a; animation: wsSpin 0.7s linear infinite; }
@keyframes wsSpin { to { transform: rotate(360deg); } }
.ws-main :is(button, [role='button'], input, a):focus-visible { outline: 2px solid #c98d1d; outline-offset: 2px; }
.ws-main .fl-stage :is(button, [role='button']):focus-visible, .ws-main .cl-id :is(button, [role='button']):focus-visible { outline-color: #f1c158; }
.ws-main [role='button'] { cursor: pointer; }

/* the one place you confirm a simulated action: a precise obsidian plate, opened where you pressed */
.simc { position: relative; display: grid; gap: 7px; padding: 13px 14px 13px; border-radius: 12px; background: linear-gradient(180deg, #1e1e21, #151517); color: var(--stage-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 26px rgba(20, 16, 10, 0.22); animation: wsSwap var(--m-panel) var(--ease-out) both; }
.simc::before { content: ''; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--gold-rule); }
.simc__h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.simc__h b { font: 800 13px/1.15 var(--cond); letter-spacing: 0.05em; color: #fff3d6; }
.simc__e { font: 500 11px/1.4 var(--text); letter-spacing: 0.02em; color: #e3d6bb; text-transform: uppercase; }
.simc__n { font: 700 var(--fs-micro)/1 var(--text); letter-spacing: 0.13em; color: var(--gold); }
.simc__acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.simc .wbtn { height: 30px; }
.simc .simtag { background: #2b2b2e; }

/* ═══════════════ MOTION (locked) ═══════════════
 * One vocabulary. State changes transition colour, shadow and transform; new content settles in (data-swap); drawers
 * slide in and leave first; a selection may ring once. Nothing loops. Durations and easing are the --m-* / --ease-*
 * tokens. Reduced motion: no movement, instant state (see the end of this block). */
.wbtn, .wseg__b, .ro, .pk, .lt-row, .fl-tag, .fl-chip, .fl-cg, .fl-ctab, .bk-ph, .bk-chip, .bk-node i, .hz-m, .cl-svc .ico, .cl-svc span, .cl-g, .cl-truck, .cl-link, .cx__back, .dch, .fl-client, .bk-opt, .cl-dir__r b, .fl-fp__d {
  transition: background-color var(--m-select) var(--ease-std), border-color var(--m-select) var(--ease-std), color var(--m-select) var(--ease-std), box-shadow var(--m-select) var(--ease-std), opacity var(--m-select) var(--ease-std), transform var(--m-micro) var(--ease-out), filter var(--m-micro) var(--ease-std);
}
[data-thumb] { position: relative; isolation: isolate; }
[data-thumb] > .thumb { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 8px; background: var(--obsidian); box-shadow: 0 2px 8px rgba(20, 16, 10, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.06); opacity: 0; pointer-events: none; transition: transform var(--m-select) var(--ease-out), width var(--m-select) var(--ease-out), height var(--m-select) var(--ease-out), opacity var(--m-micro) linear; }
[data-thumb] > :not(.thumb) { position: relative; z-index: 1; }
.has-thumb > .is-on { background: transparent !important; box-shadow: none !important; }
@keyframes wsSwap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes wsSwapSide { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes wsFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes wsFadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes wsRing { from { opacity: 0.85; transform: scale(0.8); } to { opacity: 0; transform: scale(2); } } /* one echo on select, never repeated */
@keyframes wsDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
[data-swap] { animation: wsSwap var(--m-panel) var(--ease-out) both; }
[data-swap-side] { animation: wsSwapSide var(--m-context) var(--ease-out) both; }
.mh li.is-sim { animation: wsSwap var(--m-panel) var(--ease-out) both; border-radius: 6px; background: rgba(231, 171, 60, 0.08); } /* a simulated entry keeps a quiet gold tint; no long flash */

/* ═══════════════ DRAWERS (locked) ═══════════════
 * A precision extension of the workspace, not a generic modal: a bottom sheet on the phone (side drawer where a list
 * is chosen from), a gold hairline at its leading edge, a bar that holds the grip and the close control so nothing ever
 * covers the header, a header that stays put, a body that scrolls on its own. The page behind is inert. */
.wscrim { position: fixed; inset: 0; z-index: 70; background: linear-gradient(180deg, rgba(17, 15, 12, 0.32), rgba(17, 15, 12, 0.56)); animation: wsFade var(--m-panel) var(--ease-std) both; }
.wscrim.is-out { animation: wsFadeOut var(--m-out) var(--ease-in) both; pointer-events: none; }
.wsheet { position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; max-height: 86%; display: flex; flex-direction: column; overflow: hidden; border-radius: 22px 22px 0 0; background: var(--paper); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 -26px 60px rgba(12, 9, 4, 0.34); padding-bottom: max(6px, env(safe-area-inset-bottom)); outline: none; animation: wsSheetIn var(--m-panel) var(--ease-out) both; }
.wsheet::before { content: ''; position: absolute; z-index: 2; left: 26%; right: 26%; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--gold-rule); }
.wsheet.is-out { animation: wsSheetOut var(--m-out) var(--ease-in) both; pointer-events: none; }
@keyframes wsSheetIn { from { transform: translateY(100%); } to { transform: none; } }
@keyframes wsSheetOut { from { transform: none; } to { transform: translateY(100%); } }
.wsheet__bar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 42px; padding: 0 10px 0 16px; }
.wsheet__grab { grid-column: 2; width: 38px; height: 4px; border-radius: 2px; background: #dccfb5; }
.wsheet__l { grid-column: 1; grid-row: 1; font: 700 var(--fs-micro)/1 var(--text); letter-spacing: 0.14em; color: var(--ink-3); }
.wsheet__x { grid-column: 3; justify-self: end; width: 32px; height: 32px; border-radius: 9px; }
.wsheet__body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.wsheet__body > .rg, .wsheet__body > .cx { flex: 1; min-height: 0; border: 0; border-radius: 0; box-shadow: none; background: transparent; }
.wsheet .cx__h { padding: 0 18px 12px; }
.wsheet .cx__b { overscroll-behavior: contain; padding: 14px 18px 22px; }
.wsheet .rg__b { overscroll-behavior: contain; }
.wsheet--side { right: auto; top: 0; width: min(360px, 88%); max-height: none; border-radius: 0 22px 22px 0; box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.9), 26px 0 60px rgba(12, 9, 4, 0.3); animation-name: wsSideIn; }
.wsheet--side::before { left: auto; right: 0; top: 22%; bottom: 22%; width: 2px; height: auto; border-radius: 2px 0 0 2px; background: linear-gradient(180deg, #f7d27a, #e7ab3c); }
.wsheet--side.is-out { animation-name: wsSideOut; }
.wsheet--side .wsheet__grab { display: none; }
@keyframes wsSideIn { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes wsSideOut { from { transform: none; } to { transform: translateX(-100%); } }

/* reduced motion: state changes are instant, nothing travels; the working spinner holds still */
@media (prefers-reduced-motion: reduce) {
  .ao-root *, .ao-root *::before, .ao-root *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important; }
}
:root[data-motion='reduce'] .ao-root *, :root[data-motion='reduce'] .ao-root *::before, :root[data-motion='reduce'] .ao-root *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important; }

/* dark surfaces keep status words legible */
.fl-stage .sw--ok, .fl-row.is-sel .sw--ok, .cl-id .sw--ok, .cl-vstage .sw--ok, .cl-truck .sw--ok { color: #8fd19e; }
.fl-stage .sw--bad, .fl-row.is-sel .sw--bad, .cl-id .sw--bad, .cl-vstage .sw--bad, .cl-truck .sw--bad { color: #ff9c93; }
.fl-stage .sw--warn, .fl-row.is-sel .sw--warn, .cl-id .sw--warn, .cl-vstage .sw--warn, .cl-truck .sw--warn { color: #ffcf7a; }
.fl-stage .sw--gold, .fl-row.is-sel .sw--gold, .cl-id .sw--gold, .cl-vstage .sw--gold, .cl-truck .sw--gold { color: #f7d27a; }
.fl-stage .sw--mute, .fl-row.is-sel .sw--mute, .cl-id .sw--mute, .cl-vstage .sw--mute, .cl-truck .sw--mute { color: #a59c8b; }
.design-pill { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px; border: 1px dashed #cdbf9f; font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: #8b7a52; white-space: nowrap; }

/* ═══════════════ 01 · VEHICLES & FLEET ═══════════════ */
.fl-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 372px; gap: 14px; min-height: 0; }
[data-wide='1'] .fl-grid { grid-template-columns: 420px minmax(0, 1fr) 560px; gap: 20px; }
.fl-mid { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 14px; min-height: 0; min-width: 0; }
.fl-rost__tools { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 2; }
