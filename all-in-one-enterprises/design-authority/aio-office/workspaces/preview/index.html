  }
  if (VP === 'tablet') return `<div class="ws bk bk--t">${bkBar()}${bkRail(true)}${per ? bkSpine() : ''}<div class="bk-t2">${table}${focus}</div></div>`;
  return `<div class="ws bk">${bkBar()}${per ? bkSpine() : '<div></div>'}<div class="bk-grid ${WIDE && per ? 'bk-grid--4' : ''}">${bkRail()}${table}${focus}${WIDE && per ? bkMonth() : ''}</div></div>`;
}
/** Phone: the active phase as a list; tapping a row opens it in the drawer. */
function bkMobileList() {
  const html = bkTable();
  return html.replace(/data-a="bk\.item"/g, 'data-a="bk.open"');
}

/* ── actions ── */
ACT['bk.cadence'] = (c) => {
  WSX.books.cadence = c;
  WSX.books.item = null;
  WSX.pending = null;
  WSX.sheet = false;
};
ACT['bk.client'] = (cid) => {
  WSX.books.client = cid;
  if (!BOOKS[cid].periods[WSX.books.period] && !BOOKS[cid].paused) WSX.books.period = 'SEP 2026';
  const per = bkPeriod();
  WSX.books.phase = per ? phaseOf(bkStep()) : 'collect';
  WSX.books.item = null;
  WSX.pending = null;
};
ACT['bk.period'] = (p) => {
  WSX.books.period = p;
  const per = bkPeriod();
  WSX.books.phase = per ? phaseOf(Math.min(bkStep(), 8)) : 'collect';
  WSX.books.item = null;
  WSX.pending = null;
};
ACT['bk.phase'] = (ph) => {
  WSX.books.phase = ph;
  WSX.books.item = null;
  WSX.pending = null;
};
ACT['bk.item'] = (k) => {
  WSX.books.item = k;
  WSX.pending = null;
};
ACT['bk.open'] = (k) => {
  WSX.books.item = k;
  WSX.sheet = true;
  WSX.pending = null;
};
ACT['bk.cat'] = (v) => {
  const [qid, choice] = v.split('|');
  const { client: cid, period: p } = WSX.books;
  const key = `bkq:${cid}:${p}:${qid}`;
  if (choice) {
    WSX.over[key] = choice;
    WSX.sims.unshift(`CHARGE ${choice === 'ASK THE CLIENT' ? 'SENT TO THE CLIENT' : `CATEGORIZED AS ${choice}`}`);
    WSX.flash = `SIMULATED · ${choice === 'ASK THE CLIENT' ? 'ASKED THE CLIENT' : `CATEGORIZED AS ${choice}`}`;
    // move to the next open charge
    const next = bkPeriod().items.find((q) => !bkItemState(cid, p, q));
    if (next && VP !== 'mobile') WSX.books.item = `q:${next.id}`;
  } else delete WSX.over[key];
};


/*
 * PROOF 03 — COMPLIANCE. Deadline- and risk-centered: a 90-day horizon (time is the axis, today is a line) · the queue
 * ordered by urgency · the selected case with its subject, requirement, owner, documents and the next step. One
 * canonical COMPLIANCE lane with four sections; DOT / SAFETY and AUDITS have no data in the live app and say so in place.
 */
const HZ = { start: -7, end: 84 };
const hzX = (d) => (((Math.max(HZ.start, Math.min(HZ.end, d)) - HZ.start) / (HZ.end - HZ.start)) * 100).toFixed(2);
const LANES_CP = ['VEHICLES', 'DRIVERS', 'COVERAGE', 'REGISTRATION'];
const dueState = (d) => ov(`deadline:${d.id}`, d.state);
const urgency = (d) => (dueState(d)[0] === 'RENEWED' ? 'done' : d.days <= 0 || d.state[1] === 'bad' ? 'now' : d.days <= 7 ? 'week' : d.days <= 30 ? 'month' : 'later');
const URG = [['now', 'NOW'], ['week', 'THIS WEEK'], ['month', 'NEXT 30 DAYS'], ['later', 'LATER'], ['done', 'RENEWED · THIS VISIT']];
function cpItems() {
  const { sec, filter } = WSX.comp;
  if (sec === 'corrective') return [DUES['dl-tk-09']];
  if (sec !== 'expirations') return [];
  return vals(DUES)
    .filter((d) => filter === 'all' || urgency(d) === filter || (filter === '30' && ['now', 'week', 'month'].includes(urgency(d))))
    .sort((a, b) => a.days - b.days);
}
const subjectOf = (d) => {
  const m = DUE_META[d.id];
  const key = m?.subject;
  if (!key) return { kind: 'COMPANY', title: clientName(d.client), sub: ACCOUNTS[d.client].dot, go: `client:${d.client}`, goLabel: 'CLIENT 360' };
  const [type, id] = key.split(':');
  if (type === 'vehicle') return { kind: 'TRUCK', title: VEHICLES[id].unit, sub: VEHICLES[id].ymm, go: `fleet:${id}:compliance`, goLabel: 'OPEN IN FLEET', truck: true };
  if (type === 'driver') return { kind: 'DRIVER', title: DRIVERS[id].name, sub: DRIVERS[id].cdl, go: DRIVERS[id].vehicle ? `fleet:${DRIVERS[id].vehicle}:driver` : `client:${d.client}`, goLabel: DRIVERS[id].vehicle ? `${VEHICLES[DRIVERS[id].vehicle].unit} IN FLEET` : 'CLIENT 360' };
  if (type === 'policy') return { kind: 'POLICY', title: POLICIES[id].title, sub: POLICIES[id].partner, go: `client:${d.client}:insurance`, goLabel: 'CLIENT 360' };
  if (type === 'request') return { kind: 'PERMIT', title: REQUESTS[id].title, sub: REQUESTS[id].section, go: `client:${d.client}:permitting`, goLabel: 'CLIENT 360' };
  return { kind: 'COMPANY', title: clientName(d.client), sub: '', go: `client:${d.client}`, goLabel: 'CLIENT 360' };
};

/* ── the horizon ── */
function cpHorizon(compact = false) {
  const { sec, item } = WSX.comp;
  const months = [['OCT', -7, 23], ['NOV', 24, 53], ['DEC', 54, 84]];
  const weeks = Array.from({ length: 13 }, (_, i) => HZ.start + 7 * i).filter((d) => d > HZ.start);
  const axis = `<div class="hz-months">${months.map(([m, a, b]) => `<span style="left:${hzX(a)}%;width:${(hzX(b) - hzX(a)).toFixed(2)}%">${m}</span>`).join('')}</div>`;
  const grid = `${weeks.map((d) => `<i class="hz-wk" style="left:${hzX(d)}%"></i>`).join('')}<i class="hz-zone hz-zone--late" style="left:0;width:${hzX(0)}%"></i><i class="hz-zone hz-zone--week" style="left:${hzX(0)}%;width:${(hzX(7) - hzX(0)).toFixed(2)}%"></i><i class="hz-30" style="left:${hzX(30)}%"><span>30 DAYS</span></i><i class="hz-today" style="left:${hzX(0)}%"><span>TODAY · OCT 8</span></i>`;
  if (sec === 'dot_safety' || sec === 'audits') {
    return `<section class="hz hz--ghost">${axis}<div class="hz-plot">${grid}<div class="hz-ghost"><div class="hz-ghost__m"><b>${sec === 'audits' ? 'NO AUDITS SCHEDULED IN AIO' : 'NO SAFETY DATA CONNECTED'}</b><span>${sec === 'audits' ? 'NEW-ENTRANT AND COMPLIANCE REVIEWS WOULD SIT ON THIS LINE' : 'INSPECTIONS, OUT-OF-SERVICE EVENTS AND SCORES WOULD SIT ON THIS LINE'}</span></div></div></div></section>`;
  }
  const items = cpItems();
  const lanes = compact ? [''] : LANES_CP;
  let calloutHidden = null;
  const rows = lanes.map((ln) => {
    const mine = items.filter((d) => compact || KIND_LANE[d.kind] === ln);
    // markers that would touch stack into a second or third line instead of overlapping
    const ends = [];
    const lineOf = {};
    [...mine].sort((a, b) => a.days - b.days).forEach((d) => {
      const x = Number(hzX(d.days));
      let r = ends.findIndex((e) => x - e >= (compact ? 11 : 4));
      if (r < 0) r = ends.length < 3 ? ends.length : 0;
      ends[r] = x;
      lineOf[d.id] = r;
    });
    const lines = Math.max(1, ends.length);
    const track = VP === 'tablet' ? 640 : WIDE ? 2200 : 1100;
    const marks = mine.map((d) => {
      const s = dueState(d);
      const on = d.id === item;
      let side = '';
      if (on && !compact) {
        const x = Number(hzX(d.days));
        const w = ((Math.max(d.what.split(' · ')[0].length, 18) * 6.3 + 30) / track) * 100;
        const free = (a, b) => !mine.some((o) => o.id !== d.id && lineOf[o.id] === lineOf[d.id] && Number(hzX(o.days)) > a && Number(hzX(o.days)) < b);
        side = x + w < 99 && free(x, x + w + 3) ? 'r' : x - w > 0 && free(x - w - 3, x) ? 'l' : '';
        if (!side) calloutHidden = d;
      }
      return `<button type="button" class="hz-m hz-m--${s[1]} ${on ? 'is-on' : ''}" aria-pressed="${on}" style="left:${hzX(d.days)}%;top:calc(50% + ${((lineOf[d.id] - (lines - 1) / 2) * 27).toFixed(1)}px)" data-a="cp.item" data-v="${d.id}" aria-label="${d.what} · ${d.due}"><b>${ACCOUNTS[d.client].b}</b>${on ? `<i class="hz-m__ring" data-swap="ring:${d.id}" aria-hidden="true"></i>` : ''}${on && side ? `<span class="hz-m__call ${side === 'l' ? 'hz-m__call--l' : ''}" data-swap="call:${d.id}">${d.what.split(' · ')[0]}<small>${d.due.replace(', 2026', '')} · ${daysWord(d.days)}</small></span>` : ''}</button>`;
    }).join('');
    return `<div class="hz-row" style="${lines > 1 ? `height:${(compact ? 20 : 15) + lines * 27}px` : ''}">${compact ? '' : `<span class="hz-lane">${ln}</span>`}<div class="hz-track">${marks}</div></div>`;
  }).join('');
  const sel = items.find((d) => d.id === item);
  const readout = sel && (compact || calloutHidden) ? `<span class="hz-sel" data-swap="sel:${sel.id}"><i class="pip pip--${dueState(sel)[1]}"></i>${sel.what.split(' · ')[0]}<small>${sel.due.replace(', 2026', '')} · ${daysWord(sel.days)}</small></span>` : '';
  return `<section class="hz ${compact ? 'hz--c' : ''}">${readout}${axis}<div class="hz-plot">${grid}<div class="hz-rows">${rows}</div></div></section>`;
}

/* ── the queue ── */
function cpQueue() {
  const { sec, item } = WSX.comp;
  if (sec === 'dot_safety' || sec === 'audits') return rgn('QUEUE', '0', '', `<div style="padding:14px">${ntb(sec === 'audits' ? '<b>AUDITS ARE NOT BUILT.</b> NO AUDIT RECORD EXISTS IN THE LIVE APP.' : '<b>DOT / SAFETY IS NOT BUILT.</b> THE LIVE APP DOES NOT READ FMCSA SAFETY DATA.')}</div>`, 'cp-q');
  const items = cpItems();
  const groups = URG.map(([g, label]) => {
    const list = items.filter((d) => urgency(d) === g);
    if (!list.length) return '';
    return `<div class="grp"><span>${label}</span><span>${list.length}</span></div>${list.map((d) => {
      const s = dueState(d);
      const m = DUE_META[d.id];
      return `<div class="pk cp-row ${d.id === item ? 'is-sel' : ''}" data-a="${VP === 'mobile' ? 'cp.open' : 'cp.item'}" data-v="${d.id}"><span class="cp-cd cp-cd--${s[1]}"><b>${d.days < 0 ? `${d.days}` : d.days === 0 ? 'NOW' : d.days}</b><small>${d.days === 0 ? '' : d.days < 0 ? 'DAY LATE' : 'DAYS'}</small></span><span style="min-width:0"><b class="pk__t">${d.what}</b><span class="pk__s">${clientName(d.client)} · ${d.due.replace(', 2026', '')}</span></span>${av(m.owner)}</div>`;
    }).join('')}`;
  }).join('');
  return rgn(sec === 'corrective' ? 'CORRECTIVE WORK' : 'BY URGENCY', `${items.length}`, '', `${sec === 'corrective' ? `<div style="padding:10px 12px 0">${ntb('<b>NO CORRECTIVE-ACTION MODEL YET.</b> SHOWN FROM THE OUT-OF-SERVICE RECORD.')}</div>` : ''}${groups || '<div class="grp">NOTHING IN THIS VIEW</div>'}`, 'cp-q', 'cp-q');
}

/* ── the case ── */
function cpCase() {
  const { sec, item } = WSX.comp;
  if (sec === 'dot_safety' || sec === 'audits') {
    const fields = sec === 'audits' ? ['CARRIER', 'AUDIT TYPE', 'SCHEDULED', 'DOCUMENTS READY', 'OUTCOME'] : ['CARRIER', 'BASIC SCORES', 'LAST INSPECTION', 'OUT-OF-SERVICE RATE', 'ALERTS'];
    return `<section class="rg cx cp-case"><header class="cx__h"><div class="cx__crumb"><span>COMPLIANCE</span>${ico('fwd')}<span>${sec === 'audits' ? 'AUDITS' : 'DOT / SAFETY'}</span></div><h2 class="cx__t">NOT IN THE PRODUCT YET</h2></header><div class="cx__b"><div class="cp-ghost">${fields.map((f) => `<span>${f}</span>`).join('')}</div>${ntb('THESE FIELDS APPEAR HERE WHEN THE SECTION IS BUILT. THE DESIGN KEEPS THE SAME HORIZON, QUEUE AND CASE.')}</div></section>`;
  }
  const d = DUES[item] && cpItems().some((x) => x.id === item) ? DUES[item] : cpItems()[0];
  if (!d) return `<section class="rg cx cp-case"><div class="cx__b">${ntb('NOTHING IN THIS VIEW')}</div></section>`;
  const s = dueState(d);
  const m = DUE_META[d.id];
  const subj = subjectOf(d);
  const key = `deadline:${d.id}`;
  const pct = Math.max(0, Math.min(100, ((30 - Math.max(d.days, 0)) / 30) * 100));
  const renewed = s[0] === 'RENEWED';
  const primary = d.id === 'dl-tk-09'
    ? simBtn(`cp:auth:${d.id}`, { label: 'REQUEST REPAIR AUTHORIZATION', effect: 'SENDS THE REPAIR ESTIMATE TO T&K TO APPROVE SO THE TRUCK CAN RETURN TO SERVICE.', apply: () => (WSX.over['ticket:t-tk-2'] = ['AUTHORIZATION REQUESTED', 'gold']), rec: key, primary: true })
    : d.id === 'dl-rj-ucr'
      ? simBtn(`cp:pay:${d.id}`, { label: 'ASK FOR PAYMENT AUTHORIZATION', effect: 'ASKS R&J TO AUTHORIZE THE UCR FEE IN THEIR OFFICE.', apply: () => {}, rec: key, primary: true })
      : simBtn(`cp:rem:${d.id}`, { label: m.docs.length ? 'REQUEST THE NEW DOCUMENT' : 'SEND REMINDER', effect: m.docs.length ? 'ASKS THE CLIENT TO UPLOAD THE RENEWED DOCUMENT IN THEIR OFFICE.' : 'REMINDS THE CLIENT IN THEIR OFFICE AND BY EMAIL.', apply: () => {}, rec: key, primary: true });
  const done = simBtn(`cp:done:${d.id}`, { label: 'MARK RENEWED', effect: 'CLOSES THE DEADLINE ONCE THE NEW DOCUMENT IS REVIEWED.', apply: () => (WSX.over[key] = ['RENEWED', 'ok']), rec: key });
  const reassign = simBtn(`cp:own:${d.id}`, { label: 'REASSIGN', effect: 'MOVES THIS DEADLINE TO ANOTHER STAFF MEMBER.', apply: () => {}, rec: key, founder: true, sm: true });
  // ultra-wide has the room: a truck subject is drawn as the Fleet slab, with its eight connections one tap from Fleet
  const vid = subj.truck ? DUE_META[d.id].subject.split(':')[1] : null;
  const slab = vid && WSX.device === 'wide' ? (() => {
    const v = VEHICLES[vid];
    const conns = fleetConns(v);
    return `<div class="fl-slab fl-slab--mini cp-slab" data-swap="slab:${d.id}"><div class="cl-vstage"><svg viewBox="0 0 500 210" aria-hidden="true">${truckShape(FLEET_META[vid].cab)}</svg><span>${sw(vAvail(v))}</span><b>${v.unit}</b></div><div class="fl-cluster">${CONN.map(([k, l, i]) => `<button type="button" class="fl-cg fl-cg--${conns[k].tone}" data-a="go" data-v="fleet:${vid}:${k}" aria-label="${l} · ${conns[k].word} — open in Fleet">${ico(i)}<span>${l}</span><small>${conns[k].tagW || conns[k].word}</small></button>`).join('')}</div></div>`;
  })() : '';
  const subjCard = `<div class="cp-subj">${subj.truck && !slab ? `<svg viewBox="0 0 500 210" class="cp-truck" aria-hidden="true">${truckShape(FLEET_META[DUE_META[d.id].subject.split(':')[1]].cab)}</svg>` : `<span class="cp-subj__b">${badge(ACCOUNTS[d.client])}</span>`}<span style="min-width:0"><small>${subj.kind}</small><b>${subj.title}</b><span>${subj.sub}</span></span><button type="button" class="wbtn wbtn--sm" data-a="go" data-v="${subj.go}">${subj.goLabel}${ico('fwd')}</button></div>`;
  const due = `<div class="cp-due cp-due--${s[1]}"><div><b>${renewed ? 'DONE' : d.days < 0 ? `${-d.days}` : d.days === 0 ? 'NOW' : d.days}</b><span>${renewed ? 'RENEWED' : d.days < 0 ? 'DAY LATE' : d.days === 0 ? 'BLOCKING' : 'DAYS LEFT'}</span></div><div class="cp-due__r"><small>DUE</small><b>${d.due}</b><span class="cp-bar"><i style="width:${renewed ? 0 : pct}%"></i></span></div></div>`;
  const left = `<div class="cp-col cp-col--a"><div class="sec-l">SUBJECT</div>${slab}${subjCard}<div class="sec-l">REQUIRED</div><p class="cx__lead">${m.need}</p></div>`;
  // connected context: what else this client has on the horizon
  const also = vals(DUES).filter((x) => x.client === d.client && x.id !== d.id).sort((a, b) => a.days - b.days);
  const related = `<div class="cp-col cp-col--c">${also.length ? `<div><div class="sec-l">ALSO DUE · ${clientName(d.client)}</div><div class="cp-also">${also.map((x) => { const xs = dueState(x); return `<button type="button" class="cp-also__r" data-a="cp.item" data-v="${x.id}"><span class="cp-cd cp-cd--${xs[1]} cp-cd--s"><b>${x.days < 0 ? x.days : x.days === 0 ? 'NOW' : x.days}</b></span><span><b>${x.what.split(' · ')[0]}</b><small>${x.due.replace(', 2026', '')}</small></span></button>`; }).join('')}</div></div>` : ''}${mhist(key, m.hist)}</div>`;
  const right = `<div class="cp-col cp-col--b"><div class="sec-l"><span>OWNER</span>${reassign}</div><div class="cp-own">${av(m.owner)}<b>${staffName(m.owner)}</b><small>${STAFF[m.owner].area}</small></div><div class="sec-l">DOCUMENTS</div>${m.docs.length ? m.docs.map(docChip).join('') : `<div class="ntb">${ico('folder')}<span>NO DOCUMENT ON FILE YET</span></div>`}</div>`;
  const next = renewed ? nextBlock('RENEWED FOR THIS VISIT', '', 'done') : nextBlock(m.need, `${primary}${done}`);
  return `<section class="rg cx cp-case"><header class="cx__h"><div class="cx__hd" data-swap="hd:${d.id}"><div class="cx__crumb"><span>COMPLIANCE</span>${ico('fwd')}<span>${sec === 'corrective' ? 'CORRECTIVE WORK' : 'EXPIRATIONS'}</span>${ico('fwd')}<span>${d.kind}</span></div><div class="cp-h"><div class="cp-h__t"><h2 class="cx__t">${d.what}</h2><span class="cp-h__s">${sw(s)}<span class="pk__s">${clientName(d.client)}</span></span></div>${due}</div></div></header><div class="cx__b" data-keep="cp-case" data-swap="b:${d.id}">${next}<div class="cp-cols">${left}${right}${related}</div></div></section>`;
}

function compBar() {
  const all = vals(DUES);
  const n = (f) => all.filter(f).length;
  const f = WSX.comp.filter;
  const r = [ro(n((d) => urgency(d) === 'now'), 'NOW', { tone: 'bad', a: 'cp.filter', v: 'now', on: f === 'now' }), ro(n((d) => urgency(d) === 'week'), 'THIS WEEK', { tone: 'warn', a: 'cp.filter', v: 'week', on: f === 'week' }), ro(n((d) => ['now', 'week', 'month'].includes(urgency(d))), 'IN 30 DAYS', { a: 'cp.filter', v: '30', on: f === '30' }), ...(VP === 'mobile' ? [] : [ro(all.length, 'TRACKED', { a: 'cp.filter', v: 'all', on: f === 'all' })])].join('');
  return wsBar('03 · WORK', 'COMPLIANCE', r);
}
function compSections() {
  if (VP === 'mobile') return seg([['expirations', 'EXPIRATIONS'], ['dot_safety', 'DOT / SAFETY', null, true], ['audits', 'AUDITS', null, true], ['corrective', 'CORRECTIVE']], WSX.comp.sec, 'cp.sec', 'wseg--fit');
  return seg([['expirations', 'EXPIRATIONS', vals(DUES).length], ['dot_safety', 'DOT / SAFETY', null, true], ['audits', 'AUDITS', null, true], ['corrective', 'CORRECTIVE WORK', 1]], WSX.comp.sec, 'cp.sec');
}
function compView() {
  if (VP === 'mobile') return `<div class="ws cp cp--m">${compBar()}${compSections()}${cpHorizon(true)}${cpQueue()}</div>${phoneSheet(cpCase(), { label: 'Compliance issue' })}`;
  if (VP === 'tablet') return `<div class="ws cp cp--t">${compBar()}${compSections()}${cpHorizon()}<div class="cp-t2">${cpQueue()}${cpCase()}</div></div>`;
  return `<div class="ws cp">${compBar()}<div class="cp-grid"><div class="cp-top">${compSections()}${cpHorizon()}</div>${cpQueue()}${cpCase()}</div></div>`;
}

ACT['cp.item'] = (id) => {
  WSX.comp.item = id;
  WSX.pending = null;
};
ACT['cp.open'] = (id) => {
  WSX.comp.item = id;
  WSX.sheet = true;
  WSX.pending = null;
};
ACT['cp.sec'] = (s) => {
  WSX.comp.sec = s;
  WSX.comp.filter = 'all';
  WSX.pending = null;
  const first = cpItems()[0];
  if (first) WSX.comp.item = s === 'expirations' && DUES['dl-abc-med'] ? WSX.comp.item : first.id;
};
ACT['cp.filter'] = (f) => {
  WSX.comp.filter = f;
  WSX.comp.sec = 'expirations';
  const list = cpItems();
  if (list.length && !list.some((d) => d.id === WSX.comp.item)) WSX.comp.item = list[0].id;
};


/*
 * PROOF 04 — CLIENTS / CLIENT 360. Relationship-centered: the directory · the company (identity plate, the twelve
 * services as one connected line — lit where the client uses AIO — and one section at a time) · a drill-in panel that
 * keeps the path back (ABC TRUCKING LLC › INSURANCE › UNIT 1). Permissions hold inside it: billing is founder-only.
 */
const clRecords = (cid) => {
  const out = [];
  for (const [type, def] of Object.entries(RECORD_TYPES)) {
    if (['document', 'thread', 'invoice', 'application'].includes(type)) continue;
    for (const r of vals(def.table)) if (r.client === cid) out.push({ type, r, lane: def.lane, s: ov(`${type}:${r.id}`, statusWord(r)) });
  }
  return out;
};
const clOpen = (cid) => clRecords(cid).filter((x) => x.s && !['ok', 'mute'].includes(x.s[1]) && x.type !== 'vehicle' && x.type !== 'driver');
const stackTop = () => WSX.client.stack[WSX.client.stack.length - 1];

/* ── directory ── */
function clDirectory() {
  const { q, filter, id } = WSX.client;
  const list = vals(ACCOUNTS).filter((c) => (filter === 'all' || c.life.toLowerCase() === filter) && (!q || c.name.includes(q.toUpperCase())));
  const rows = list.map((c) => {

function deviceInner(wsId) {
  const w = wsById(wsId);
  studioSet({ page: w.page, role: WSX.role });
  let body;
  try {
    body = w.view();
  } catch (err) {
    console.error(err);
    body = `<div class="ws"><p class="ntb">THIS WORKSPACE FAILED TO DRAW · ${String(err.message || err).toUpperCase()}</p></div>`;

  return `<div class="ao">${header()}${nav()}<main class="main ws-main">${body}</main></div>`;

/** Bring the selected row into view inside its list (after a demo step or a change made elsewhere). */
function revealSelected() {
  screenEl.querySelectorAll('[data-keep] .is-sel').forEach((el) => {
    const box = el.closest('[data-keep]');
    const top = el.offsetTop - box.offsetTop;
    if (top < box.scrollTop || top + el.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTo({ top: Math.max(0, top - 40), behavior: MOTION.reduced() ? 'auto' : 'smooth' });
  });
}

function render({ top = false, reveal = false } = {}) {
  // a newer draw supersedes a drawer that is still leaving
  clearTimeout(RV.closeTimer);
  RV.closing = false;
  const [w, h, vp, wide] = DEVICES[RV.device];
  WSX.device = RV.device;
  studioSet({ vp, wide, role: WSX.role });
  document.querySelector('.rv').dataset.view = RV.view;
  const landing = RV.view === 'overview';
  $('rv-landing').hidden = !landing;
  $('rv-work').hidden = landing;
  if (landing) {
    drawLanding();
  } else {
    WSX.ws = RV.view;
    device.dataset.vp = vp;
    device.dataset.wide = wide ? '1' : '0';
    device.dataset.device = RV.device;
    device.style.width = `${w}px`;
    device.style.height = `${h}px`;
    device.style.setProperty('--dw', `${w}px`);
    device.style.setProperty('--dh', `${h}px`);
    device.style.setProperty('--pad-x', wide ? '24px' : '16px');
    for (const key of Object.keys(SIM)) delete SIM[key];
    const html = deviceInner(RV.view);
    const oldSheet = screenEl.querySelector('.wsheet:not(.is-out)');
    const wasOpen = !!oldSheet;
    const wasShown = !!screenEl.querySelector('.wsheet'); // open, or still leaving
    const draw = () => {
      if (top || !screenEl.firstChild) replaceInto(screenEl, html);
      else morphInto(screenEl, html);
      placeThumbs(screenEl, !top);
      settleSheet(screenEl, wasOpen, RV.opener, wasShown);
      if (reveal) revealSelected();
    };
    // a closing drawer leaves before the workspace behind it changes
    if (oldSheet && !/class="wsheet[ "]/.test(html) && !top && !MOTION.reduced()) {
      RV.closing = true;
      oldSheet.classList.add('is-out');
      screenEl.querySelector('.wscrim')?.classList.add('is-out');

        RV.closing = false;

    $('rv-stagewrap').hidden = RV.before;

}

      <div class="rv-diag rv-diag--one"><button type="button" class="rv-thumb" data-rv-lightbox="family-roots.jpg"><img src="diagnosis/family-roots.jpg" alt="" loading="lazy"><span>APPROVED WORK ROOT NEXT TO THE FOUR WORKSPACES</span></button></div></section>
    <section class="rv-sec"><header><h3>WHAT WAS WRONG</h3><span>THE BATCH 1 DIAGNOSIS</span></header>
      <div class="rv-diag">${diag.map(([f, l]) => `<button type="button" class="rv-thumb" data-rv-lightbox="${f}"><img src="diagnosis/${f}" alt="" loading="lazy"><span>${l}</span></button>`).join('')}</div></section>`;
  scaleMinis();
  placeThumbs($('rv-landing'), false);
}
function scaleMinis() {
  const [dw, dh] = DEVICES[RV.device];
  document.querySelectorAll('.rv-mini').forEach((m) => {
    const s = m.clientWidth / dw;
    m.style.height = `${Math.round(dh * s)}px`;
    m.firstElementChild.style.transform = `scale(${s})`;
  });
}
function drawBefore() {
  const w = wsById(RV.view);
  $('rv-before').innerHTML = `<figure class="rv-beforefig"><figcaption><b>THIS PASS · BEFORE → AFTER</b><span>THE LAST PASS BESIDE THIS ONE</span><button type="button" class="rv-btn rv-btn--on" data-rv-before="0">SEE THE NEW ${w.name}</button></figcaption><img src="diagnosis/${w.pass}" alt="${w.name}: the last pass beside this one"></figure>
    <figure class="rv-beforefig"><figcaption><b>SINCE BATCH 1</b><span>THE SAME SAMPLE RECORDS</span></figcaption><img src="diagnosis/${w.diag}" alt="Batch 1 ${w.name} beside the workspace" loading="lazy"></figure>`;
}

function fit() {
  if (RV.capture) return;
  const [w, h] = DEVICES[RV.device];
  const stage = $('rv-stage');
  const availW = stage.clientWidth;
  const top = stage.getBoundingClientRect().top + window.scrollY;
  const availH = window.innerWidth < 700 ? Infinity : Math.max(480, window.innerHeight - top - 14);
  const s = Math.min(1, availW / w, availH / h);
  device.style.transform = `scale(${s})`;
  $('rv-sizer').style.width = `${Math.floor(w * s)}px`;
  $('rv-sizer').style.height = `${Math.floor(h * s)}px`;
  $('rv-scale').textContent = `${w} × ${h}${s < 1 ? ` · ${Math.round(s * 100)}%` : ''}`;
}

/* ── toasts (inside the device, so they scale with it) ── */
function toast(text) {
  const t = $('rv-toast');
  t.innerHTML = `${ico('pass')}<span>${text}</span>`;
  t.hidden = false;
  t.classList.remove('is-out');
  void t.offsetWidth;
  t.classList.add('is-in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('is-in');
    t.classList.add('is-out');
    toastTimer = setTimeout(() => (t.hidden = true), MOTION.reduced() ? 0 : 180);
  }, 2600);
}
function flash() {
  if (!WSX.flash) return;
  toast(WSX.flash);
  WSX.flash = null;
}

/* ── one action → state → redraw ── */
function run(a, v, { reveal = false } = {}) {
  const fn = ACT[a];
  if (!fn) {
    console.error(`no handler for ${a}`);
    return false;
  }
  fn(v);
  if (WSX.ws !== RV.view) RV.view = WSX.ws; // a cross-workspace jump
  render({ reveal });
  return true;
}
function onTap(e) {
  if (RV.demo != null && e.isTrusted) stopDemo();
  const el = e.target.closest('[data-a], [data-k], [data-act], [data-go], .head__chev');
  if (!el || !screenEl.contains(el) || RV.closing || WSX.loading) return;
  if (el.dataset.a) {
    if (el.matches('input')) return;
    e.preventDefault();
    if (!screenEl.querySelector('.wsheet')) RV.opener = `${el.dataset.a}|${el.dataset.v ?? ''}`;
    if (el.dataset.a === 'sim.ok' && !MOTION.reduced()) return confirmSim(el.dataset.v);
    return run(el.dataset.a, el.dataset.v ?? '');
  }
  shellTap(el);
}
/** A simulated confirmation works briefly (the button shows it), then applies — never long enough to get in the way. */
function confirmSim(key) {
  WSX.loading = key;
  render();
  setTimeout(() => {
    WSX.loading = null;
    run('sim.ok', key);
  }, MOTION.confirm * RV.speed);
}
/** The approved header and navigation stay live: WORK and MORE move between the workspaces, the rest say where they lead. */
function shellTap(el) {
  const k = el.dataset.k;
  if (k === 'work') {
    const next = ['fleet', 'books', 'comp'].includes(RV.view) ? RV.view : 'fleet';
    if (next === RV.view) return toast('WORK · THIS LANE IS OPEN');
    RV.view = next;
    return render({ top: true });
  }
  if (k === 'more') {
    if (RV.view === 'client') return toast('MORE · CLIENTS · CLIENT 360 IS OPEN');
    RV.view = 'client';
    return render({ top: true });
  }
  if (k) return toast(`${k.toUpperCase()} · APPROVED ROOT · UNCHANGED IN THIS REVIEW`);
  const act = el.dataset.act;
  if (act === 'search') {
    const f = screenEl.querySelector('#fl-q, #cl-q');
    if (f) return f.focus();
    return toast('SEARCH · CLIENTS, WORK AND HELP · OUTSIDE THIS REVIEW');
  }
  if (act === 'notifications') return toast('NOTIFICATIONS · OUTSIDE THIS REVIEW');
  if (el.dataset.go === 'home') {
    RV.view = 'overview';
    return render({ top: true });
  }
  return toast(`SIGNED IN AS ${WSX.role === 'founder' ? 'FOUNDER' : 'STAFF'} · SWITCH WITH VIEW AS ABOVE`);
}
function onInput(e) {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  ACT[el.dataset.input]?.(el.value);
  render(); // the morph keeps this very input, its value and its caret
}

/* ── TRY demonstrations ── */
function stopDemo() {
  clearTimeout(RV.timer);
  RV.demo = null;
  RV.step = -1;
  $('rv-cap').hidden = true;
  screenEl.querySelectorAll('.rv-hl').forEach((x) => x.classList.remove('rv-hl'));
  drawChrome();
}
function startDemo(i) {
  stopDemo();
  RV.before = false;
  WSX.sheet = false;
  WSX.pending = null;
  RV.demo = i;
  render();
  nextStep();
}
function findControl(a, v) {
  const sel = v ? `[data-a="${a}"][data-v="${CSS.escape(v)}"]` : `[data-a="${a}"]`;
  return [...screenEl.querySelectorAll(sel)].find((el) => el.getClientRects().length && !el.closest('[inert]'));
}
function nextStep() {
  const list = DEMOS[RV.view]?.[RV.demo]?.[1];
  if (!list) return stopDemo();
  RV.step += 1;
  if (RV.step >= list.length) {
    RV.timer = setTimeout(stopDemo, 1800 * RV.speed);
    return;
  }
  let [a, v, say] = list[RV.step];
  if (VP === 'mobile' && PHONE_ACT[a]) a = PHONE_ACT[a];
  if (VP === 'mobile' && a === 'cl.client' && WSX.client.id !== v) WSX.sheet = 'dir', render();
  const cap = $('rv-cap');
  cap.hidden = false;
  cap.innerHTML = `<i>${RV.step + 1}/${list.length}</i>${say}`;
  const el = findControl(a, v) || (PHONE_ACT[list[RV.step][0]] ? findControl(list[RV.step][0], v) : null);
  if (el) {
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    el.classList.add('rv-hl');
  }
  RV.timer = setTimeout(() => {
    run(a, v, { reveal: true });
    RV.timer = setTimeout(nextStep, 1150 * RV.speed);
  }, (el ? 750 : 250) * RV.speed);
}

/* ── boot ── */
function boot() {
  device = $('rv-device');
  screenEl = $('rv-screen');
  screenEl.addEventListener('click', onTap);
  screenEl.addEventListener('input', onInput);
  screenEl.addEventListener('keydown', (e) => {
    trapTab(e, screenEl);
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.matches?.('[role="button"]') && !t.matches('button')) {
      e.preventDefault();
      t.click();
    }
  });
  document.addEventListener('keydown', (e) => {
    const card = e.target.closest?.('.rv-card');
    if (card && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      return card.click();
    }
    if (e.key !== 'Escape') return;
    if (RV.lightbox) return closeLightbox();
    if (WSX.pending || WSX.sheet) {
      WSX.pending = null;
      WSX.sheet = false;
      render();
    }
  });
  document.querySelector('.rv').addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-rv-tab]');
    if (!b || screenEl.contains(b)) return;
    const d = b.dataset;
    if (d.rvTab) {
      stopDemo();
      RV.view = d.rvTab;
      RV.before = false;
      WSX.sheet = false;
      WSX.pending = null;
      render({ top: true });
      window.scrollTo(0, 0);
    } else if (d.rvDevice) {
      stopDemo();
      RV.device = d.rvDevice;
      WSX.sheet = false;
      WSX.pending = null;
      render({ top: true });
    } else if (d.rvRole) {
      WSX.role = d.rvRole;
      WSX.pending = null;
      if (WSX.role !== 'founder' && WSX.client.view === 'billing') WSX.client.view = 'overview';
      WSX.client.stack = WSX.client.stack.filter((k) => WSX.role === 'founder' || !k.startsWith('invoice:'));
      render();
    } else if (d.rvDemo != null) {
      startDemo(Number(d.rvDemo));
    } else if (d.rvBefore != null) {
      stopDemo();
      RV.before = d.rvBefore === 'toggle' ? !RV.before : d.rvBefore === '1';
      render();
    } else if (d.rvLightbox) {
      openLightbox(d.rvLightbox);
    } else if (d.rvClip) {
      openClip(d.rvClip);
    } else if (d.rvMotion != null) {
      // the review's own switch for reduced motion (the system setting is honoured either way)
      const on = document.documentElement.dataset.motion !== 'reduce';
      if (on) document.documentElement.dataset.motion = 'reduce';
      else delete document.documentElement.dataset.motion;
      b.setAttribute('aria-pressed', String(on));
    } else if (b.id === 'rv-reset') {
      WSX.over = {};
      WSX.hist = {};
      WSX.sims = [];
      WSX.pending = null;
      render();
    }
  });
  $('rv-lightbox').addEventListener('click', (e) => {
    if (!e.target.closest('video')) closeLightbox();
  });
  window.addEventListener('resize', () => (RV.view === 'overview' ? scaleMinis() : fit()));
  const q = new URLSearchParams(location.search);
  const hash = decodeURIComponent(location.hash.slice(1));
  if (wsById(hash) || hash === 'overview') RV.view = hash;
  if (DEVICES[q.get('device')]) RV.device = q.get('device');
  else RV.device = window.innerWidth < 760 ? 'phone' : window.innerWidth < 1100 ? 'tablet' : 'desktop';
  if (['founder', 'staff'].includes(q.get('role'))) WSX.role = q.get('role');
  render({ top: true });
  document.documentElement.dataset.ready = '1';
  /* QA hook (qa.mjs drives the review through it; the review itself never calls it) */
  window.AIO_WS = {
    open(view, devName, role) {
      stopDemo();
      if (view) RV.view = view;
      if (devName) RV.device = devName;
      if (role) WSX.role = role;
      RV.before = false;
      render({ top: true });
    },
    act(a, v) {
      return run(a, v ?? '', { reveal: true });
    },
    set(path, value) {
      const parts = path.split('.');
      let o = WSX;
      while (parts.length > 1) o = o[parts.shift()];
      o[parts[0]] = value;
      render({ reveal: true });
    },
    reset() {
      WSX.over = {};
      WSX.hist = {};
      WSX.sims = [];
      WSX.pending = null;
      WSX.sheet = false;
      WSX.ret = null;
      Object.assign(WSX.fleet, { unit: 'v-tk-09', sec: 'maintenance', filter: 'all', q: '' });
      Object.assign(WSX.books, { client: 'c-tk', period: 'SEP 2026', phase: 'reconcile', item: 'q:q1' });
      Object.assign(WSX.comp, { sec: 'expirations', item: 'dl-abc-med', filter: 'all' });
      Object.assign(WSX.client, { id: 'c-abc', view: 'overview', service: null, stack: [], q: '', filter: 'all' });
      render({ top: true });
    },
    state: () => JSON.parse(JSON.stringify({ view: RV.view, device: RV.device, role: WSX.role, fleet: WSX.fleet, books: WSX.books, comp: WSX.comp, client: WSX.client, sheet: WSX.sheet, pending: WSX.pending, ret: WSX.ret, sims: WSX.sims.length })),
    actions: () => Object.keys(ACT),
    capture(on) {
      RV.capture = !!on;
      if (!on) return fit();
      device.style.transform = 'scale(1)';
      $('rv-sizer').style.width = device.style.width;
      $('rv-sizer').style.height = device.style.height;
    },
    demo(i, speed = 1) {
      RV.speed = speed;
      startDemo(i);
    },
    demoState: () => ({ demo: RV.demo, step: RV.step }),
  };
}
function openLightbox(f) {
  RV.lightbox = f;
  $('rv-lightbox').hidden = false;
  $('rv-lightbox').dataset.kind = 'board';
  $('rv-lightbox').innerHTML = `<img src="diagnosis/${f}" alt=""><span class="rv-lb__x">CLOSE</span>`;
  $('rv-lightbox').scrollTop = 0;
}
/** A recorded interaction: the last pass beside this one, both playing. */
function openClip(id) {
  const [, t, dev] = CLIPS.find(([x]) => x === id);
  RV.lightbox = id;
  $('rv-lightbox').hidden = false;
  $('rv-lightbox').dataset.kind = dev === 'PHONE' ? 'clip-phone' : 'clip';
  const v = (label) => `<figure><figcaption>${label === 'before' ? 'BEFORE · LAST PASS' : 'AFTER · THIS PASS'}</figcaption><video autoplay muted loop playsinline controls preload="auto"><source src="motion/${id}-${label}.webm" type="video/webm"><source src="motion/${id}-${label}.mp4" type="video/mp4"></video></figure>`;
  $('rv-lightbox').innerHTML = `<div class="rv-lb__clip"><p><i>${id}</i><b>${t}</b><span>${dev} · REAL CLICKS IN CHROMIUM · NOTHING SAVED</span></p><div class="rv-lb__v">${v('before')}${v('after')}</div></div><span class="rv-lb__x">CLOSE</span>`;
  $('rv-lightbox').scrollTop = 0;
}
function closeLightbox() {
  RV.lightbox = null;
  $('rv-lightbox').hidden = true;
  $('rv-lightbox').innerHTML = ''; // stops the clips
}


boot();
</script>
