.fl-rost__tools .wseg__b { flex: 1; justify-content: center; }
.fl-row { grid-template-columns: 42px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 12px 10px 14px; }
.fl-row__u { font: 800 25px/0.84 var(--cond); letter-spacing: -0.01em; }
.fl-row__t { display: grid; gap: 5px; min-width: 0; }
.fl-row__t .pk__t, .fl-row__t .pk__s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-row__r { display: grid; justify-items: end; gap: 6px; }
.fl-row__r .sw { font-size: var(--fs-micro); gap: 5px; }
.fl-fp { display: flex; gap: 2px; }
.fl-fp__d { width: 5px; height: 10px; border-radius: 1.5px; background: #e6dfd2; }
.fl-fp__d--ok { background: #a9cfb1; }
.fl-fp__d--gold { background: #e7ab3c; }
.fl-fp__d--warn { background: #e09a33; }
.fl-fp__d--bad { background: #b23a34; }
.fl-row.is-sel { background: var(--obsidian); }
.fl-row.is-sel .fl-row__u { color: #fff3d6; }
.fl-row.is-sel .pk__t { color: #f2e9d6; }
.fl-row.is-sel .pk__s { color: #a59c8b; }
.fl-row.is-sel .fl-fp__d--mute, .fl-row.is-sel .fl-fp__d { opacity: 0.95; }

.fl-stage { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-radius: 16px; overflow: hidden; background: var(--stage); color: var(--stage-ink); box-shadow: var(--e-stage); }
.fl-stage__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 78%; opacity: 0.55; filter: saturate(0.6) contrast(1.1) brightness(0.85); }
.fl-stage::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(20, 20, 22, 0.97) 0%, rgba(20, 20, 22, 0.74) 30%, rgba(20, 20, 22, 0.5) 66%, rgba(20, 20, 22, 0.9) 100%), radial-gradient(70% 55% at 50% 72%, rgba(231, 171, 60, 0.1), transparent 70%); }
.fl-stage > :not(.fl-stage__img) { position: relative; z-index: 2; }
.fl-stage__id { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: end; padding: 18px 22px 0; }
.fl-stage__unit { display: grid; gap: 7px; }
.fl-stage__unit small { font: 600 9px/1 var(--text); letter-spacing: 0.13em; color: var(--stage-mute); }
.fl-stage__unit b { font: 800 56px/0.8 var(--cond); letter-spacing: -0.005em; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; padding-top: 3px; }
.fl-stage__unit span { font: 700 12px/1 var(--cond); letter-spacing: 0.14em; color: #d9cba9; }
.fl-stage__st { display: grid; gap: 10px; justify-items: start; align-self: end; }
.fl-big { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 6px; font: 800 12px/1 var(--cond); letter-spacing: 0.12em; }
.fl-big--bad { background: #5b1d1d; color: #ffd9d4; box-shadow: inset 0 0 0 1px #8c2e2e; }
.fl-big--warn { background: #4d3613; color: #ffe2a8; box-shadow: inset 0 0 0 1px #7a5520; }
.fl-big--ok { background: #1f3a26; color: #c9ecd0; box-shadow: inset 0 0 0 1px #2f5a3a; }
.fl-big--gold { background: #4a3a14; color: #f7d27a; box-shadow: inset 0 0 0 1px #7a6020; }
.fl-client { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 3px; border-radius: 8px; background: rgba(255, 255, 255, 0.04); border: 1px solid #3a3632; color: var(--stage-ink); font: 700 10.5px/1 var(--cond); letter-spacing: 0.1em; }
.fl-client .badge { width: 24px; height: 24px; font-size: 9px; border-radius: 6px; background: #2b2b2e; color: var(--gold-hi); }
.fl-client .ico { width: 12px; height: 12px; color: var(--gold); }
.fl-client:hover { border-color: var(--gold-lo); }
.fl-stage__ro { margin: 0; display: grid; gap: 9px; justify-items: end; text-align: right; }
.fl-stage__ro div { display: grid; gap: 4px; }
.fl-stage__ro dt { font: 600 9px/1 var(--text); letter-spacing: 0.13em; color: var(--stage-mute); }
.fl-stage__ro dd { margin: 0; font: 700 11.5px/1 var(--cond); letter-spacing: 0.08em; color: #efe3c6; }
.fl-stage__ro small { font: 600 9px/1 var(--text); color: #8d846f; letter-spacing: 0.1em; }
.fl-bpwrap { container-type: size; display: grid; place-items: center; min-height: 0; padding: 0 8px 8px; }
.fl-bp { position: relative; width: min(100cqw, calc(100cqh * 2.3)); aspect-ratio: 760 / 330; }
.fl-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.t-body { fill: rgba(241, 193, 88, 0.05); stroke: #e8d4a4; stroke-width: 1.4; stroke-linejoin: round; }
.t-l1 { fill: none; stroke: #e8d4a4; stroke-width: 1.3; }
.t-l2 { fill: none; stroke: #bfae86; stroke-width: 1.2; }
.t-l3 { fill: none; stroke: #8f8266; stroke-width: 1; }
.t-glass { fill: rgba(190, 210, 230, 0.09); stroke: #e8d4a4; stroke-width: 1.1; }
.t-tire { fill: #121214; stroke: #e8d4a4; stroke-width: 1.4; }
.t-rim { fill: none; stroke: #bfae86; stroke-width: 1.1; }
.t-hub { fill: #e8d4a4; }
.t-lug { fill: #8f8266; }
.t-shadow { fill: rgba(0, 0, 0, 0.55); }
.t-dim { fill: none; stroke: #5d564a; stroke-width: 1; stroke-dasharray: 3 3; }
.t-lead { fill: none; stroke: #6c6454; stroke-width: 1; stroke-dasharray: 2 3; }
.t-lead--bad { stroke: #a8504b; }
.t-lead--warn { stroke: #b98a3c; }
.t-lead.is-on { stroke-opacity: 0; }
.t-lead-on { fill: none; stroke: #f1c158; stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 0; }
.t-lead-on[data-swap] { animation: wsDraw var(--m-panel) var(--ease-out) both; }
.t-sel { fill: none; stroke: #f1c158; stroke-width: 1.4; opacity: 0; transform-box: fill-box; transform-origin: center; }
.t-sel[data-swap] { animation: wsRing var(--m-context) var(--ease-out) both; }
.t-truck[data-swap] { animation: wsTruck var(--m-context) var(--ease-out) both; }
@keyframes wsTruck { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.t-dot { fill: #e8d4a4; r: 3.6px; transition: r var(--m-select) var(--ease-out), fill var(--m-select) var(--ease-std); }
.t-dot--bad { fill: #e2685f; }
.t-dot--warn { fill: #f1b24a; }
.t-dot--mute { fill: #6c6454; }
.t-dot.is-on { fill: #f1c158; stroke: #141416; stroke-width: 2; r: 5.2px; }
.t-ring { fill: none; stroke-width: 1.2; stroke-opacity: 0.45; }
.t-ring--bad { stroke: #e2685f; }
.t-ring--warn { stroke: #f1b24a; }
.fl-tag { position: absolute; transform: translate(-50%, -100%); display: grid; gap: 4px; width: 24%; padding: 6px 8px 7px; border-radius: 8px; background: rgba(26, 26, 29, 0.94); border: 1px solid #3a3632; color: var(--stage-ink); text-align: left; overflow: hidden; isolation: isolate; }
.fl-tag::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--gold-fill); opacity: 0; transition: opacity var(--m-select) var(--ease-std); }
.fl-tag--bottom { transform: translate(-50%, 0); }
.fl-tag__l { display: flex; align-items: center; gap: 5px; font: 700 var(--fs-micro)/1 var(--text); letter-spacing: 0.1em; color: var(--stage-mute); white-space: nowrap; }
.fl-tag__l .ico { width: 12px; height: 12px; color: var(--gold); }
.fl-tag__w { font: 700 10.5px/1.1 var(--cond); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-tag--bad { border-color: #7a3330; }
.fl-tag--bad .fl-tag__w { color: #ffb3aa; }
.fl-tag--warn .fl-tag__w { color: #ffd58a; }
.fl-tag--mute .fl-tag__w { color: #8f8778; }
.fl-tag--ok .fl-tag__w { color: #cfe8d4; }
.fl-tag:hover { border-color: var(--gold-lo); }
.fl-tag.is-on { border-color: transparent; color: #1a140a; box-shadow: 0 0 0 1px rgba(247, 210, 122, 0.8), 0 8px 22px rgba(214, 150, 40, 0.3); }
.fl-tag.is-on::before { opacity: 1; }
.fl-tag.is-on .fl-tag__l, .fl-tag.is-on .fl-tag__l .ico, .fl-tag.is-on .fl-tag__w { color: #1a140a; }
.fl-next .rg__b { overflow: visible; }
.fl-nx { grid-template-columns: 4px 30px minmax(0, 1fr) 14px; gap: 3px 12px; padding: 10px 14px 10px 0; }
.fl-nx > span:nth-child(3) { display: grid; gap: 4px; }
.fl-nx__bar { align-self: stretch; border-radius: 0 3px 3px 0; background: #d9d1c2; }
.fl-nx__bar--bad { background: var(--bad); }
.fl-nx__bar--warn { background: #d18a1b; }
.fl-nx__ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #f6efe0; color: var(--gold-ink); }
.fl-nx__ico .ico { width: 16px; height: 16px; }
.fl-nx .chev { width: 12px; height: 12px; color: var(--ink-4); }
.fl-nx.is-sel::before { display: none; }
.fl-clear { display: flex; gap: 10px; align-items: center; padding: 18px 16px; color: var(--ok); font: 700 12px/1 var(--cond); letter-spacing: 0.08em; }
.fl-clear .ico { width: 16px; height: 16px; }
.fl-ctabs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 10px; background: #ece6da; }
.fl-ctab { position: relative; display: grid; place-items: center; height: 32px; border-radius: 7px; color: var(--ink-2); }
.fl-ctab .ico { width: 16px; height: 16px; }
.fl-ctab .pip { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; }
.fl-ctab:hover { background: rgba(255, 253, 249, 0.7); }
.fl-ctab.is-on { background: var(--obsidian); color: var(--gold); }
/* tablet */
.fl--t { grid-template-rows: auto auto minmax(0, 1.1fr) minmax(0, 1fr); }
.fl--t .fl-bpwrap { padding: 26px 8px 34px; }
.fl-strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
.fl-strip::-webkit-scrollbar { display: none; }
.fl-chip { flex: none; display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 10px; padding: 8px 12px 9px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); text-align: left; }
.fl-chip b { font: 800 21px/0.86 var(--cond); }
.fl-chip span { grid-column: 1 / -1; font: 600 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); white-space: nowrap; }
.fl-chip .pip { justify-self: end; }
.fl-chip.is-sel { background: var(--obsidian); border-color: var(--obsidian); color: #fff3d6; }
.fl-chip.is-sel span { color: #a59c8b; }
.fl-t2 { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 12px; min-height: 0; }
.fl-t2 .fl-next .rg__b { overflow: auto; }
/* phone */
.fl--m .fl-stage__id { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 14px 0; gap: 10px; }
.fl--m .fl-stage__ro { display: none; }
.fl--m .fl-stage__unit b { font-size: 42px; }
.fl--m .fl-stage__st { justify-items: end; }
.fl--m .fl-bpwrap { container-type: inline-size; padding: 4px 10px 10px; }
.fl--m .fl-bp { width: 100%; }
.fl--m .fl-chip { padding: 7px 12px; }
.fl-slab { display: grid; border-radius: 16px; overflow: hidden; background: var(--stage); box-shadow: var(--e-stage); }
.fl-slab > .fl-stage { border-radius: 0; box-shadow: none; }
.fl-cluster { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #2c2a26; border-top: 1px solid #34312c; }
.fl-cg { position: relative; display: grid; justify-items: center; align-content: start; gap: 5px; padding: 11px 4px 10px; background: linear-gradient(180deg, #1c1c1f, #151517); color: var(--stage-ink); text-align: center; min-width: 0; }
.fl-cg .ico { width: 19px; height: 19px; color: var(--gold); }
.fl-cg span { font: 700 var(--fs-micro)/1 var(--cond); letter-spacing: 0.06em; color: #e2d5b6; white-space: nowrap; }
.fl-cg small { font: 700 var(--fs-micro)/1.2 var(--text); letter-spacing: 0.03em; color: var(--stage-mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; max-width: 100%; }
.fl-cg::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; transition: background-color var(--m-select) var(--ease-std); }
.fl-cg--ok small { color: #a9d7b4; }
.fl-cg--bad small { color: #ff9e95; }
.fl-cg--bad::after { background: #a8443d; }
.fl-cg--warn small { color: #ffd07c; }
.fl-cg--warn::after { background: #c98a2c; }
.fl-cg:active { transform: scale(0.98); }
.fl-cg.is-on { background: linear-gradient(180deg, #2c2518, #1d1a14); box-shadow: inset 0 0 0 1px rgba(241, 193, 88, 0.6); }
.fl-cg.is-on::after { background: var(--gold); }

/* ═══════════════ 02 · BOOKKEEPING ═══════════════ */
.bk { grid-template-rows: auto auto minmax(0, 1fr); }
[data-vp='desktop'] .bk { grid-template-rows: auto auto minmax(0, 1fr); }
.bk-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr) 356px; gap: 14px; min-height: 0; }
[data-wide='1'] .bk-grid { grid-template-columns: 380px minmax(0, 1fr) 560px; gap: 20px; }
.bk-period { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 3px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--paper); }
.bk-period b { font: 800 14px/1 var(--cond); letter-spacing: 0.06em; min-width: 78px; text-align: center; }
.bk-period .wbtn { border: 0; height: 28px; width: 28px; }
.bk-period .wbtn:disabled { opacity: 0.28; cursor: default; }
.bk-spine { display: grid; padding: 10px 16px 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
.bk-spine__ph, .bk-spine__rule { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); }
.bk-ph { display: flex; align-items: baseline; gap: 10px; margin: 0 3px; padding: 8px 10px 9px; border-radius: 9px 9px 0 0; border-bottom: 2px solid #ddd4c4; text-align: left; min-width: 0; }
.bk-ph b { font: 800 13px/1 var(--cond); letter-spacing: 0.12em; }
.bk-ph span { font: 700 9px/1 var(--text); letter-spacing: 0.1em; color: var(--ink-3); white-space: nowrap; }
.bk-ph--done { border-bottom-color: #8fbf98; }
.bk-ph--now { border-bottom-color: var(--gold-lo); }
.bk-ph:hover:not(.is-on) { background: #f7f1e5; }
.bk-ph.is-on { background: var(--obsidian); border-bottom-color: var(--gold); }
.bk-ph.is-on b { color: var(--nav-gold); }
.bk-ph.is-on span { color: #a59c8b; }
.bk-spine__rule { position: relative; margin-top: 12px; }
.bk-spine__rule::before { content: ''; position: absolute; left: calc(100% / 18); right: calc(100% / 18); top: 10px; height: 2px; background: #ddd4c4; }
.bk-node { position: relative; display: grid; justify-items: center; gap: 7px; text-align: center; }
.bk-node i { position: relative; z-index: 1; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--paper); border: 1.5px solid #d6ccba; font: 700 9.5px/1 var(--text); font-style: normal; color: var(--ink-3); }
.bk-node i .ico { width: 11px; height: 11px; }
.bk-node span { font: 700 9px/1.25 var(--text); letter-spacing: 0.1em; color: var(--ink-3); max-width: 96px; }
.bk-node--done i { background: var(--ok-bg); border-color: #9cc6a5; color: var(--ok); }
.bk-node--done::after { content: ''; position: absolute; left: 50%; right: -50%; top: 10px; height: 2px; background: #8fbf98; }
.bk-node:last-child::after { display: none; }
.bk-node--now i { background: var(--gold-fill); border-color: transparent; color: #1a140a; box-shadow: 0 0 0 4px rgba(231, 171, 60, 0.2); }
.bk-node--now span { color: var(--ink); }
.lt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.lt th { position: sticky; top: 0; z-index: 1; background: #faf6ee; text-align: left; padding: 10px 14px; font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: var(--ink-3); border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
.lt td { padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.lt td .pk__t, .lt td .pk__s { display: block; }
.lt td .pk__s { margin-top: 3px; }
.lt-row { cursor: pointer; }
.lt-row:hover { background: #fcf7ec; }
.lt-row.is-sel { background: var(--tint); box-shadow: inset 3px 0 0 var(--gold-lo); }
.lt-m { font: 600 9.5px/1.2 var(--text); letter-spacing: 0.1em; color: var(--ink-3); white-space: nowrap; }
.lt-r { text-align: right; }
.lt-amt { font: 700 14px/1 var(--cond); letter-spacing: 0.02em; text-align: right; white-space: nowrap; }
.lt-amt::before { content: '$'; font-size: 10px; color: var(--ink-3); margin-right: 1px; vertical-align: 2px; }
.lt-sub td { padding: 16px 14px 7px; font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: var(--ink-3); border-bottom: 1px solid var(--rule-2); }
.lt-empty { text-align: center; color: var(--ink-3); font: 600 10px/1 var(--text); letter-spacing: 0.12em; padding: 22px !important; }
.bk-ask { font: 700 10.5px/1.2 var(--cond); letter-spacing: 0.06em; color: var(--warn); }
.bk-tick { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #d6ccba; }
.bk-tick--ok { background: var(--ok-bg); border-color: #9cc6a5; color: var(--ok); }
.bk-tick .ico { width: 11px; height: 11px; }
.bk-cl { grid-template-columns: auto minmax(0, 1fr); align-items: start; padding: 12px 14px; }
.bk-cl > span { display: grid; gap: 6px; }
.bk-mini { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 2px; }
.bk-mini i { height: 4px; border-radius: 2px; background: #e4ddd0; }
.bk-mini i.d { background: #9cc6a5; }
.bk-mini i.n { background: var(--gold-lo); }
.bk-cats { display: flex; flex-wrap: wrap; gap: 6px; }
.bk-amt { display: grid; gap: 5px; padding: 14px 16px; border-radius: 12px; background: var(--obsidian); color: var(--stage-ink); }
.bk-amt small { font: 600 9px/1 var(--text); letter-spacing: 0.13em; color: var(--stage-mute); }
.bk-amt b { font: 800 36px/0.9 var(--cond); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; color: #fff3d6; }
.bk-amt b::before { content: '$'; font-size: 18px; vertical-align: 12px; margin-right: 2px; color: var(--gold); }
.bk-amt span { font: 600 9px/1 var(--text); letter-spacing: 0.12em; color: var(--stage-mute); }
.bk-paused { display: grid; gap: 10px; justify-items: start; padding: 22px; }
.bk-paused b { font: 800 18px/1.1 var(--cond); letter-spacing: 0.04em; }
.bk-paused span { font: 600 10px/1.3 var(--text); letter-spacing: 0.1em; color: var(--ink-3); }
.bk--t { grid-template-rows: auto auto auto minmax(0, 1fr); }
.bk-t2 { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; min-height: 0; }
.bk-strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
.bk-strip::-webkit-scrollbar { display: none; }
.bk-chip { flex: none; display: grid; grid-template-columns: auto auto; align-items: center; gap: 7px 8px; padding: 7px 12px 8px 7px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); font: 700 10.5px/1 var(--cond); letter-spacing: 0.06em; text-align: left; }
.bk-chip .badge { width: 24px; height: 24px; font-size: 9px; border-radius: 6px; }
.bk-chip .bk-mini { grid-column: 1 / -1; width: 100%; }
.bk-chip.is-sel { background: var(--obsidian); color: #f2e9d6; border-color: var(--obsidian); }
.ros--m { display: flex; justify-content: space-between; padding: 9px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.bk--t .bk-node span, [data-vp='mobile'] .bk-node span { display: none; }
/* phone: the table becomes a list — what it is and its state on one line, the question under it */
[data-vp='mobile'] .lt, [data-vp='mobile'] .lt tbody { display: block; }
[data-vp='mobile'] .lt thead, [data-vp='mobile'] .lt .lt-m, [data-vp='mobile'] .lt td:empty { display: none; }
[data-vp='mobile'] .lt tr { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; padding: 12px 14px; border-bottom: 1px solid var(--rule); }
[data-vp='mobile'] .lt td { padding: 0; border: 0; }
[data-vp='mobile'] .lt td:has(.pk__t) { flex: 1 1 0; min-width: 0; }
[data-vp='mobile'] .lt .lt-q { flex-basis: 100%; }
[data-vp='mobile'] .lt .lt-sub { padding: 16px 14px 7px; }

/* ═══════════════ 03 · COMPLIANCE ═══════════════ */
.cp-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); grid-template-rows: auto minmax(0, 1fr); gap: 14px; min-height: 0; }
[data-wide='1'] .cp-grid { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 18px; }
.cp-top { grid-column: 1 / -1; display: grid; gap: 10px; min-width: 0; }
.cp-top > .wseg { justify-self: start; }
.hz { position: relative; padding: 12px 18px 22px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; }
.hz-months { position: relative; height: 18px; margin-left: 110px; }
.hz-months span { position: absolute; top: 0; height: 14px; padding-left: 7px; border-left: 1px solid var(--rule-2); font: 800 11px/14px var(--cond); letter-spacing: 0.22em; color: var(--ink-2); box-sizing: border-box; }
.hz-plot { position: relative; margin-left: 110px; }
.hz-wk { position: absolute; top: 0; bottom: 0; width: 1px; background: #f0eadf; }
.hz-zone { position: absolute; top: 0; bottom: 0; }
.hz-zone--late { background: repeating-linear-gradient(135deg, rgba(150, 42, 42, 0.07) 0 6px, rgba(150, 42, 42, 0.02) 6px 12px); }
.hz-zone--week { background: rgba(231, 171, 60, 0.11); }
.hz-today { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--gold-fill); z-index: 1; }
.hz-today span { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 700 9px/1 var(--text); letter-spacing: 0.13em; color: var(--gold-ink); }
.hz-30 { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #cdbf9f; }
.hz-30 span { position: absolute; bottom: -16px; left: 4px; white-space: nowrap; font: 600 9px/1 var(--text); letter-spacing: 0.1em; color: #9b8c6c; }
.hz-rows { position: relative; display: grid; }
.hz-row { position: relative; height: 42px; box-sizing: content-box; border-bottom: 1px solid var(--rule); }
.hz-row:last-child { border-bottom: 0; }
.hz-lane { position: absolute; left: -110px; width: 100px; top: 50%; transform: translateY(-50%); font: 700 9px/1 var(--text); letter-spacing: 0.16em; color: var(--ink-3); }
.hz-track { position: absolute; inset: 0; }
.hz-m { position: absolute; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 32px; height: 24px; border-radius: 7px; background: var(--paper); border: 1.5px solid #cfc5b3; font: 800 10px/1 var(--cond); letter-spacing: 0.04em; color: var(--ink-2); z-index: 2; }
.hz-m--bad { background: #fbe9e6; border-color: #c66a63; color: var(--bad); }
.hz-m--warn { background: #fdf1d9; border-color: #d9a04a; color: var(--warn); }
.hz-m--gold { background: #fbf1d8; border-color: #e0b866; color: var(--gold-ink); }
.hz-m--ok { background: var(--ok-bg); border-color: #9cc6a5; color: var(--ok); }
.hz-m:hover { box-shadow: 0 0 0 3px rgba(231, 171, 60, 0.2); }
.hz-m.is-on { background: var(--obsidian); border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 4px rgba(231, 171, 60, 0.22), 0 6px 16px rgba(20, 16, 10, 0.3); z-index: 3; }
.hz-m__call { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); display: grid; gap: 4px; padding: 6px 9px; border-radius: 7px; background: var(--obsidian); color: #f2e9d6; white-space: nowrap; text-align: left; font: 700 10.5px/1 var(--cond); letter-spacing: 0.06em; }
.hz-m__call small { font: 600 9px/1 var(--text); letter-spacing: 0.1em; color: var(--gold); }
.hz-m__call--l { left: auto; right: calc(100% + 10px); }
.hz--ghost .hz-plot { height: 168px; }
.hz-ghost { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 0 12px; }
/* the message sits on its own plate, so the TODAY line and the grid run behind it, never through the words */
.hz-ghost__m { display: grid; justify-items: center; gap: 7px; max-width: 340px; padding: 12px 16px; border-radius: 10px; text-align: center; background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 8px 18px rgba(20, 16, 10, 0.06); }
.hz-ghost b { font: 800 16px/1 var(--cond); letter-spacing: 0.08em; color: var(--ink-2); }
.hz-ghost span { font: 600 9.5px/1.3 var(--text); letter-spacing: 0.12em; color: var(--ink-3); }
.hz--c { padding: 10px 12px 20px; }
.hz--c .hz-months, .hz--c .hz-plot { margin-left: 0; }

function laneSignals(l, compact) {
  if (l.none) return [`<span class="sig sig--mute">NO STAFF WORKSPACE YET</span>`];
  const out = [];
  if (l.att === null) out.push(`<span class="sig sig--mute">${compact ? 'NOT CONNECTED YET' : 'ATTENTION NOT CONNECTED YET'}</span>`);
  else if (l.att === 0) out.push(`<span class="sig sig--ok">NOTHING NEEDS ATTENTION</span>`);
  else out.push(`<span class="sig sig--warn">${l.att} NEED${l.att === 1 ? 'S' : ''} ATTENTION</span>`);
  if (l.blocked) out.push(`<span class="sig sig--bad">${l.blocked} BLOCKED</span>`);
  return out;
}

/* ═══════════════ mount ═══════════════ */
async function mount() {
  const sheet = await (await fetch(`${P}/migration/icons/aio-icon-sheet.svg`)).text();
  const holder = document.createElement('div');
  holder.style.display = 'none';
  holder.innerHTML = sheet;
  document.body.appendChild(holder);
  const body = { home, work, reports, more, kit }[PAGE]();
  const app = document.createElement('div');
  app.className = 'ao';
  app.innerHTML = PAGE === 'kit' ? body : `${header()}${nav()}${body}`;
  document.body.appendChild(app);
  if (VP === 'desktop' && WIDE) document.documentElement.style.setProperty('--pad-x', '24px');
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
  document.documentElement.dataset.ready = '1';
}
if (!EMBED) mount();

/** Page header: back, breadcrumb, title, subtitle, status words, actions. */
function pageHead({ trail = [], title, sub = '', chips = [], actions = '', back = true }) {
  return `<header class="pg">
    <div class="pg__top">${back ? `<button class="pg__back" data-act="back" aria-label="Back">${ico('back')}</button>` : ''}${crumbs(trail)}</div>
    <div class="pg__main"><div class="pg__text"><h1 class="pg__title">${title}</h1>${sub ? `<p class="pg__sub">${sub}</p>` : ''}${chips.length ? `<div class="pg__chips">${chips.map((c) => (Array.isArray(c) ? st(c) : c)).join('')}</div>` : ''}</div>${actions ? `<div class="pg__acts">${actions}</div>` : ''}</div>
  </header>`;
}

/** Slim photographic band for a lane landing (the lane's own photograph, as on the WORK cards). */
function laneBand(l, kicker, title, sub) {
  const photo = l.photo.startsWith('standins/') ? l.photo : l.photo;
  return `<section class="plate plate--dark band lane-band bleed"><img src="${photo}" alt="" style="object-position:${PHOTO_POS[l.n] || '50% 50%'}">
    ${l.standin ? '<span class="lane__standin band__standin">STAND-IN</span>' : ''}
    <p class="hero__kicker">${kicker}</p><h1 class="hero__title"><span>${title}</span></h1>${sub ? `<p class="hero__sub">${sub}</p>` : ''}</section>`;
}

/** Client context bar: the one place that says whose work this is. */
function ctxBar(id, { compact = false } = {}) {
  const c = client(id);
  if (!c) return '';
  return `<div class="ctx ${compact ? 'ctx--compact' : ''}" role="region" aria-label="Client context">
    <span class="badge ${c.life === 'PREBUILT' ? 'badge--pre' : ''}">${c.b}</span>
    <span class="ctx__t"><b>${c.name}</b><small>${c.dot} · ${c.mc} · ${c.state}</small></span>
    ${st(LIFE[c.life])}
    <span class="ctx__acts"><span class="btn btn--sm" data-go="client/${c.id}">${ico('company')}CLIENT 360</span><span class="btn btn--sm" data-act="switch">${ico('people')}SWITCH</span><span class="btn btn--sm btn--icon" data-act="clear-client" aria-label="Clear client">${ico('close')}</span></span>
  </div>`;
}

function tabs(items, active) {
  return `<div class="tabs" role="tablist">${items
    .map(([id, label, count, route, tone]) => `<a role="tab" class="tab ${id === active ? 'is-on' : ''} ${tone ? `tab--${tone}` : ''}" data-go="${route}" aria-selected="${id === active}">${label}${count != null ? `<i>${count}</i>` : ''}</a>`)
    .join('')}</div>`;
}

/** A list row that becomes a table row on desktop: lead · title / sub · meta · status · chevron. */
function row({ go, lead = '', title, sub = '', meta = '', status = null, extra = '', sim = null }) {
  const target = go ? `data-go="${go}"` : sim ? `data-sim="${sim}"` : '';
  return `<div class="row ${target ? '' : 'row--static'}" ${target}>${lead ? `<span class="row__lead">${lead}</span>` : ''}<span class="row__t"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}${extra}</span>${meta ? `<span class="row__m">${meta}</span>` : ''}${status ? `<span class="row__s">${st(status)}</span>` : ''}${go ? ico('fwd', 'chev') : ''}</div>`;
}
const rows = (list, empty = 'NOTHING HERE') => `<div class="panel rows">${list.length ? list.map(row).join('') : `<div class="rows__empty">${empty}</div>`}</div>`;
const badge = (c) => `<span class="badge ${c?.life === 'PREBUILT' ? 'badge--pre' : ''}">${c?.b ?? '—'}</span>`;
const icoTile = (name) => `<span class="row__ico">${ico(name)}</span>`;

function kv(pairs, cols = 2) {
  return `<dl class="kv kv--${cols}">${pairs
    .map(([k, v, note]) => `<div class="kv__i"><dt>${k}</dt><dd>${v}${note ? `<small>${note}</small>` : ''}</dd></div>`)
    .join('')}</dl>`;
}

function timeline(events) {
  return `<ol class="tl">${events
    .map(([when, what, who, vis]) => `<li class="tl__i"><span class="tl__dot"></span><span class="tl__w">${when}</span><span class="tl__t">${what}</span><span class="tl__m">${who ?? ''}${vis ? ` <span class="tag-vis tag-vis--${vis}">${vis === 'client' ? 'CLIENT-VISIBLE' : vis === 'sim' ? 'SIMULATED · NOT SAVED' : 'INTERNAL'}</span>` : ''}</span></li>`)
    .join('')}</ol>`;
}

/** Related records — linked, never copied. */
function related(items) {
  return `<div class="panel rel">${items
    .map(({ lane, title, go, why, status }) => `<div class="rel__i ${go ? '' : 'rel__i--static'}" ${go ? `data-go="${go}"` : ''}><span class="rel__l">${lane}</span><span class="rel__t">${title}</span>${why ? `<small>${why}</small>` : ''}${status ? st(status) : ''}${go ? ico('fwd', 'chev') : ''}</div>`)
    .join('')}</div>`;
}

/** Empty / blocked / not-built states show the shape of the page and why it cannot fill yet. */
function stateBlock({ kind = 'notbuilt', title, body, gap, fields = [] }) {
  const label = { notbuilt: 'NOT BUILT YET', blocked: 'BLOCKED', empty: 'NOTHING HERE YET', paused: 'PAUSED' }[kind];
  if (kind === 'notbuilt' && typeof PAGE_GAPS !== 'undefined') PAGE_GAPS.push(title);
  return `<div class="panel stb stb--${kind}">
    <div class="stb__head">${st([label, kind === 'blocked' || kind === 'paused' ? 'bad' : 'mute'])}<b>${title}</b></div>
    <p>${body}</p>
    ${fields.length ? `<div class="stb__fields">${fields.map((f) => `<span>${f}</span>`).join('')}</div>` : ''}
    ${gap ? `<small class="stb__gap">${gap}</small>` : ''}
  </div>`;
}

function stepper(steps, idx) {
  return `<ol class="steps">${steps.map((s, i) => `<li class="${i < idx ? 'is-done' : i === idx ? 'is-on' : ''}"><i>${i < idx ? ico('pass') : i + 1}</i><span>${s}</span></li>`).join('')}</ol>`;
}

function section(title, sub, body, right = '') {
  return `<section class="sec">${secHead(title, sub, right)}${body}</section>`;
}

/** Actions: founder-only ones never render for staff. Every action here is SIMULATED in the review (data-sim):
 *  { label, sim, ico, founder, effect: what the live office would do, set: 'type:id=WORD|tone' (session status) }. */
const simAttrs = (a) => `data-sim="${a.sim}" data-label="${a.label}"${a.effect ? ` data-effect="${a.effect}"` : ''}${a.set ? ` data-set="${a.set}"` : ''}`;
function actionsBar(list) {
  return list
    .filter((a) => !a.founder || FOUNDER)
    .map((a, i) => (a.off ? `<span class="btn btn--ghost" aria-disabled="true" title="${a.off}">${a.label}</span>` : `<span class="btn ${i === 0 ? 'btn--gold' : ''}" ${simAttrs(a)}>${a.ico ? ico(a.ico) : ''}${a.label}${a.founder ? '<span class="qa__grant">FOUNDER</span>' : ''}</span>`))
    .join('');
}
/** The actions column on a record: what can be done here, and what cannot yet (said plainly, never a dead button). */
function actionsPanel(list, title = 'ACTIONS') {
  const shown = list.filter((a) => !a.founder || FOUNDER);
  return `<div class="panel acts"><div class="acts__h"><b>${title}</b><span class="tag-vis tag-vis--sim">SIMULATED IN REVIEW</span></div>${shown
    .map((a, i) =>
      a.off
        ? `<div class="acts__i acts__i--off" aria-disabled="true"><span>${a.label}</span><small>${a.off}</small></div>`
        : `<div class="acts__i ${i === 0 ? 'acts__i--pri' : ''}" ${simAttrs(a)}>${a.ico ? ico(a.ico) : ''}<span>${a.label}${a.founder ? '<span class="qa__grant">FOUNDER</span>' : ''}</span>${a.effect ? `<small>${a.effect}</small>` : ''}</div>`,
    )
    .join('')}${!FOUNDER && list.some((a) => a.founder) ? `<div class="acts__note">${ico('lock')}SOME ACTIONS HERE ARE FOUNDER-ONLY AND ARE NOT OFFERED TO YOUR ROLE.</div>` : ''}</div>`;
}

function docPreview(d) {
  const missing = /REQUESTED|NOT RECEIVED/.test(d.status[0]);
  return `<div class="doc ${missing ? 'doc--missing' : ''}">
    <div class="doc__sheet">${missing ? `<span>NOT RECEIVED</span>` : `<i></i><i></i><i class="s"></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i>`}</div>
    <div class="doc__meta"><b>${d.title}</b><small>${d.type} · ADDED ${d.added}</small><span class="tag-vis tag-vis--${d.vis === 'client' ? 'client' : 'internal'}">${d.vis === 'client' ? 'CLIENT-VISIBLE' : 'STAFF ONLY'}</span></div>

}

function permissionPage(what, grant, back = 'home') {
  return `<div class="panel lock" style="margin-top:16px">
    <span class="lock__ico">${ico('lock')}</span>
    <span class="lock__t">${what} IS GRANTED BY ROLE.</span>

    <span class="lock__go"><span class="btn" data-go="${back}">${ico('home')}GO BACK</span></span>

}

/*
 * AIO OFFICE workspace motion. The review redraws by morphing the device DOM instead of replacing it, so only what
 * changed changes: selections, tabs and panels transition in CSS (ws.css · MOTION), scroll and focus survive, and
 * content keyed with data-swap enters with a short settle. Drawers enter and leave on their own, hold focus, and give
 * it back. Reduced motion is honoured everywhere (ws.css switches the durations off; drawers close without waiting).
 */
const MOTION = {
  reduced: () => document.documentElement.dataset.motion === 'reduce' || !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches,
  sheetOut: 200, // ms — matches --m-out in ws.css
  confirm: 420, // ms — the simulated action's brief working state
};

/* ── morph: patch the live DOM to match new markup ── */
/** A child's identity across redraws: id, data-key, data-swap (a new value means new content), or its action + value. */
function mkey(n) {
  if (n.nodeType !== 1) return null;
  if (n.id) return `#${n.id}`;
  const sw = n.getAttribute('data-swap');
  if (sw != null) return `swap:${n.tagName}:${sw}`;
  const k = n.getAttribute('data-key');
  if (k != null) return `key:${k}`;
  const a = n.getAttribute('data-a');
  if (a) return `a:${n.tagName}:${a}|${n.getAttribute('data-v') ?? ''}`;
  return null;
}
function morphAttrs(a, b) {
  const keep = (a.getAttribute('data-keep-attrs') || '').split(' ');
  for (const { name, value } of [...b.attributes]) if (!keep.includes(name) && a.getAttribute(name) !== value) a.setAttribute(name, value);
  for (const { name } of [...a.attributes]) if (!keep.includes(name) && name !== 'data-keep-attrs' && !b.hasAttribute(name)) a.removeAttribute(name);
  if (a.tagName === 'INPUT' && document.activeElement !== a) a.value = b.getAttribute('value') ?? '';
}
function morphNode(a, b) {
  if (a.nodeType !== 1) {
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  morphAttrs(a, b);
  morphChildren(a, b);
}
function morphChildren(from, to) {
  const olds = [...from.childNodes];
  const keyed = new Map();
  for (const c of olds) {
    const k = mkey(c);
    if (k && !keyed.has(k)) keyed.set(k, c);
  }
  const used = new Set();
  let cursor = 0;
  const next = [];
  for (const nc of [...to.childNodes]) {
    const k = mkey(nc);
    let m = null;
    if (k) {
      const c = keyed.get(k);
      if (c && !used.has(c) && c.tagName === nc.tagName) m = c;
    } else {
      while (cursor < olds.length) {
        const c = olds[cursor++];
        if (used.has(c) || mkey(c)) continue;
        if (c.nodeType === nc.nodeType && (c.nodeType !== 1 || c.tagName === nc.tagName)) {
          m = c;
          break;
        }
      }
    }
    if (m) {
      used.add(m);
      morphNode(m, nc);
      next.push(m);
    } else next.push(nc);
  }
  for (const c of olds) if (!used.has(c)) c.remove();
  next.forEach((n, i) => {
    if (from.childNodes[i] !== n) from.insertBefore(n, from.childNodes[i] || null);
  });
}
/** Parse markup; every clickable that is not a button becomes keyboard-reachable (tab stop + role) before it lands. */
function prepare(html) {
  const t = document.createElement('template');
  t.innerHTML = html;
  t.content.querySelectorAll('[data-a]:not(button):not(input):not(.wscrim), [data-k], [data-go]:not(button)').forEach((e) => {
    if (!e.hasAttribute('tabindex')) e.setAttribute('tabindex', '0');
    if (!e.hasAttribute('role')) e.setAttribute('role', 'button');
  });
  return t.content;
}
function morphInto(el, html) {
  morphChildren(el, prepare(html));
}
function replaceInto(el, html) {
  el.replaceChildren(prepare(html));
}

/* ── segmented controls: one obsidian thumb slides to the active choice ── */
function placeThumbs(root, animate = true) {
  root.querySelectorAll('[data-thumb]').forEach((g) => {
    const th = g.querySelector(':scope > .thumb');
    const on = g.querySelector(':scope > .is-on');
    if (!th) return;
    if (!on) {
      th.style.opacity = '0';
      return;
    }
    const first = th.dataset.placed !== '1';
    if (first || !animate || MOTION.reduced()) th.style.transition = 'none';
    th.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
    th.style.width = `${on.offsetWidth}px`;
    th.style.height = `${on.offsetHeight}px`;
    th.style.opacity = '1';
    if (th.style.transition === 'none') {
      void th.offsetWidth;
      th.style.transition = '';
    }
    th.dataset.placed = '1';
    // a scrolled tab row keeps the active choice in view
    if (g.scrollWidth > g.clientWidth + 1) {
      const l = on.offsetLeft - 24;
      const r = on.offsetLeft + on.offsetWidth + 24;
      if (l < g.scrollLeft) g.scrollTo({ left: Math.max(0, l), behavior: animate && !MOTION.reduced() ? 'smooth' : 'auto' });
      else if (r > g.scrollLeft + g.clientWidth) g.scrollTo({ left: r - g.clientWidth, behavior: animate && !MOTION.reduced() ? 'smooth' : 'auto' });
    }
    g.classList.toggle('is-scrolled-end', g.scrollLeft + g.clientWidth >= g.scrollWidth - 2);
  });
}

/* ── drawers: enter, leave, hold focus, give it back ── */
const FOCUSABLE = 'button:not([disabled]), a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
/** After a redraw: the workspace behind an open drawer is inert; a newly opened drawer takes focus; a closed one gives
 *  focus back to what opened it (wasShown also counts a drawer that was still leaving). */
function settleSheet(root, wasOpen, opener, wasShown = wasOpen) {
  const sheet = root.querySelector('.wsheet:not(.is-out)');
  const back = [...root.querySelectorAll('.ao > :not(.ws-main), .ws-main > .ws')];
  back.forEach((el) => el.toggleAttribute('inert', !!sheet));
  if (sheet && !wasOpen) sheet.focus({ preventScroll: true });
  if (!sheet && wasShown && opener) {
    const el = [...root.querySelectorAll('[data-a]')].find((x) => `${x.dataset.a}|${x.dataset.v ?? ''}` === opener && x.getClientRects().length);
    el?.focus({ preventScroll: true });
  }
}
/** Keep Tab inside an open drawer. */
function trapTab(e, root) {
  const sheet = root.querySelector('.wsheet:not(.is-out)');
  if (!sheet || e.key !== 'Tab') return;
  const f = [...sheet.querySelectorAll(FOCUSABLE)].filter((x) => x.getClientRects().length && !x.closest('svg'));
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && (i <= 0)) {
    e.preventDefault();
    f[f.length - 1].focus();
  } else if (!e.shiftKey && (i === f.length - 1 || i < 0)) {
    e.preventDefault();
    f[0].focus();
  }
}

    out.ifta = { tone: s[1] === 'ok' ? 'ok' : s[1], word: `${q.q.split(' ')[0]} · ${s[0]}`, tagL: `IFTA · ${q.q.split(' ')[0]}`, tagW: s[0], title: `IFTA ${q.q}`, facts: [['QUARTER', q.q], ['CLIENT MILES', q.miles, 'WHOLE FLEET, NOT THIS TRUCK'], ['DUE', q.due]], rec: `quarter:${q.id}`, next: s[0] === 'AWAITING CLIENT' ? ['RECEIPTS MISSING FOR THIS TRUCK', simBtn(`fl:ifta:${q.id}`, { label: 'REQUEST RECEIPTS', effect: 'ASKS THE CLIENT FOR THIS TRUCK’S FUEL RECEIPTS.', apply: () => {}, rec: `quarter:${q.id}`, primary: true })] : [q.next, '', 'calm'], hist: [] };
  } else out.ifta = { tone: 'mute', word: 'NOT IN IFTA', title: 'NOT IN AN IFTA QUARTER', facts: [['IFTA', 'NOT FILED BY AIO FOR THIS CLIENT']], rec: `vehicle:${v.id}`, next: ['NO AIO ACTION', '', 'calm'], hist: [] };
  // dispatch
  const blockReq = vals(REQUESTS).find((q) => q.vehicles.includes(v.id) && q.section === 'OPERATING AUTHORITIES' && ov(`request:${q.id}`, q.status)[1] === 'bad');
  const load = vals(LOADS).find((l) => l.vehicle === v.id && ov(`load:${l.id}`, l.status)[1] !== 'ok' && l.status[0] !== 'COMPLETE');
  if (blockReq) out.dispatch = { tone: 'bad', word: 'CANNOT DISPATCH', title: 'AUTHORITY INACTIVE', facts: [['WHY', blockReq.title], ['WAITING ON', blockReq.blocker]], rec: `request:${blockReq.id}`, next: ['THE MC AUTHORITY MUST BE REINSTATED', `<button type="button" class="wbtn wbtn--gold" data-a="go" data-v="client:${v.client}:permitting">${ico('company')}SEE IN CLIENT 360</button>`], hist: [['OCT 6', 'EIN LETTER REQUESTED FROM CLIENT']] };
  else if (load) {
    const s = ov(`load:${load.id}`, load.status);
    out.dispatch = { tone: s[1] === 'mute' ? 'gold' : s[1], word: `${load.ref} · ${s[0]}`, tagL: `DISPATCH · ${load.ref.replace('LOAD ', '')}`, tagW: s[0], title: load.lane, facts: [['LOAD', load.ref], ['LANE', load.lane], ['PICKUP · DELIVERY', `${load.pickup} · ${load.delivery}`], ['DISPATCHER', staffName(load.owner)]], rec: `load:${load.id}`, next: s[0] === 'ISSUE' ? ['MOVE THE LOAD TO A WORKING TRUCK', simBtn(`fl:ld:${load.id}`, { label: 'REASSIGN TO UNIT 07', effect: 'MOVES LOAD 5517 TO UNIT 07 AFTER ITS CURRENT DELIVERY.', apply: () => (WSX.over[`load:${load.id}`] = ['REASSIGNED', 'gold']), rec: `load:${load.id}`, primary: true })] : [`DELIVERS ${load.delivery}`, '', 'calm'], hist: [[load.pickup, 'LOAD BOOKED']] };
  } else out.dispatch = { tone: vGroup(v) === 'ready' ? 'ok' : 'mute', word: vGroup(v) === 'ready' ? 'READY FOR A LOAD' : 'NOT ON A LOAD', title: 'NOT ON A LOAD', facts: [['DISPATCH', c.lanes.includes('dispatch') ? 'NO LOAD BOOKED' : 'THIS CLIENT DOES NOT USE AIO DISPATCH']], rec: `vehicle:${v.id}`, next: ['NO LOAD BOOKED', '', 'calm'], hist: [] };
  // documents
  const keys = [v.policy && `policy:${v.policy}`, v.request && `request:${v.request}`, v.ticket && `ticket:${v.ticket}`, v.driver && `driver:${v.driver}`, v.quarter && `quarter:${v.quarter}`, load && `load:${load.id}`].filter(Boolean);
  const docs = vals(DOCS).filter((d) => keys.includes(d.owner));
  const miss = docs.filter((d) => /REQUESTED/.test(d.status[0]));
  out.documents = { tone: miss.length ? 'warn' : docs.length ? 'ok' : 'mute', word: docs.length ? `${docs.length} ON FILE` : 'NONE', title: `${docs.length} DOCUMENTS`, docs, facts: [], rec: `vehicle:${v.id}`, next: ['ASK THE CLIENT FOR A DOCUMENT', simBtn(`fl:doc:${v.id}`, { label: 'REQUEST DOCUMENT', effect: 'ASKS THE CLIENT FOR A CAB CARD, INSPECTION REPORT OR TITLE.', apply: () => {}, rec: `vehicle:${v.id}` })], hist: [] };
  return out;
}

function blueprint(v, conns, sel, tags = true) {
  const meta = FLEET_META[v.id];

    ? CONN.map(([k]) => {
        const [ax, ay] = A[k];

/*
 * PROOF 02 — BOOKKEEPING. Period-centered: clients and their close (left) · the month's close as a ledger rule and a
 * worktable for the active phase (center) · the selected document, charge or check in focus (right). Typography and
 * structure carry it; no photography. Amounts are SAMPLE line items, never balances. Reconciliation matching and report
 * delivery are not built in the live app and are said so in one line.
 */
const BK_CLIENTS = ['c-tk', 'c-rl', 'c-dh', 'c-rj'];
const bkPeriod = (cid = WSX.books.client, p = WSX.books.period) => BOOKS[cid]?.periods[p];
const bkDocState = (cid, p, d) => ov(`bkdoc:${cid}:${p}:${d.id}`, d.status);
const bkItemState = (cid, p, q) => WSX.over[`bkq:${cid}:${p}:${q.id}`] ?? null;
const DOC_TONE = { RECEIVED: 'ok', MISSING: 'bad', REQUESTED: 'warn', 'NOT YET DUE': 'mute' };
const CAT_ICON = { FUEL: 'fuel', SUPPLIES: 'tag', REPAIRS: 'wrench', 'OWNER PERSONAL': 'profile', 'ASK THE CLIENT': 'letter' };
function bkCounts(cid = WSX.books.client, p = WSX.books.period) {
  const per = bkPeriod(cid, p);
  if (!per) return { missing: 0, questions: 0 };
  return { missing: per.docs.filter((d) => /MISSING|REQUESTED/.test(bkDocState(cid, p, d))).length, questions: per.items.filter((q) => !bkItemState(cid, p, q)).length };
}
function bkStep(cid = WSX.books.client, p = WSX.books.period) {
  const per = bkPeriod(cid, p);
  if (!per) return -1;
  return WSX.over[`bkstep:${cid}:${p}`] ?? per.step;
}
const phaseOf = (step) => BOOK_PHASES.find(([, , steps]) => steps.includes(step))?.[0] ?? 'collect';

/* ── the close as a ledger rule ── */
function bkSpine() {
  const step = bkStep();
  const c = bkCounts();
  const counts = { collect: c.missing, reconcile: c.questions, review: null, deliver: null };
  const phases = BOOK_PHASES.map(([id, label, steps]) => {
    const state = steps[steps.length - 1] < step ? 'done' : steps.includes(step) ? 'now' : 'later';
    return `<button type="button" class="bk-ph bk-ph--${state} ${id === WSX.books.phase ? 'is-on' : ''}" style="grid-column:${steps[0] + 1} / ${steps[steps.length - 1] + 2}" data-a="bk.phase" data-v="${id}"><b>${label}</b><span>${state === 'done' ? 'DONE' : state === 'now' ? 'NOW' : 'LATER'}${counts[id] ? ` · ${counts[id]} OPEN` : ''}</span></button>`;
  }).join('');
  const nodes = CYCLE_STEPS.map((s, i) => `<div class="bk-node bk-node--${i < step ? 'done' : i === step ? 'now' : 'later'}"><i>${i < step ? ico('pass') : i + 1}</i><span>${s}</span></div>`).join('');
  return `<section class="bk-spine"><div class="bk-spine__ph">${phases}</div><div class="bk-spine__rule">${nodes}</div></section>`;
}

/* ── worktable for the active phase ── */
function bkTable() {
  const { client: cid, period: p, phase, item } = WSX.books;
  const per = bkPeriod();
  if (BOOKS[cid].paused) return rgn('CLOSES PAUSED', '', '', `<div class="bk-paused">${sw(['PAST DUE', 'bad'])}<b>CLOSES ARE PAUSED FOR ${clientName(cid)}</b><span>BILLING IS FOUNDER / BILLING GRANT ONLY.</span>${simBtn(`bk:rj:remind`, { label: 'SEND PAST-DUE REMINDER', effect: 'EMAILS THE CLIENT A PAYMENT REMINDER. NO CHARGE IS MADE.', apply: () => {}, rec: `client:${cid}`, primary: true, founder: true })}</div>`, 'bk-table');
  if (!per) return rgn('NO CLOSE FOR THIS PERIOD', '', '', `<div class="bk-paused"><b>${clientName(cid)} WAS NOT A BOOKKEEPING CLIENT IN ${p}</b></div>`, 'bk-table');
  const sel = (k) => (item === k ? 'is-sel' : '');
  if (phase === 'collect') {
    const rows = per.docs.map((d) => {
      const s = bkDocState(cid, p, d);
      return `<tr class="lt-row ${sel(`doc:${d.id}`)}" data-a="bk.item" data-v="doc:${d.id}"><td><b class="pk__t">${d.name}</b></td><td class="lt-m">${d.source}</td><td>${sw([s, DOC_TONE[s] || 'mute'])}</td><td class="lt-m lt-r">${bkDocDate(cid, p, d)}</td></tr>`;
    });
    return rgn(`DOCUMENTS FOR ${p}`, `${per.docs.length - bkCounts().missing} OF ${per.docs.length} IN`, '', `<table class="lt" data-swap="t:${cid}:${p}:collect"><thead><tr><th>DOCUMENT</th><th>FROM</th><th>STATUS</th><th class="lt-r">WHEN</th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="4" class="lt-empty">NOTHING REQUESTED YET</td></tr>'}</tbody></table>`, 'bk-table', 'bk-table');
  }
  if (phase === 'reconcile') {
    const rows = per.items.map((q) => {
      const s = bkItemState(cid, p, q);
      return `<tr class="lt-row ${sel(`q:${q.id}`)}" data-a="bk.item" data-v="q:${q.id}"><td class="lt-m">${q.date}</td><td><b class="pk__t">${q.desc}</b><span class="pk__s">${q.acct}</span></td><td class="lt-r lt-amt">${q.amt}</td><td class="lt-q">${s ? `${sw([s === 'ASK THE CLIENT' ? 'ASKED' : s, s === 'ASK THE CLIENT' ? 'gold' : 'ok'])} <span class="simtag">SIM</span>` : `<span class="bk-ask">${q.ask}</span>`}</td></tr>`;
    });
    const accts = per.docs.filter((d) => /STATEMENT/.test(d.name)).map((d) => `<tr class="lt-row ${sel(`acct:${d.id}`)}" data-a="bk.item" data-v="acct:${d.id}"><td colspan="2"><b class="pk__t">${d.name.replace(' STATEMENT', '')}</b><span class="pk__s">STATEMENT ${bkDocState(cid, p, d)}</span></td><td></td><td>${sw(bkStep() > 4 ? ['RECONCILED', 'ok'] : bkStep() === 4 ? ['IN PROGRESS', 'gold'] : ['NOT STARTED', 'mute'])}</td></tr>`).join('');
    return rgn('CHARGES NEEDING A CATEGORY', per.items.length ? `${bkCounts().questions} OPEN · AMOUNTS ARE SAMPLES` : 'NONE', '', `<table class="lt" data-swap="t:${cid}:${p}:reconcile"><thead><tr><th>DATE</th><th>CHARGE</th><th class="lt-r">AMOUNT</th><th>QUESTION</th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="4" class="lt-empty">NO OPEN QUESTIONS THIS PERIOD</td></tr>'}<tr class="lt-sub"><td colspan="4">ACCOUNTS</td></tr>${accts}</tbody></table><div style="padding:10px 14px">${ntb('<b>MATCHING TRANSACTIONS TO STATEMENTS IS NOT BUILT.</b> THE STEP IS TRACKED HERE; MATCHING HAPPENS OUTSIDE AIO.')}</div>`, 'bk-table', 'bk-table');
  }
  if (phase === 'review') {
    const done = bkChecks();
    const rows = REVIEW_CHECKS.map((t, i) => `<tr class="lt-row ${sel(`chk:${i}`)}" data-a="bk.item" data-v="chk:${i}"><td style="width:36px"><span class="bk-tick bk-tick--${done[i] ? 'ok' : 'open'}">${done[i] ? ico('pass') : ''}</span></td><td><b class="pk__t">${t}</b></td><td>${sw(done[i] ? ['DONE', 'ok'] : ['OPEN', 'mute'])}</td></tr>`).join('');
    return rgn('STAFF REVIEW', `${done.filter(Boolean).length} OF ${REVIEW_CHECKS.length}`, '', `<table class="lt" data-swap="t:${cid}:${p}:review"><tbody>${rows}</tbody></table>`, 'bk-table', 'bk-table');
  }
  const delivered = bkStep() >= 7;
  const reports = [['pl', 'PROFIT & LOSS'], ['bs', 'BALANCE SHEET']].map(([k, t]) => `<tr class="lt-row ${sel(`rep:${k}`)}" data-a="bk.item" data-v="rep:${k}"><td><b class="pk__t">${t} · ${p}</b><span class="pk__s">${BOOKS[cid].sub ? SUBSCRIPTIONS[BOOKS[cid].sub].pkg : ''}</span></td><td>${sw(delivered ? ['DELIVERED', 'ok'] : ['NOT PREPARED', 'mute'])}</td><td class="lt-m lt-r">${delivered ? per.closed ?? '' : ''}</td></tr>`).join('');
  return rgn('REPORT PACKAGE', '', '', `<table class="lt" data-swap="t:${cid}:${p}:deliver"><tbody>${reports}</tbody></table><div style="padding:10px 14px">${ntb('<b>THE DELIVERY WORKSPACE IS NOT BUILT.</b> DELIVERED IS RECORDED AS A CLOSE STATUS.')}</div>`, 'bk-table', 'bk-table');
}
const bkDocDate = (cid, p, d) => (bkDocState(cid, p, d) === 'RECEIVED' && d.status !== 'RECEIVED' ? 'JUST NOW' : d.date);
function bkChecks() {
  const c = bkCounts();
  const step = bkStep();
  const signed = !!WSX.over[`bksign:${WSX.books.client}:${WSX.books.period}`] || step > 5;
  return [c.missing === 0, c.questions === 0, c.questions === 0 && step >= 3, step > 5, signed];
}

/* ── focus panel ── */
function bkFocus() {
  const { client: cid, period: p, item } = WSX.books;
  const per = bkPeriod();
  const crumb = (t) => `<div class="cx__crumb"><span>${clientName(cid)}</span>${ico('fwd')}<span>${p}</span>${t ? `${ico('fwd')}<span>${t}</span>` : ''}</div>`;
  if (!per || !item) {
    const c = bkCounts();
    const step = bkStep();
    return `<section class="rg cx bk-cx"><header class="cx__h"><div class="cx__hd" data-swap="hd:${cid}:${p}:none">${crumb()}<h2 class="cx__t">${per ? `${p} CLOSE` : clientName(cid)}</h2>${per ? sw([CYCLE_STEPS[step] ?? '—', step >= 8 ? 'ok' : 'gold']) : ''}</div></header><div class="cx__b" data-swap="b:${cid}:${p}:none">${per ? `<div class="bk-meter"><b>${Math.min(step + 1, 9)}<small>/ 9</small></b><span><small>STEP · ${CYCLE_STEPS[step] ?? '—'}</small><span class="bk-meter__bar bk-meter__bar--9">${CYCLE_STEPS.map((_, j) => `<i class="${j < step ? 'd' : ''} ${j === step ? 'is-sel' : ''}"></i>`).join('')}</span></span></div>` : ''}${per ? `${nextBlock(c.missing ? `${c.missing} DOCUMENT${c.missing > 1 ? 'S' : ''} STILL MISSING` : c.questions ? `${c.questions} CHARGES NEED A CATEGORY` : step >= 8 ? 'THIS PERIOD IS CLOSED' : 'READY FOR STAFF REVIEW', '', c.missing || c.questions ? '' : 'calm')}${facts([['CLIENT', clientName(cid)], ['PACKAGE', SUBSCRIPTIONS[BOOKS[cid].sub]?.pkg ?? '—'], ['DUE', per.due], ['OWNER', staffName(SUBSCRIPTIONS[BOOKS[cid].sub]?.owner)]])}` : ''}</div></section>`;
  }
  const [kind, id] = item.split(':');
  let title = '';
  let body = '';
  if (kind === 'doc') {
    const d = per.docs.find((x) => x.id === id);
    const s = bkDocState(cid, p, d);
    title = d.name;
    const key = `bkdoc:${cid}:${p}:${d.id}`;
    const open = /MISSING|REQUESTED/.test(s);
    const reminded = (WSX.hist[key] || []).length > 0;
    const track = [['ASKED', open || s === 'RECEIVED', d.date.replace('ASKED ', '')], ['REMINDED', reminded, reminded ? 'JUST NOW' : ''], ['RECEIVED', s === 'RECEIVED', s === 'RECEIVED' ? bkDocDate(cid, p, d) : '']];
    body = `<div class="bk-doc"><span class="bk-docsheet bk-docsheet--${DOC_TONE[s] || 'mute'}"><i></i><i></i><i></i><i></i><em>${s}</em></span><span class="bk-doc__t"><small>FROM ${d.source}</small><b>${d.name}</b><span class="bk-track">${track.map(([l, on, w]) => `<span class="${on ? 'is-on' : ''}"><i></i><b>${l}</b><small>${w || '—'}</small></span>`).join('')}</span></span></div>
      ${open ? nextBlock(`${clientName(cid)} HAS NOT SENT IT YET`, `${simBtn(`bk:rem:${key}`, { label: 'REMIND THE CLIENT', effect: 'SENDS A REMINDER TO THE CLIENT’S OFFICE AND EMAIL.', apply: () => {}, rec: key, primary: true })}${simBtn(`bk:got:${key}`, { label: 'MARK RECEIVED', effect: 'RECORDS THE DOCUMENT AS RECEIVED FOR THIS PERIOD.', apply: () => (WSX.over[key] = 'RECEIVED'), rec: key })}`) : nextBlock('RECEIVED', '', 'done')}
      ${facts([['FOR', `${clientName(cid)} · ${p}`], ['NEEDED FOR', /RECEIPT/.test(d.name) ? 'FUEL COSTS AND IFTA' : /PAY/.test(d.name) ? 'DRIVER WAGES' : 'MATCHING THE MONTH']])}
      ${d.link ? docChip(d.link) : ''}${mhist(key, open ? [[d.date.replace('ASKED ', ''), 'REQUESTED FROM THE CLIENT']] : [[d.date, 'RECEIVED']])}`;
  }
  if (kind === 'q') {
    const q = per.items.find((x) => x.id === id);
    const key = `bkq:${cid}:${p}:${q.id}`;
    const s = WSX.over[key];
    title = q.desc;
    body = `${s ? nextBlock(s === 'ASK THE CLIENT' ? 'ASKED THE CLIENT' : `CATEGORIZED AS ${s}`, `<button type="button" class="wbtn wbtn--sm" data-a="bk.cat" data-v="${q.id}|">UNDO</button>`, 'done') : nextBlock(q.ask, `<div class="bk-cats">${q.options.map((o) => `<button type="button" class="bk-opt ${o === 'ASK THE CLIENT' ? 'bk-opt--ask' : ''}" data-a="bk.cat" data-v="${q.id}|${o}">${ico(CAT_ICON[o] || 'tag')}<b>${o}</b></button>`).join('')}</div>`)}
      <div class="bk-amt"><small>AMOUNT · SAMPLE</small><b>${q.amt}</b><span>${q.date} · ${q.acct}</span></div>
      ${facts([['ACCOUNT', q.acct], ['PERIOD', p], ['STATUS', s ? sw([s === 'ASK THE CLIENT' ? 'ASKED' : 'CATEGORIZED', s === 'ASK THE CLIENT' ? 'gold' : 'ok']) : sw(['NEEDS A CATEGORY', 'warn'])]])}
      ${s ? `<span class="simtag" style="justify-self:start">SIMULATED · NOT SAVED</span>` : ''}`;
  }
  if (kind === 'acct') {
    const d = per.docs.find((x) => x.id === id);
    title = d.name.replace(' STATEMENT', '');
    body = `${ntb('<b>MATCHING IS NOT BUILT.</b> STATEMENT RECEIVED; RECONCILIATION IS TRACKED AS A STEP.')}${facts([['STATEMENT', bkDocState(cid, p, d), d.date], ['STEP', CYCLE_STEPS[bkStep()]]])}`;
  }
  if (kind === 'chk') {
    const i = Number(id);
    const done = bkChecks();
    title = REVIEW_CHECKS[i];
    const all = done.slice(0, 4).every(Boolean);
    const signKey = `bksign:${cid}:${p}`;
    body = i === 4 && !done[4]
      ? nextBlock(all ? 'SIGN OFF THE STAFF REVIEW' : 'FINISH THE CHECKS ABOVE FIRST', all ? simBtn(`bk:sign:${signKey}`, { label: 'SIGN OFF REVIEW', effect: 'RECORDS YOUR STAFF REVIEW SIGN-OFF AND MOVES THE CLOSE TO REPORTS PREPARED.', apply: () => { WSX.over[signKey] = true; WSX.over[`bkstep:${cid}:${p}`] = 6; }, rec: signKey, primary: true }) : '', all ? '' : 'calm')
      : nextBlock(done[i] ? 'DONE' : i < 3 ? 'RESOLVE IT IN THE EARLIER PHASE' : 'CHECK BEFORE SIGN-OFF', i === 0 && !done[0] ? `<button type="button" class="wbtn" data-a="bk.phase" data-v="collect">GO TO COLLECT</button>` : i < 3 && !done[i] ? `<button type="button" class="wbtn" data-a="bk.phase" data-v="reconcile">GO TO RECONCILE</button>` : '', done[i] ? 'done' : 'calm');
    const n = done.filter(Boolean).length;
    body = `<div class="bk-meter"><b>${n}<small>/ ${REVIEW_CHECKS.length}</small></b><span><small>STAFF REVIEW</small><span class="bk-meter__bar">${done.map((x, j) => `<i class="${x ? 'd' : ''} ${j === i ? 'is-sel' : ''}"></i>`).join('')}</span></span></div>${body}`;
    body += facts([['STATE', sw(done[i] ? ['DONE', 'ok'] : ['OPEN', 'mute'])], ['REVIEWER', staffName(SUBSCRIPTIONS[BOOKS[cid].sub]?.owner)]]);
  }
  if (kind === 'rep') {
    title = id === 'pl' ? 'PROFIT & LOSS' : 'BALANCE SHEET';
    const delivered = bkStep() >= 7;
    body = `<div class="bk-cover"><small>${clientName(cid)}</small><b>${title}</b><span>${p}</span>${sw(delivered ? ['DELIVERED', 'ok'] : ['NOT PREPARED', 'mute'])}</div>${ntb('<b>THE DELIVERY WORKSPACE IS NOT BUILT.</b> REPORTS ARE PREPARED IN THE BOOKKEEPING SYSTEM.')}`;
  }
  // the rest of this step stays in reach below the focus, so the panel keeps working instead of ending in blank paper
  const go = VP === 'mobile' ? 'bk.open' : 'bk.item';
  const sib = (rows, label) => (rows.length > 1 ? `<div class="bk-sib"><div class="sec-l"><span>${label}</span><span>${rows.length}</span></div>${rows.map(([k, t, st, i]) => `<button type="button" class="pk bk-sib__r ${k === item ? 'is-sel' : ''}" data-a="${go}" data-v="${k}" title="${t}" aria-current="${k === item}">${ico(i)}<b class="pk__t">${t}</b>${sw(st)}</button>`).join('')}</div>` : '');
  if (kind === 'doc') body += sib(per.docs.map((d) => { const st = bkDocState(cid, p, d); return [`doc:${d.id}`, d.name, [st, DOC_TONE[st] || 'mute'], 'folder']; }), `DOCUMENTS FOR ${p}`);
  if (kind === 'q' || kind === 'acct') body += sib(per.items.map((q) => { const st = bkItemState(cid, p, q); return [`q:${q.id}`, q.desc, st ? [st === 'ASK THE CLIENT' ? 'ASKED' : st, st === 'ASK THE CLIENT' ? 'gold' : 'ok'] : ['OPEN', 'warn'], 'tag']; }), 'CHARGES THIS MONTH');
  if (kind === 'chk') body += sib(REVIEW_CHECKS.map((t, j) => [`chk:${j}`, t, bkChecks()[j] ? ['DONE', 'ok'] : ['OPEN', 'mute'], bkChecks()[j] ? 'pass' : 'pending']), 'STAFF REVIEW');
  if (kind === 'rep') body += sib([['rep:pl', 'PROFIT & LOSS'], ['rep:bs', 'BALANCE SHEET']].map(([k, t]) => [k, t, bkStep() >= 7 ? ['DELIVERED', 'ok'] : ['NOT PREPARED', 'mute'], 'summary']), `REPORTS FOR ${p}`);
  const sk = `${cid}:${p}:${item}`;
  return `<section class="rg cx bk-cx"><header class="cx__h"><div class="cx__hd" data-swap="hd:${sk}">${crumb(kind === 'q' ? 'CHARGE' : kind === 'doc' ? 'DOCUMENT' : kind === 'chk' ? 'REVIEW' : kind === 'rep' ? 'REPORT' : 'ACCOUNT')}<h2 class="cx__t">${title}</h2></div></header><div class="cx__b" data-keep="bk-cx" data-swap="b:${sk}">${body}</div></section>`;
}

/* ── clients rail ── */
function bkRail(asStrip = false) {
  const p = WSX.books.period;
  const items = BK_CLIENTS.map((cid) => {
    const b = BOOKS[cid];
    const per = b.periods[p];
    const step = per ? bkStep(cid, p) : -1;
    const bar = per ? `<span class="bk-mini">${CYCLE_STEPS.map((_, i) => `<i class="${i < step ? 'd' : i === step ? 'n' : ''}"></i>`).join('')}</span>` : '';
    const state = b.paused ? sw(['PAUSED · PAST DUE', 'bad']) : per ? sw([step >= 8 ? 'CLOSED' : CYCLE_STEPS[step], step >= 8 ? 'ok' : 'gold']) : sw(['NO CLOSE', 'mute']);
    if (asStrip) return `<button type="button" class="bk-chip ${cid === WSX.books.client ? 'is-sel' : ''}" data-a="bk.client" data-v="${cid}">${badge(ACCOUNTS[cid])}<span>${ACCOUNTS[cid].name}</span>${bar}</button>`;
    return `<div class="pk bk-cl ${cid === WSX.books.client ? 'is-sel' : ''}" data-a="bk.client" data-v="${cid}">${badge(ACCOUNTS[cid])}<span style="min-width:0"><b class="pk__t">${ACCOUNTS[cid].name}</b><span class="pk__s">${SUBSCRIPTIONS[b.sub].pkg}${per ? ` · DUE ${per.due}` : ''}</span>${bar}${state}</span></div>`;
  }).join('');
  const cad = seg([['monthly', 'MONTHLY'], ['annual', 'ANNUAL']], WSX.books.cadence, 'bk.cadence', 'wseg--cad');
  const none = `<div class="bk-none"><b>NO ANNUAL CLIENTS IN THIS SAMPLE</b><span>ANNUAL CLOSES WOULD LIST HERE BY TAX YEAR.</span></div>`;
  const list = WSX.books.cadence === 'annual' ? none : items;
  if (asStrip) return `<div class="bk-stripwrap">${cad}<div class="bk-strip">${WSX.books.cadence === 'annual' ? none : items}</div></div>`;
  return rgn(WSX.books.cadence === 'annual' ? 'ANNUAL CLIENTS' : `MONTHLY · ${p}`, WSX.books.cadence === 'annual' ? '0' : '4', '', `<div class="bk-rail__tools">${cad}</div>${list}`, 'bk-rail', 'bk-rail');
}
function bkBar() {
  const { client: cid, period: p } = WSX.books;
  const per = bkPeriod();
  const c = bkCounts();
  const due = per ? `${per.due}` : '—';
  const pi = BOOK_PERIODS.indexOf(p);
  const period = `<div class="bk-period"><button type="button" class="wbtn wbtn--icon wbtn--sm" data-a="bk.period" data-v="${BOOK_PERIODS[Math.max(0, pi - 1)]}" ${pi === 0 ? 'disabled aria-disabled="true"' : ''} aria-label="Previous period">${ico('back')}</button><b>${p}</b><button type="button" class="wbtn wbtn--icon wbtn--sm" data-a="bk.period" data-v="${BOOK_PERIODS[Math.min(BOOK_PERIODS.length - 1, pi + 1)]}" ${pi === BOOK_PERIODS.length - 1 ? 'disabled aria-disabled="true"' : ''} aria-label="Next period">${ico('fwd')}</button></div>`;
  const r = per ? [ro(due, 'CLOSE DUE'), ro(c.missing, 'DOCUMENTS MISSING', { tone: c.missing ? 'bad' : '', a: c.missing ? 'bk.phase' : '', v: 'collect' }), ro(c.questions, 'QUESTIONS', { tone: c.questions ? 'warn' : '', a: c.questions ? 'bk.phase' : '', v: 'reconcile' }), ro(`${Math.min(bkStep() + 1, 9)}/9`, 'STEP', { tone: 'gold' })].join('') : '';
  if (VP === 'mobile') return `${wsBar('09 · WORK', 'BOOKKEEPING', '', period)}${per ? `<div class="ros ros--m">${r}</div>` : ''}`;
  return wsBar('09 · WORK', 'BOOKKEEPING', r, `${period}<span class="chipsel">${badge(ACCOUNTS[cid])}${ACCOUNTS[cid].name}</span>`);
}
/** Ultra-wide only: the month at a glance — the close as a timeline, what is in, what is answered. */
function bkMonth() {
  const { client: cid, period: p } = WSX.books;
  const per = bkPeriod();
  if (!per) return '';
  const step = bkStep();
  const c = bkCounts();
  const docsIn = per.docs.length - c.missing;
  const answered = per.items.length - c.questions;
  const checks = bkChecks().filter(Boolean).length;

  return rgn('THE MONTH', p, '', `<div class="bk-month" data-swap="m:${cid}:${p}">${tally(docsIn, per.docs.length, 'DOCUMENTS IN', c.missing ? 'bad' : 'ok')}${tally(answered, per.items.length, 'CHARGES ANSWERED', c.questions ? 'warn' : 'ok')}${tally(checks, REVIEW_CHECKS.length, 'REVIEW CHECKS', '')}<div class="sec-l">THE CLOSE · DUE ${per.due}</div><ol class="bk-tl">${tl}</ol></div>`, 'bk-monthrg', 'bk-month');
}
function bkAnnualTable() {
  return rgn('ANNUAL CLOSES', '0', '', `<div class="bk-paused"><b>NO ANNUAL BOOKKEEPING CLIENTS IN THIS SAMPLE</b><span>ANNUAL CLOSES WOULD BE WORKED HERE BY TAX YEAR. NOTHING IS INVENTED.</span>${ntb('<b>SAMPLE DATA HAS MONTHLY CLIENTS ONLY.</b> SWITCH BACK TO MONTHLY.')}</div>`, 'bk-table');
}
function booksView() {
  const annual = WSX.books.cadence === 'annual';

  const table = annual ? bkAnnualTable() : bkTable();
  const focus = annual ? `<section class="rg cx bk-cx"><header class="cx__h"><h2 class="cx__t">ANNUAL</h2>${sw(['NO SAMPLE CLIENTS', 'mute'])}</header><div class="cx__b">${nextBlock('NOTHING TO WORK ON', '', 'calm')}</div></section>` : bkFocus();
  if (VP === 'mobile') {
