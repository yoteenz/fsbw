<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>AIO Public Website</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"><style>/* AIO PUBLIC WEBSITE — design review build. Dark, cinematic, brand-led: obsidian · charcoal · signature gold · champagne ·
 * platinum (founder brand DNA board §02). Inter Tight display + Inter text (D-TYPOGRAPHY; Monument Extended unlicensed).
 * Everything renders uppercase. The site is one container (#pub, container "pub") so the same CSS composes the phone
 * (< 600), tablet (600–1099), desktop (1100–1899) and ultra-wide (≥ 1900) whether it fills a window or a review frame. */
@font-face { font-family: 'AIO Inter Tight'; src: url('fonts/inter-tight-latin-wght.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'AIO Inter'; src: url('fonts/inter-latin-wght.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

.pub {
  --obsidian: #050505; --charcoal: #1a1a1a; --ink: #0d0d0e; --ink-2: #141415; --gold: #d4a853; --gold-hi: #f3d189;
  --gold-lo: #a97c2c; --champagne: #ebd9b7; --platinum: #c0c6cc; --stone: #f6f6f4; --text: #f4efe4; --muted: #a8a195;
  --dim: #78726a; --line: rgba(235, 217, 183, 0.14); --line-2: rgba(235, 217, 183, 0.26); --ok: #7fc795; --warn: #e2b04a;
  --stop: #e07a6a; --display: 'AIO Inter Tight', 'Inter Tight', 'AIO Inter', 'Inter', Arial, sans-serif; --sans: 'AIO Inter', 'Inter', Arial, sans-serif;
  --ease: cubic-bezier(0.22, 0.9, 0.28, 1); --t-fast: 160ms; --t-mid: 320ms; --t-slow: 900ms; --t-hero: 1600ms;
  --gut: 20px; --maxw: 1320px; --nav: 60px; --h1: 33px; --h2: 26px; --h3: 17px; --lead: 13px; --body: 12.5px;
  --small: 10.5px; --eyebrow: 10.5px; --btn: 12px; --sec: 64px; --r: 8px; --fh: 100vh;
  container: pub / inline-size;
  position: relative; min-height: 100%; background: var(--obsidian); color: var(--text); font: 400 var(--body)/1.6 var(--sans);
  letter-spacing: 0.04em; text-transform: uppercase; -webkit-font-smoothing: antialiased; overflow-x: clip;
  overflow-anchor: none;
}
:where(.pub) *, :where(.pub) *::before, :where(.pub) *::after { box-sizing: border-box; }
:where(.pub) a { color: inherit; text-decoration: none; }
:where(.pub) :is(button, input, select, textarea) { font: inherit; color: inherit; letter-spacing: inherit; text-transform: uppercase; }
:where(.pub) button { background: none; border: 0; padding: 0; cursor: pointer; }
:where(.pub) img { display: block; max-width: 100%; }
.pub :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; border-radius: 4px; }
:where(.pub) .ic { width: 1.25em; height: 1.25em; flex: none; }
.pub .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@container pub (min-width: 600px) { .pub-wrap { --gut: 40px; --nav: 68px; --h1: 58px; --h2: 34px; --h3: 19px; --lead: 15px; --body: 13.5px; --small: 11px; --eyebrow: 11px; --btn: 12.5px; --sec: 88px; } }
@container pub (min-width: 1100px) { .pub-wrap { --hero-h1: 64px; --gut: 72px; --nav: 78px; --h1: 76px; --h2: 42px; --h3: 20px; --lead: 16px; --body: 14px; --small: 11.5px; --eyebrow: 12px; --btn: 13px; --sec: 96px; } }
@container pub (min-width: 1900px) { .pub-wrap { --hero-h1: 108px; --gut: 150px; --maxw: 2200px; --nav: 104px; --h1: 118px; --h2: 62px; --h3: 28px; --lead: 23px; --body: 19px; --small: 15px; --eyebrow: 16px; --btn: 18px; --sec: 144px; --r: 12px; } }
.pub-wrap { font-size: var(--body); }

/* ── type ── */
.eyebrow { display: flex; align-items: center; gap: 12px; margin: 0; font: 600 var(--eyebrow)/1.2 var(--sans); letter-spacing: 0.3em; color: var(--gold); }
.eyebrow::before { content: ''; width: 28px; height: 1px; background: currentColor; opacity: 0.7; }
.eyebrow--plain::before { display: none; }
.h1 { margin: 0; font: 800 var(--h1)/0.98 var(--display); letter-spacing: 0.005em; }
.h2 { margin: 0; font: 700 var(--h2)/1.04 var(--display); letter-spacing: 0.02em; }
.h3 { margin: 0; font: 700 var(--h3)/1.15 var(--display); letter-spacing: 0.05em; }
.lead { margin: 0; font: 400 var(--lead)/1.6 var(--sans); letter-spacing: 0.06em; color: #d9d2c4; }
.muted { color: var(--muted); }
.gold { color: var(--gold); }
.goldtext { background: linear-gradient(180deg, var(--gold-hi) 10%, var(--gold) 55%, #b98a35 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; padding: 0 22px; border-radius: 4px; font: 700 var(--btn)/1 var(--sans); letter-spacing: 0.14em; white-space: nowrap; transition: transform var(--t-fast) var(--ease), box-shadow var(--t-mid) var(--ease), background-color var(--t-mid) var(--ease), border-color var(--t-mid) var(--ease); }
.btn .ic { width: 1.35em; height: 1.35em; transition: transform var(--t-mid) var(--ease); }
.btn:hover .ic--go { transform: translateX(4px); }
.btn--gold { color: #17130b; background: linear-gradient(180deg, #f6d995 0%, var(--gold) 52%, #bd8e3b 100%); box-shadow: 0 0 0 1px rgba(255, 228, 160, 0.35) inset, 0 10px 28px rgba(212, 168, 83, 0.22); }
.btn--gold:hover { box-shadow: 0 0 0 1px rgba(255, 236, 190, 0.6) inset, 0 14px 36px rgba(212, 168, 83, 0.38); transform: translateY(-1px); }
.btn--line { color: var(--text); border: 1px solid rgba(235, 217, 183, 0.5); background: rgba(5, 5, 5, 0.35); backdrop-filter: blur(6px); }
.btn--line:hover { border-color: var(--gold); background: rgba(212, 168, 83, 0.08); }
.btn--ghost { color: var(--gold); padding: 0; min-height: 0; }
.btn--sm { min-height: 38px; padding: 0 16px; font-size: calc(var(--btn) - 1px); }
.btn[aria-disabled='true'] { color: var(--muted); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); box-shadow: none; cursor: not-allowed; transform: none; }
@container pub (min-width: 1900px) { .btn { min-height: 66px; padding: 0 32px; } .btn--sm { min-height: 52px; } }
.link { display: inline-flex; align-items: center; min-height: 24px; gap: 10px; font: 700 var(--btn)/1 var(--sans); letter-spacing: 0.16em; color: var(--gold); white-space: nowrap; }
.link .ic { transition: transform var(--t-mid) var(--ease); }
.link:hover .ic { transform: translateX(4px); }

/* ── status chips (from the activation matrices — never invented) ── */
.chip { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; font: 700 calc(var(--small) - 0.5px)/1 var(--sans); letter-spacing: 0.14em; white-space: nowrap; border: 1px solid var(--line-2); color: var(--champagne); background: rgba(5, 5, 5, 0.4); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip--go { color: var(--ok); border-color: rgba(127, 199, 149, 0.35); }
.chip--pilot { color: var(--gold-hi); border-color: rgba(212, 168, 83, 0.45); }
.chip--soon, .chip--prep { color: var(--platinum); }
.chip--hold { color: var(--warn); border-color: rgba(226, 176, 74, 0.4); }
.chip--paused, .chip--blocked { color: var(--stop); border-color: rgba(224, 122, 106, 0.4); }
.chip--partner { color: #b9c7d6; border-color: rgba(185, 199, 214, 0.35); }
@container pub (min-width: 1900px) { .chip { height: 32px; padding: 0 14px; } }

/* ── layout ── */
.wrap { width: 100%; max-width: calc(var(--maxw) + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut); }
.sec { position: relative; padding: var(--sec) 0; }
.sec__head { display: grid; gap: 14px; margin-bottom: calc(var(--sec) * 0.42); }
.sec__head--row { grid-template-columns: 1fr auto; align-items: end; gap: 18px 40px; }
@container pub (max-width: 599px) { .sec__head--row { grid-template-columns: 1fr; } }
.rule { height: 1px; background: linear-gradient(90deg, transparent, var(--line-2) 20%, var(--line-2) 80%, transparent); border: 0; margin: 0; }

/* ── reveal (once, on entering the frame; reduced motion shows everything) ── */
.rv { opacity: 0; transform: translateY(18px); transition: opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease); transition-delay: calc(var(--d, 0) * 90ms); }
.rv.in { opacity: 1; transform: none; }

/* ═════════════ NAV ═════════════ */
.nav { position: sticky; top: 0; z-index: 40; height: var(--nav); display: flex; align-items: center; gap: 18px; padding: 0 var(--gut); transition: background-color var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease); }
.nav::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5, 5, 5, 0.86), rgba(5, 5, 5, 0.55)); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(235, 217, 183, 0.1); transition: opacity var(--t-mid) var(--ease); }
.pub[data-over='1'] .nav::before { opacity: 0.0; }
.pub[data-over='1'] .nav { background: linear-gradient(180deg, rgba(5, 5, 5, 0.72), rgba(5, 5, 5, 0)); }
.nav__mark { display: flex; align-items: center; gap: 12px; flex: none; }
.nav__mark img { height: calc(var(--nav) * 0.56); width: auto; }
.nav__links { display: none; align-items: center; gap: 4px; margin-left: clamp(16px, 3cqw, 64px); }
.nav__a { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; font: 600 var(--small)/1 var(--sans); letter-spacing: 0.16em; color: #e9e2d4; white-space: nowrap; border-radius: 4px; transition: color var(--t-fast) var(--ease); }
.nav__a .ic { width: 14px; height: 14px; transition: transform var(--t-mid) var(--ease); }
.nav__a:hover, .nav__a[aria-expanded='true'], .nav__a[aria-current='page'] { color: var(--gold-hi); }
.nav__a[aria-expanded='true'] .ic { transform: rotate(180deg); }
.nav__a[aria-current='page']::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px; background: var(--gold); border-radius: 2px; }
.nav__tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.nav__icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--text); transition: background-color var(--t-fast) var(--ease); }
.nav__icon:hover { background: rgba(235, 217, 183, 0.08); }
.nav__icon .ic { width: 20px; height: 20px; }
.nav__login, .nav__start-lg { display: none; }
.nav__start-sm { min-height: 36px; padding: 0 14px; }
@container pub (min-width: 600px) { .nav__login { display: inline-flex; } .nav__start-sm { min-height: 40px; } }
@container pub (min-width: 1100px) { .nav__links { display: flex; } .nav__menu { display: none; } .nav__start-sm { display: none; } .nav__start-lg { display: inline-flex; } .nav__login, .nav__start-lg { min-height: 44px; } }
@container pub (min-width: 1900px) { .nav__a { height: 56px; padding: 0 22px; } .nav__a .ic { width: 18px; height: 18px; } .nav__icon { width: 58px; height: 58px; } .nav__icon .ic { width: 26px; height: 26px; } .nav__login, .nav__start-lg { min-height: 58px; } }

/* mega menu + dropdowns */
.pop { position: absolute; top: calc(var(--nav) - 6px); z-index: 50; border-radius: 10px; background: linear-gradient(180deg, rgba(22, 21, 20, 0.98), rgba(10, 10, 10, 0.98)); border: 1px solid var(--line-2); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.6); animation: popIn var(--t-mid) var(--ease) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(-6px); } }
.pop--mega { left: var(--gut); right: var(--gut); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.25fr); gap: 0; padding: 0; overflow: hidden; }
.pop__col { padding: 26px 24px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 4px; }
.pop__col h4 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font: 700 var(--small)/1.2 var(--sans); letter-spacing: 0.2em; color: var(--gold); }
.pop__col h4 .ic { width: 20px; height: 20px; }
.pop__item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; margin: 0 -10px; border-radius: 6px; font: 600 var(--small)/1.3 var(--sans); letter-spacing: 0.08em; color: #ddd6c8; transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.pop__item:hover { background: rgba(212, 168, 83, 0.09); color: var(--text); }
.pop__item small { font: 600 9.5px/1 var(--sans); letter-spacing: 0.14em; color: var(--muted); white-space: nowrap; }
.pop__feature { position: relative; display: grid; align-content: end; gap: 10px; padding: 26px; min-height: 100%; background: center / cover no-repeat; }
.pop__feature::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 5, 5, 0.1), rgba(5, 5, 5, 0.92) 70%); }
.pop__feature > * { position: relative; }
.pop--list { min-width: 300px; padding: 10px; display: grid; gap: 2px; }
.pop--list .pop__item { margin: 0; padding: 12px 14px; }
.pop--list .pop__item span { display: grid; gap: 4px; }
.pop--list .pop__item span em { font-style: normal; font-size: calc(var(--small) - 1px); color: var(--muted); letter-spacing: 0.1em; }
@container pub (min-width: 1900px) { .pop__col { padding: 40px 36px; } .pop__item small { font-size: 13px; } .pop--list { min-width: 440px; } }

/* search */
.search { position: absolute; left: 0; right: 0; top: var(--nav); z-index: 45; padding: 18px var(--gut) 26px; background: rgba(8, 8, 8, 0.97); border-bottom: 1px solid var(--line-2); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55); animation: popIn var(--t-mid) var(--ease) both; }
.search__box { display: flex; align-items: center; gap: 14px; max-width: 980px; margin: 0 auto; height: 56px; padding: 0 18px; border-radius: 6px; border: 1px solid var(--line-2); background: #0f0f10; }
.search__box .ic { width: 22px; height: 22px; color: var(--gold); }
.search__box input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font: 600 var(--lead)/1 var(--sans); letter-spacing: 0.12em; }
.search__box input::placeholder { color: var(--dim); }
.search__hits { max-width: 980px; margin: 12px auto 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; }
@container pub (max-width: 599px) { .search__hits { grid-template-columns: 1fr; } }
.search__hit { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border-radius: 6px; border: 1px solid transparent; transition: background-color var(--t-fast) var(--ease); }
.search__hit:hover { background: rgba(212, 168, 83, 0.08); border-color: var(--line); }
.search__hit b { font: 600 var(--small)/1.3 var(--sans); letter-spacing: 0.1em; }
.search__hit i { font-style: normal; font: 600 9.5px/1 var(--sans); letter-spacing: 0.16em; color: var(--muted); white-space: nowrap; }
.search__none { max-width: 980px; margin: 16px auto 0; color: var(--muted); font-size: var(--small); letter-spacing: 0.14em; }

/* phone / tablet drawer */
.drawer { position: absolute; top: var(--nav); left: 0; right: 0; z-index: 45; min-height: calc(var(--fh) - var(--nav)); padding: 12px var(--gut) 40px; background: linear-gradient(180deg, #0b0b0c, #050505); border-top: 1px solid var(--line); animation: popIn var(--t-mid) var(--ease) both; display: grid; align-content: start; gap: 4px; }
.drawer__grp { border-bottom: 1px solid var(--line); }
.drawer__grp > button, .drawer__grp > a { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 58px; font: 700 15px/1 var(--display); letter-spacing: 0.12em; }
.drawer__grp > button .ic { transition: transform var(--t-mid) var(--ease); }
.drawer__grp > button[aria-expanded='true'] .ic { transform: rotate(180deg); color: var(--gold); }
.drawer__sub { display: grid; gap: 2px; padding: 0 0 14px; }
.drawer__sub a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border-radius: 6px; font: 600 12px/1.3 var(--sans); letter-spacing: 0.1em; color: #dcd5c7; background: rgba(255, 255, 255, 0.025); }
.drawer__cta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

/* ═════════════ HOME · HERO (brand board panel 04) ═════════════ */
.hero { position: relative; isolation: isolate; margin-top: calc(var(--nav) * -1); min-height: max(560px, var(--fh)); display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
.hero__img { position: absolute; inset: 0; z-index: -2; background: #050505 var(--img) right 46% / auto 104% no-repeat; transform-origin: 70% 60%; animation: heroIn var(--t-hero) var(--ease) both; }
@keyframes heroIn { from { transform: scale(1.06); opacity: 0.2; } }
.hero__img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 5, 5, 0.94) 0%, rgba(5, 5, 5, 0.82) 26%, rgba(5, 5, 5, 0.32) 50%, rgba(5, 5, 5, 0) 66%), linear-gradient(0deg, rgba(5, 5, 5, 0.96) 0%, rgba(5, 5, 5, 0.5) 18%, rgba(5, 5, 5, 0) 38%), linear-gradient(180deg, rgba(5, 5, 5, 0.55) 0%, rgba(5, 5, 5, 0) 22%); }
.hero__copy { align-self: center; display: grid; gap: 16px; justify-items: start; padding: calc(var(--nav) + 44px) var(--gut) 40px; max-width: calc(1000px + 2 * var(--gut)); }
.hero__copy > * { animation: rise var(--t-slow) var(--ease) both; animation-delay: calc(240ms + var(--d, 0) * 110ms); }
@keyframes rise { from { opacity: 0; transform: translateY(22px); } }
.hero .h1 { font-size: var(--hero-h1, var(--h1)); text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
.hero .h1 span { display: block; }
.hero__tag { margin: 2px 0 0; font: 600 calc(var(--lead) + 3px)/1.2 var(--sans); letter-spacing: 0.24em; color: var(--text); }
.hero__body { max-width: 40em; margin: 4px 0 0; font: 500 var(--lead)/1.6 var(--sans); letter-spacing: 0.07em; color: #e4ddcf; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
.hero__h1--phone { display: none; }
@container pub (max-width: 599px) {
  .hero { min-height: 0; }
  .hero__img { background-position: 64% calc(var(--nav) - 10px); background-size: auto 430px; }
  .hero__img::after { background: linear-gradient(180deg, rgba(5, 5, 5, 0.7) 0px, rgba(5, 5, 5, 0) 90px, rgba(5, 5, 5, 0) 300px, rgba(5, 5, 5, 0.9) 400px, #050505 440px); }
  .hero__copy { align-self: end; padding-top: 330px; padding-bottom: 28px; gap: 12px; }
  .hero__h1--wide { display: none; }
  .hero__h1--phone { display: block; }
  .hero__tag { font-size: 13px; letter-spacing: 0.2em; }
  .hero__body { font-size: 12.5px; }
  .hero__ctas { display: grid; grid-template-columns: 1fr; width: 100%; gap: 10px; }
}
@container pub (min-width: 600px) and (max-width: 1099px) {
  .hero { min-height: max(900px, calc(var(--fh) * 0.84)); }
  .hero__img { background-position: 66% calc(var(--nav) - 20px); background-size: auto 66%; }
  .hero__img::after { background: linear-gradient(180deg, rgba(5, 5, 5, 0.7) 0%, rgba(5, 5, 5, 0) 12%, rgba(5, 5, 5, 0) 46%, rgba(5, 5, 5, 0.92) 62%, #050505 70%), linear-gradient(90deg, rgba(5, 5, 5, 0.55), rgba(5, 5, 5, 0) 40%); }
  .hero__copy { align-self: end; padding-top: 0; padding-bottom: 48px; }
}
@container pub (min-width: 1900px) { .hero__copy { max-width: calc(1680px + 2 * var(--gut)); gap: 26px; } .hero__ctas { gap: 20px; margin-top: 18px; } }

/* the band: four brand principles (panel 04 / 11) and four product facts — never client counts or success rates */
.band { position: relative; z-index: 1; border-top: 1px solid rgba(235, 217, 183, 0.16); background: linear-gradient(180deg, rgba(8, 8, 8, 0.62), rgba(5, 5, 5, 0.92)); backdrop-filter: blur(8px); }
.band__in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: stretch; }
.band__half { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.band__p { display: grid; justify-items: center; align-content: center; gap: 10px; padding: 22px 10px; text-align: center; border-right: 1px solid var(--line); font: 600 var(--small)/1.3 var(--sans); letter-spacing: 0.16em; }
.band__p .ic { width: 30px; height: 30px; color: var(--gold); stroke-width: 1.3; }
.band__f { display: flex; align-items: center; gap: 14px; padding: 22px 18px; border-right: 1px solid var(--line); }
.band__f:last-child { border-right: 0; }
.band__f .ic { width: 28px; height: 28px; color: var(--gold); stroke-width: 1.3; }
.band__f b { display: block; font: 700 calc(var(--h3) + 6px)/1 var(--display); letter-spacing: 0.02em; }
.band__f > div > span { display: block; margin-top: 5px; font: 600 calc(var(--small) - 1px)/1.25 var(--sans); letter-spacing: 0.14em; color: var(--muted); }
@container pub (max-width: 1099px) { .band__in { grid-template-columns: 1fr; } .band__half + .band__half { border-top: 1px solid var(--line); } }

.foot__base { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 28px; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); font-size: calc(var(--small) - 1px); letter-spacing: 0.12em; color: var(--dim); }
.foot__base p { margin: 0; max-width: 92ch; line-height: 1.6; }
@container pub (max-width: 1099px) { .foot__top { grid-template-columns: repeat(2, minmax(0, 1fr)); } .foot__brand { grid-column: 1 / -1; } }
@container pub (max-width: 599px) { .foot__top { grid-template-columns: 1fr 1fr; gap: 28px 18px; } .foot__brand img { width: 220px; } .close__ctas { display: grid; width: 100%; justify-content: stretch; } }
@container pub (min-width: 1900px) { .foot { padding: 90px 0 44px; } .foot__brand img { width: 400px; } .foot__top { gap: 64px; } }

/* ═════════════ PAGE HERO (service family, journeys, company) ═════════════ */
.phero { position: relative; isolation: isolate; margin-top: calc(var(--nav) * -1); padding: calc(var(--nav) + 70px) 0 120px; overflow: hidden; }
.phero__img { position: absolute; inset: 0; z-index: -2; background: #050505 var(--img) var(--pos, 70% 50%) / cover no-repeat; animation: heroIn var(--t-hero) var(--ease) both; }
.phero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(5, 5, 5, 0.95) 0%, rgba(5, 5, 5, 0.86) 38%, rgba(5, 5, 5, 0.3) 62%, rgba(5, 5, 5, 0.04) 80%), linear-gradient(0deg, #050505 0%, rgba(5, 5, 5, 0) 34%), linear-gradient(180deg, rgba(5, 5, 5, 0.6), rgba(5, 5, 5, 0) 26%); }
.phero__in { display: grid; gap: 18px; justify-items: start; max-width: 780px; }
.phero__in > * { animation: rise var(--t-slow) var(--ease) both; animation-delay: calc(200ms + var(--d, 0) * 100ms); }
.phero .h1 { font-size: calc(var(--h1) * 0.86); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 calc(var(--small) - 0.5px)/1 var(--sans); letter-spacing: 0.18em; color: var(--muted); }
.crumbs a { display: inline-flex; align-items: center; min-height: 24px; }
.crumbs a:hover { color: var(--gold-hi); }
.crumbs .ic { width: 12px; height: 12px; opacity: 0.6; }
.phero__ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; }
@container pub (max-width: 599px) { .phero { padding: 236px 0 92px; } .phero__img { bottom: auto; height: 330px; background-size: cover; background-position: var(--pos-phone, var(--pos, 70% 50%)); } .phero::before { background: linear-gradient(180deg, rgba(5, 5, 5, 0.72) 0, rgba(5, 5, 5, 0) 96px, rgba(5, 5, 5, 0) 180px, rgba(5, 5, 5, 0.94) 300px, #050505 330px); } .phero__ctas { display: grid; width: 100%; } .phero .h1 { font-size: 31px; } }
@container pub (min-width: 1900px) { .phero { padding: calc(var(--nav) + 120px) 0 190px; } .phero__in { max-width: 1400px; gap: 26px; } }

/* the facts rail that overlaps the page hero (IFTA public grammar: metrics rail under the hero) */
.facts { position: relative; z-index: 2; margin-top: -64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-radius: var(--r); background: linear-gradient(180deg, rgba(22, 21, 20, 0.96), rgba(10, 10, 10, 0.96)); border: 1px solid var(--line-2); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); }
.fact { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-right: 1px solid var(--line); min-width: 0; }
.fact:last-child { border-right: 0; }
.fact > .ic { width: 28px; height: 28px; color: var(--gold); stroke-width: 1.3; }
.fact b { display: block; font: 700 calc(var(--small) + 2px)/1.25 var(--sans); letter-spacing: 0.12em; }
.fact > div > span:not(.chip) { display: block; margin-top: 4px; font: 600 calc(var(--small) - 1.5px)/1.2 var(--sans); letter-spacing: 0.18em; color: var(--muted); }
.fact .chip { margin-top: 2px; }
@container pub (max-width: 1099px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fact:nth-child(2n) { border-right: 0; } .fact:nth-child(-n + 2) { border-bottom: 1px solid var(--line); } }
@container pub (max-width: 599px) { .fact { padding: 14px; gap: 10px; } .fact > .ic { width: 22px; height: 22px; } .fact b { font-size: 11.5px; } }
@container pub (min-width: 1900px) { .facts { margin-top: -96px; } .fact { padding: 32px 34px; gap: 20px; } .fact > .ic { width: 40px; height: 40px; } }

/* split: copy + photo card (IFTA public "A CLEAR PATH" grammar) */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 56px; align-items: center; }
.split__copy { display: grid; gap: 18px; justify-items: start; }
.photo { position: relative; isolation: isolate; display: grid; align-content: center; min-height: 340px; padding: 40px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.photo__img { position: absolute; inset: 0; z-index: -2; background: var(--img) center / cover no-repeat; }
.photo::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(5, 5, 5, 0.8), rgba(5, 5, 5, 0.1) 75%); }
.photo p { margin: 0; font: 600 calc(var(--h2) * 0.62)/1.3 var(--display); letter-spacing: 0.12em; }
.photo p::after { content: ''; display: block; width: 72px; height: 3px; margin-top: 22px; background: var(--gold); }
@container pub (max-width: 1099px) { .split { grid-template-columns: 1fr; gap: 36px; } .photo { min-height: 260px; } }
@container pub (min-width: 1900px) { .photo { min-height: 560px; padding: 64px; } .split { gap: 96px; } }

/* process steps */
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.step { position: relative; display: grid; align-content: start; gap: 12px; padding: 22px 20px 24px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, #121212, #0a0a0a); }
.step:not(:last-child)::after { content: ''; position: absolute; right: -11px; top: 38px; width: 8px; height: 8px; border-top: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); transform: rotate(45deg); }
.step__top { display: flex; align-items: center; justify-content: space-between; }
.step__n { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(180deg, #f6d995, var(--gold)); color: #17130b; font: 800 13px/1 var(--display); }
.step__top .ic { width: 26px; height: 26px; color: var(--gold); stroke-width: 1.4; }
.step b { font: 700 calc(var(--small) + 1.5px)/1.25 var(--sans); letter-spacing: 0.13em; }
.step > span { font-size: calc(var(--small) - 0.5px); line-height: 1.55; letter-spacing: 0.09em; color: var(--muted); }
@container pub (max-width: 1099px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .step::after { display: none; } }
@container pub (max-width: 599px) { .steps { grid-template-columns: 1fr; gap: 10px; } .step { grid-template-columns: auto 1fr; column-gap: 16px; padding: 16px; } .step__top { grid-row: span 2; align-self: start; } .step__top .ic { display: none; } }
@container pub (min-width: 1900px) { .steps { gap: 22px; } .step { padding: 34px 30px 36px; gap: 18px; } .step__n { width: 54px; height: 54px; font-size: 18px; } .step__top .ic { width: 38px; height: 38px; } }

/* service cards (a family's services) */
.svcs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.svc { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 22px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, #131313, #0a0a0a); transition: border-color var(--t-mid) var(--ease), transform var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease); }
.svc:hover { border-color: rgba(212, 168, 83, 0.55); transform: translateY(-2px); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
.svc__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.svc__top > .ic { width: 26px; height: 26px; color: var(--gold); stroke-width: 1.4; }
.svc b { display: block; font: 700 calc(var(--small) + 2.5px)/1.25 var(--display); letter-spacing: 0.08em; }
.svc p { margin: 8px 0 0; font-size: calc(var(--small) - 0.5px); line-height: 1.6; letter-spacing: 0.09em; color: var(--muted); }
.svc__go { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); font: 700 calc(var(--small) - 1px)/1 var(--sans); letter-spacing: 0.16em; color: var(--gold); }
.svc__go .ic { width: 16px; height: 16px; }
.svc--off .svc__go { color: var(--muted); }
@container pub (max-width: 1099px) { .svcs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container pub (max-width: 599px) { .svcs { grid-template-columns: 1fr; gap: 10px; } .svc { padding: 16px; } }
@container pub (min-width: 1900px) { .svcs { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; } .svc { padding: 32px; } }

/* disclosure */
.disc { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; padding: 22px 24px; border-radius: var(--r); border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); }
.disc .ic { width: 24px; height: 24px; color: var(--gold); }
.disc p { margin: 0; font-size: calc(var(--small) - 0.5px); line-height: 1.7; letter-spacing: 0.1em; color: var(--muted); }
.disc p + p { margin-top: 8px; }
.disc b { color: var(--champagne); font-weight: 600; }

/* paused banner (Brokerage — designed, never activated) */
.paused { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 20px 24px; border-radius: var(--r); border: 1px solid rgba(224, 122, 106, 0.4); background: linear-gradient(90deg, rgba(224, 122, 106, 0.1), rgba(224, 122, 106, 0.02)); }
.paused > .ic { width: 28px; height: 28px; color: var(--stop); }
.paused b { display: block; font: 700 calc(var(--small) + 2px)/1.3 var(--sans); letter-spacing: 0.14em; }
.paused > div > span { display: block; margin-top: 4px; font-size: var(--small); letter-spacing: 0.1em; color: var(--muted); }
@container pub (max-width: 599px) { .paused { grid-template-columns: auto 1fr; } .paused .btn { grid-column: 1 / -1; } }

/* plans (Bookkeeping) — structure only, prices are not approved */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.plan { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px; padding: 28px 26px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, #141414, #0a0a0a); }
.plan--mid { border-color: rgba(212, 168, 83, 0.6); box-shadow: 0 0 0 1px rgba(212, 168, 83, 0.25), 0 30px 60px rgba(0, 0, 0, 0.5); }
.plan__flag { position: absolute; top: -12px; left: 26px; height: 24px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; font: 700 10px/1 var(--sans); letter-spacing: 0.18em; color: #17130b; background: linear-gradient(180deg, #f6d995, var(--gold)); }
.plan__price { display: grid; gap: 4px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.plan__price b { font: 700 calc(var(--h3) + 2px)/1 var(--display); letter-spacing: 0.06em; color: var(--champagne); }
.plan__price span { font-size: calc(var(--small) - 1px); letter-spacing: 0.14em; color: var(--dim); }
.plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; align-content: start; }
.plan li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: var(--small); line-height: 1.45; letter-spacing: 0.09em; color: #d6cfc1; }
.plan li .ic { width: 16px; height: 16px; color: var(--gold); margin-top: 1px; }
@container pub (max-width: 1099px) { .plans { grid-template-columns: 1fr; } }

/* forms (design review — nothing is sent) */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 8px; }
.field label { font: 600 calc(var(--small) - 1px)/1 var(--sans); letter-spacing: 0.2em; color: var(--champagne); }
.field input, .field select, .field textarea { width: 100%; min-height: 50px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line-2); background: #0e0e0f; font: 500 var(--body)/1.2 var(--sans); letter-spacing: 0.1em; transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
.field textarea { min-height: 110px; padding: 14px 16px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 168, 83, 0.18); }
.field input::placeholder, .field textarea::placeholder { color: var(--dim); }
.form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@container pub (max-width: 599px) { .form__row { grid-template-columns: 1fr; } }
.sent { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 6px; border: 1px solid rgba(127, 199, 149, 0.4); background: rgba(127, 199, 149, 0.07); font-size: var(--small); letter-spacing: 0.12em; animation: rise var(--t-mid) var(--ease) both; }
.sent .ic { width: 22px; height: 22px; color: var(--ok); }
.note { font-size: calc(var(--small) - 1px); letter-spacing: 0.14em; color: var(--dim); }

/* choice tiles (finder, get started) */
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.choice { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; min-height: 64px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: #0d0d0e; text-align: left; transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.choice:hover { border-color: rgba(212, 168, 83, 0.5); }
.choice[aria-pressed='true'] { border-color: var(--gold); background: rgba(212, 168, 83, 0.09); box-shadow: 0 0 0 1px rgba(212, 168, 83, 0.35) inset; }
.choice > .ic { width: 22px; height: 22px; color: var(--gold); }
.choice b { display: block; font: 700 calc(var(--small) + 1px)/1.3 var(--sans); letter-spacing: 0.1em; }
.choice > div > span { display: block; margin-top: 3px; font-size: calc(var(--small) - 1.5px); letter-spacing: 0.1em; color: var(--muted); }
.choice__tick { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); color: transparent; }
.choice[aria-pressed='true'] .choice__tick { background: var(--gold); border-color: var(--gold); color: #17130b; }
.choice__tick .ic { width: 14px; height: 14px; stroke-width: 2.4; }
@container pub (max-width: 1099px) { .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container pub (max-width: 599px) { .choices { grid-template-columns: 1fr; } }

/* panels and two-column layouts used by journeys, company and account pages */
.panel { border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, #131313, #0a0a0a); padding: 28px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.cols--wide { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
@container pub (max-width: 1099px) { .cols, .cols--wide { grid-template-columns: 1fr; gap: 28px; } }
@container pub (max-width: 599px) { .panel { padding: 20px 18px; } }
@container pub (min-width: 1900px) { .panel { padding: 44px; } .cols { gap: 72px; } }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); transition: border-color var(--t-fast) var(--ease); }
a.row:hover { border-color: rgba(212, 168, 83, 0.5); }
.row > .ic { width: 22px; height: 22px; color: var(--gold); }
.row b { display: block; font: 700 calc(var(--small) + 1px)/1.3 var(--sans); letter-spacing: 0.1em; }
.row > div > span { display: block; margin-top: 3px; font-size: calc(var(--small) - 1px); letter-spacing: 0.1em; color: var(--muted); }

/* the approved IFTA public page, shown as approved (unchanged) */
.approved { display: grid; gap: 16px; padding-top: calc(var(--nav) * 0); }
.approved__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px var(--gut); background: #0b0b0b; border-bottom: 1px solid var(--line); font: 600 var(--small)/1.3 var(--sans); letter-spacing: 0.14em; color: var(--muted); }
.approved img { width: 100%; }

/* faq */
.faq { display: grid; gap: 8px; }
.faq details { border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); }
.faq summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 18px; cursor: pointer; list-style: none; font: 700 calc(var(--small) + 1px)/1.35 var(--sans); letter-spacing: 0.1em; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .ic { width: 18px; height: 18px; color: var(--gold); transition: transform var(--t-mid) var(--ease); }
.faq details[open] summary .ic { transform: rotate(180deg); }
.faq details p { margin: 0; padding: 0 18px 18px; font-size: var(--small); line-height: 1.7; letter-spacing: 0.09em; color: var(--muted); }

/* toast */
.toast { position: absolute; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 6px; background: #151515; border: 1px solid var(--line-2); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); font: 600 var(--small)/1.3 var(--sans); letter-spacing: 0.12em; white-space: nowrap; animation: rise var(--t-mid) var(--ease) both; }
.toast .ic { width: 20px; height: 20px; color: var(--gold); }

/* reduced motion: everything is shown at once, nothing slides */
@media (prefers-reduced-motion: reduce) { .pub *, .pub *::before, .pub *::after { animation: none !important; transition-duration: 1ms !important; transition-delay: 0ms !important; } .pub .rv { opacity: 1; transform: none; } }
:root[data-motion='reduce'] .pub *, :root[data-motion='reduce'] .pub *::before, :root[data-motion='reduce'] .pub *::after { animation: none !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
:root[data-motion='reduce'] .pub .rv { opacity: 1; transform: none; }

/* ═════════════ SERVICE FAMILY · EXPLORER (tablet + desktop pick on the left and read on the right; the phone keeps the cards) ═════════════ */
.sx { display: none; }
.sx-more { width: 100%; margin-top: 12px; }
@container pub (min-width: 600px) {
  .sx-phone { display: none; }
  .sx { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
  .sx__list { display: grid; gap: 6px; }
  .sx__row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 54px; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: #0d0d0e; text-align: left; transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
  .sx__row:hover { border-color: rgba(212, 168, 83, 0.45); }
  .sx__row[aria-selected='true'] { border-color: var(--gold); background: linear-gradient(90deg, rgba(212, 168, 83, 0.14), rgba(212, 168, 83, 0.03)); box-shadow: inset 3px 0 0 var(--gold); }
  .sx__row > .ic { width: 20px; height: 20px; color: var(--gold); }
  .sx__row b { font: 700 var(--small)/1.3 var(--sans); letter-spacing: 0.1em; }
  .sx__panel { position: sticky; top: calc(var(--nav) + 64px); border-radius: var(--r); border: 1px solid var(--line-2); background: linear-gradient(180deg, #131313, #0a0a0a); overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45); }
  .sx__head { position: relative; isolation: isolate; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; min-height: 190px; padding: 24px 26px; }
  .sx__head::before { content: ''; position: absolute; inset: 0; z-index: -2; background: var(--img) center / cover no-repeat; }
  .sx__head::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(5, 5, 5, 0.1), rgba(5, 5, 5, 0.9) 85%, #0f0f0f); }
  .sx__head > div { display: grid; gap: 10px; }
  .sx__head .h2 { font-size: calc(var(--h2) * 0.78); }
  .sx__body { display: grid; gap: 18px; padding: 22px 26px 26px; animation: rise var(--t-mid) var(--ease) both; }
  .sx__body > .lead { font-size: calc(var(--lead) - 1px); }
  .sx__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .sx__cols > div { display: grid; gap: 10px; align-content: start; }
  .sx__cols p { margin: 0; font-size: var(--small); line-height: 1.6; letter-spacing: 0.09em; color: #d6cfc1; }
  .sx__cols .eyebrow { font-size: calc(var(--eyebrow) - 1px); }
  .sx__cols ul, .ov__provide ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .sx__cols li, .ov__provide li { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: var(--small); line-height: 1.4; letter-spacing: 0.08em; color: #d6cfc1; }
  .sx__cols li .ic, .ov__provide li .ic { width: 16px; height: 16px; color: var(--gold); margin-top: 1px; }
  .sx__meta { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 600 calc(var(--small) - 0.5px)/1.2 var(--sans); letter-spacing: 0.14em; color: var(--champagne); }
  .sx__meta span { display: inline-flex; align-items: center; gap: 8px; }

@container pub (min-width: 1900px) { .nextstep { padding: 40px; gap: 18px; } }
/* phone: the three plans swipe sideways (bounded, snap) instead of stacking three tall cards */
@container pub (max-width: 599px) { .plans:not([style]) { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin: 0 calc(var(--gut) * -1); padding: 14px var(--gut) 6px; scrollbar-width: none; } .plans:not([style])::-webkit-scrollbar { display: none; } .plans:not([style]) > .rv { flex: 0 0 84%; scroll-snap-align: start; } }

/* AIO PUBLIC WEBSITE — the founder review around the site (device frames, page tree, the reference beside it). */
:root { --rv-bg: #0b0b0c; --rv-panel: #141415; --rv-line: rgba(235, 217, 183, 0.14); --rv-text: #efe8da; --rv-muted: #a39b8d; --rv-gold: #d4a853; --rv-chrome: 'AIO Inter', 'Inter', Arial, sans-serif; }
html, body { margin: 0; background: var(--rv-bg); color: var(--rv-text); }
:root { color-scheme: dark; } /* a deliberately single, dark look (the public brand is dark) */
body { font: 500 13px/1.5 var(--rv-chrome); letter-spacing: 0.06em; text-transform: uppercase; }
#rv { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; }
.rv-top { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 14px 24px; background: rgba(11, 11, 12, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rv-line); }
.rv-brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.rv-brand img { height: 30px; }
.rv-brand b { display: block; font: 800 15px/1.1 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); letter-spacing: 0.12em; }
.rv-brand span { display: block; font: 600 10px/1.2 var(--rv-chrome); letter-spacing: 0.18em; color: var(--rv-gold); }
.rv-seg { display: inline-flex; flex: 0 1 auto; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; gap: 3px; padding: 3px; border-radius: 999px; background: var(--rv-panel); border: 1px solid var(--rv-line); }
.rv-seg button { height: 32px; padding: 0 14px; border-radius: 999px; border: 0; background: none; color: var(--rv-muted); font: 700 10.5px/1 var(--rv-chrome); letter-spacing: 0.14em; cursor: pointer; white-space: nowrap; text-transform: uppercase; }
.rv-seg button[aria-pressed='true'] { background: linear-gradient(180deg, #f6d995, var(--rv-gold)); color: #17130b; }
.rv-seg button:focus-visible, .rv-tab:focus-visible, .rv-card:focus-visible, .rv-btn:focus-visible { outline: 2px solid #f3d189; outline-offset: 2px; }
.rv-tabs { display: flex; gap: 4px; padding: 10px 24px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rv-line); background: var(--rv-bg); }
.rv-tabs::-webkit-scrollbar { display: none; }
.rv-tab { flex: none; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--rv-muted); font: 700 11px/1 var(--rv-chrome); letter-spacing: 0.14em; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
.rv-tab:hover { color: var(--rv-text); }
.rv-tab[aria-current='true'] { color: var(--rv-text); border-color: var(--rv-line); background: var(--rv-panel); box-shadow: inset 0 -2px 0 var(--rv-gold); }
.rv-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rv-line); background: var(--rv-panel); color: var(--rv-text); font: 700 10.5px/1 var(--rv-chrome); letter-spacing: 0.14em; cursor: pointer; text-decoration: none; white-space: nowrap; text-transform: uppercase; }
.rv-btn:hover { border-color: rgba(212, 168, 83, 0.6); }
.rv-btn[aria-pressed='true'] { border-color: var(--rv-gold); color: #f3d189; }
.rv-btn .ic { width: 15px; height: 15px; }
.rv-main { padding: 22px 24px 60px; min-width: 0; }

/* overview */
.rv-hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 1100px; margin-bottom: 26px; }
.rv-hero small { font: 700 11px/1 var(--rv-chrome); letter-spacing: 0.24em; color: var(--rv-gold); }
.rv-hero h1 { margin: 0; font: 800 clamp(26px, 3.2vw, 44px)/1 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); letter-spacing: 0.01em; }
.rv-hero p { margin: 0; color: var(--rv-muted); max-width: 90ch; line-height: 1.6; }
.rv-flags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.rv-flag { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rv-line); font: 700 10px/1 var(--rv-chrome); letter-spacing: 0.14em; color: var(--rv-text); white-space: nowrap; }
.rv-flag i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--rv-gold); }
@media (max-width: 700px) { .rv-flag { height: auto; min-height: 28px; padding: 7px 12px; line-height: 1.4; white-space: normal; } }
.rv-flag--ok i { background: #7fc795; }
.rv-flag--warn i { background: #e07a6a; }
.rv-grp { display: grid; gap: 14px; padding-top: 20px; margin-top: 20px; border-top: 1px solid var(--rv-line); }
.rv-grp > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.rv-grp > header i { font: 800 13px/1 var(--rv-chrome); font-style: normal; letter-spacing: 0.12em; color: var(--rv-gold); }
.rv-grp > header h2 { margin: 0; font: 800 20px/1 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); letter-spacing: 0.06em; }
.rv-grp > header span { font: 600 10.5px/1.3 var(--rv-chrome); letter-spacing: 0.14em; color: var(--rv-muted); }
.rv-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.rv-card { display: grid; gap: 10px; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; text-transform: uppercase; letter-spacing: inherit; }
.rv-shot { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: #000 center top / cover no-repeat; box-shadow: 0 0 0 1px var(--rv-line), 0 16px 34px rgba(0, 0, 0, 0.45); transition: box-shadow 220ms cubic-bezier(0.22, 0.9, 0.28, 1), transform 220ms cubic-bezier(0.22, 0.9, 0.28, 1); }
.rv-card:hover .rv-shot { box-shadow: 0 0 0 2px var(--rv-gold), 0 20px 40px rgba(0, 0, 0, 0.5); transform: translateY(-2px); }
.rv-shot--none { display: grid; place-items: center; background: linear-gradient(160deg, #1b1a19, #0a0a0a); }
.rv-shot--none b { font: 800 18px/1.1 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); letter-spacing: 0.08em; color: var(--rv-gold); padding: 18px; text-align: center; }
.rv-phone { position: absolute; right: 10px; bottom: 10px; width: 22%; aspect-ratio: 390 / 844; border-radius: 10px; background: #000 center top / cover no-repeat; box-shadow: 0 0 0 3px #1b1b1b, 0 10px 24px rgba(0, 0, 0, 0.6); }
.rv-card__t { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 800 13px/1.25 var(--rv-chrome); letter-spacing: 0.1em; }
.rv-card__s { font: 600 10px/1.3 var(--rv-chrome); letter-spacing: 0.14em; color: var(--rv-muted); margin-top: -6px; }
.rv-tag { flex: none; height: 20px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 999px; font: 700 9px/1 var(--rv-chrome); letter-spacing: 0.14em; border: 1px solid var(--rv-line); color: var(--rv-muted); }
.rv-tag--ok { color: #7fc795; border-color: rgba(127, 199, 149, 0.4); }
.rv-tag--gold { color: #f3d189; border-color: rgba(212, 168, 83, 0.5); }
.rv-tag--warn { color: #e07a6a; border-color: rgba(224, 122, 106, 0.4); }

/* work view: the site in a device frame */
.rv-work { display: grid; gap: 14px; }
.rv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.rv-bar__path { display: flex; max-width: 100%; overflow: hidden; white-space: nowrap; align-items: center; gap: 10px; min-width: 0; padding: 0 14px; height: 34px; border-radius: 6px; border: 1px solid var(--rv-line); background: #070707; font: 600 11px/1 ui-monospace, monospace; letter-spacing: 0.06em; color: #cfc6b4; text-transform: none; }
.rv-bar__path b { font: 700 10px/1 var(--rv-chrome); letter-spacing: 0.16em; color: var(--rv-gold); text-transform: uppercase; }
.rv-bar__sp { flex: 1; }
.rv-stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
.rv-stage--ref { grid-template-columns: minmax(0, 1fr) minmax(0, 0.62fr); }
@media (min-width: 1101px) { .rv-stage--ref:is([data-dev='phone'], [data-dev='tablet']) { grid-template-columns: auto minmax(0, 760px); gap: 36px; } }
.rv-sizer { position: relative; }
.rv-device { position: absolute; left: 0; top: 0; transform-origin: 0 0; border-radius: 14px; overflow: hidden; background: #050505; box-shadow: 0 0 0 1px rgba(235, 217, 183, 0.18), 0 0 0 9px #161616, 0 0 0 10px rgba(235, 217, 183, 0.08), 0 40px 80px rgba(0, 0, 0, 0.6); }
.rv-device[data-dev='phone'] { border-radius: 34px; }
.rv-frame { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overflow-anchor: none; scrollbar-width: thin; scrollbar-color: #3a3530 transparent; }
.rv-frame > #pub { min-height: 100%; }
.rv-ref { position: sticky; top: 120px; display: grid; gap: 10px; }
.rv-ref figure { margin: 0; display: grid; gap: 8px; }
.rv-ref img { width: 100%; border-radius: 10px; box-shadow: 0 0 0 1px var(--rv-line); }
.rv-ref figcaption { font: 700 10px/1.4 var(--rv-chrome); letter-spacing: 0.16em; color: var(--rv-muted); }
.rv-ref figcaption b { color: var(--rv-gold); }
.rv-notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rv-notes li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font: 600 10.5px/1.5 var(--rv-chrome); letter-spacing: 0.08em; color: #d8d0c1; }
.rv-notes li i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 800 10px/1 var(--rv-chrome); font-style: normal; color: #17130b; background: linear-gradient(180deg, #f6d995, var(--rv-gold)); }
.rv-notes li.x i { background: #3a2622; color: #e07a6a; }
@media (max-width: 1100px) { .rv-stage--ref { grid-template-columns: minmax(0, 1fr); } .rv-ref { position: static; } }

/* tree */
.rv-tree { display: grid; gap: 22px; }
.rv-tree section { display: grid; gap: 6px; }
.rv-tree h3 { margin: 0 0 6px; font: 800 13px/1 var(--rv-chrome); letter-spacing: 0.2em; color: var(--rv-gold); }
.rv-tree button { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--rv-line); background: var(--rv-panel); color: inherit; text-align: left; cursor: pointer; font: inherit; text-transform: uppercase; }
.rv-tree button:hover { border-color: rgba(212, 168, 83, 0.6); }
.rv-tree button b { font: 700 11.5px/1.3 var(--rv-chrome); letter-spacing: 0.1em; }
.rv-tree button code { font: 500 11px/1.3 ui-monospace, monospace; color: var(--rv-muted); text-transform: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-tree__svc { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 6px; }
@media (max-width: 700px) { .rv-tree button { grid-template-columns: 1fr auto; } .rv-tree button code { grid-column: 1 / -1; grid-row: 2; } }

/* reference & recovery */
.rv-recov { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.rv-recov figure { margin: 0; display: grid; gap: 8px; }
.rv-recov img { width: 100%; border-radius: 10px; box-shadow: 0 0 0 1px var(--rv-line); }
.rv-recov figcaption { font: 700 10.5px/1.5 var(--rv-chrome); letter-spacing: 0.12em; color: var(--rv-muted); }
.rv-recov figcaption b { color: var(--rv-gold); }
.rv-box { padding: 18px 20px; border-radius: 10px; border: 1px solid var(--rv-line); background: var(--rv-panel); display: grid; gap: 10px; }
.rv-box h3 { margin: 0; font: 800 13px/1.2 var(--rv-chrome); letter-spacing: 0.18em; color: var(--rv-gold); }
@media (max-width: 1000px) { .rv-recov { grid-template-columns: 1fr; } }
@media (max-width: 700px) { #rv-full { display: none; } .rv-seg button { padding: 0 10px; } .rv-top { padding: 12px 16px; } .rv-tabs { padding: 8px 16px; } .rv-main { padding: 16px 16px 48px; } .rv-brand span { display: none; } }

/* ═════════════ the three reviews ═════════════ */
.rv-start { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.rv-startcard { display: grid; align-content: start; gap: 12px; min-height: 230px; padding: 24px; border-radius: 12px; border: 1px solid var(--rv-line); background: linear-gradient(160deg, rgba(212, 168, 83, 0.12), var(--rv-panel) 55%); text-align: left; color: inherit; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
.rv-startcard:hover { border-color: var(--rv-gold); transform: translateY(-2px); }
.rv-startcard i { font: 800 34px/1 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); font-style: normal; color: var(--rv-gold); }
.rv-startcard b { font: 800 16px/1.15 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); letter-spacing: 0.08em; }
.rv-startcard span { font: 600 11px/1.6 var(--rv-chrome); letter-spacing: 0.08em; color: var(--rv-muted); }
.rv-startcard em { display: flex; align-items: center; gap: 8px; margin-top: auto; font: 700 11px/1 var(--rv-chrome); font-style: normal; letter-spacing: 0.18em; color: var(--rv-gold); }
.rv-startcard em .ic { width: 16px; height: 16px; }
.rv-sec { display: grid; gap: 14px; padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--rv-line); min-width: 0; }
.rv-sec > h2 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font: 800 18px/1.15 'AIO Inter Tight', 'Inter Tight', var(--rv-chrome); letter-spacing: 0.06em; }
.rv-sec > h2 code { font: 600 11px/1 ui-monospace, monospace; color: var(--rv-muted); }
.rv-two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.rv-note { margin: 0; font: 600 10.5px/1.6 var(--rv-chrome); letter-spacing: 0.1em; color: var(--rv-muted); }
.rv-n { margin: 0 10px 0 -2px; font: 700 11px/1 var(--rv-chrome); color: var(--rv-muted); align-self: center; }
.rv-figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.rv-fig { margin: 0; display: grid; gap: 8px; min-width: 0; }
.rv-fig img { width: 100%; border-radius: 8px; border: 1px solid var(--rv-line); background: #111; }
.rv-fig figcaption { font: 700 10px/1.4 var(--rv-chrome); letter-spacing: 0.14em; color: var(--rv-muted); }
.rv-cls { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font: 700 9.5px/1 var(--rv-chrome); letter-spacing: 0.12em; white-space: nowrap; border: 1px solid; }
.rv-cls--keep { color: #7fc795; border-color: rgba(127, 199, 149, 0.45); }
.rv-cls--reuse { color: #b9c7d6; border-color: rgba(185, 199, 214, 0.45); }
.rv-cls--link { color: #f3d189; border-color: rgba(212, 168, 83, 0.55); }
.rv-cls--fix { color: #e2b04a; border-color: rgba(226, 176, 74, 0.5); background: rgba(226, 176, 74, 0.08); }
.rv-cls--skin { color: #ebd9b7; border-color: rgba(235, 217, 183, 0.35); }
.rv-cls--cut { color: #e07a6a; border-color: rgba(224, 122, 106, 0.5); }
.rv-cls--later { color: #a8a195; border-color: rgba(168, 161, 149, 0.4); }
.rv-area { border-radius: 10px; border: 1px solid var(--rv-line); background: var(--rv-panel); }
.rv-area > summary { padding: 14px 16px; cursor: pointer; font: 800 12px/1 var(--rv-chrome); letter-spacing: 0.2em; color: var(--rv-gold); }
.rv-rows { display: grid; }
.rv-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 14px; padding: 14px 16px; border-top: 1px solid var(--rv-line); }
.rv-row b { display: block; font: 700 11px/1.35 var(--rv-chrome); letter-spacing: 0.08em; overflow-wrap: anywhere; }
.rv-row span { display: block; margin-top: 4px; font: 500 10.5px/1.55 var(--rv-chrome); letter-spacing: 0.06em; color: var(--rv-muted); }
.rv-row__go em { font: 700 9.5px/1 var(--rv-chrome); font-style: normal; letter-spacing: 0.2em; color: var(--rv-gold); }
.rv-row__cls { display: flex; flex-wrap: wrap; align-content: start; gap: 6px; }
.rv-risk { display: inline-flex !important; align-items: center; height: 22px; margin: 0 !important; padding: 0 9px; border-radius: 4px; font: 700 9.5px/1 var(--rv-chrome) !important; letter-spacing: 0.12em; }
.rv-risk--high { background: rgba(224, 122, 106, 0.16); color: #f0a092 !important; }
.rv-risk--medium { background: rgba(226, 176, 74, 0.12); color: #e9c27a !important; }
.rv-risk--low { background: rgba(255, 255, 255, 0.05); }
@media (max-width: 900px) { .rv-row { grid-template-columns: 1fr; } }
.rv-issues { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.rv-issue { display: grid; align-content: start; grid-template-columns: auto 1fr; gap: 8px 12px; padding: 16px; border-radius: 10px; border: 1px solid var(--rv-line); background: var(--rv-panel); }
.rv-issue i { grid-row: span 2; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font: 800 14px/1 var(--rv-chrome); font-style: normal; color: #17130b; background: linear-gradient(180deg, #f6d995, var(--rv-gold)); }
.rv-issue b { font: 700 11.5px/1.35 var(--rv-chrome); letter-spacing: 0.08em; }
.rv-verdict { font: 800 10px/1.3 var(--rv-chrome); letter-spacing: 0.14em; color: #e2b04a; }
.rv-issue p { grid-column: 1 / -1; margin: 0; font: 500 10.5px/1.6 var(--rv-chrome); letter-spacing: 0.05em; color: var(--rv-muted); }
.rv-issue em { grid-column: 1 / -1; font: 700 9.5px/1 var(--rv-chrome); font-style: normal; letter-spacing: 0.2em; color: var(--rv-gold); }
.rv-bset { display: grid; grid-template-columns: 0.42fr 0.8fr 1.2fr 1.6fr; gap: 12px; align-items: start; }
.rv-bfig { display: grid; gap: 8px; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; text-align: left; min-width: 0; }
.rv-bfig img { width: 100%; border-radius: 8px; border: 1px solid var(--rv-line); transition: border-color 0.2s; }
.rv-bfig:hover img { border-color: var(--rv-gold); }
.rv-bfig span { font: 700 10px/1.3 var(--rv-chrome); letter-spacing: 0.14em; color: var(--rv-muted); }
.rv-bfig--phone span { color: var(--rv-gold); }
@media (max-width: 900px) { .rv-bset { grid-template-columns: 1fr 1fr; } }
.rv-ctable { display: grid; gap: 2px; border-radius: 10px; border: 1px solid var(--rv-line); overflow: hidden; }
.rv-crow { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); gap: 14px; align-items: center; padding: 12px 16px; background: var(--rv-panel); }
.rv-crow--h b { font: 800 10px/1 var(--rv-chrome); letter-spacing: 0.2em; color: var(--rv-gold); }
.rv-crow > b { font: 700 11px/1.3 var(--rv-chrome); letter-spacing: 0.08em; }
.rv-crow > b code { display: block; margin-top: 3px; font: 500 10px/1 ui-monospace, monospace; color: var(--rv-muted); }
.rv-crow > span { display: grid; gap: 6px; }
.rv-crow em { font: 600 10.5px/1 var(--rv-chrome); font-style: normal; letter-spacing: 0.08em; color: var(--rv-muted); }
.rv-crow em strong { color: var(--rv-gold); }
.rv-bars { display: grid; gap: 3px; }
.rv-bars i { display: block; height: 6px; border-radius: 3px; background: rgba(168, 161, 149, 0.45); }
.rv-bars i.a { background: linear-gradient(90deg, #bd8e3b, #f6d995); }
.rv-key { display: inline-block; width: 18px; height: 6px; border-radius: 3px; background: rgba(168, 161, 149, 0.45); vertical-align: middle; }
.rv-key--a { background: linear-gradient(90deg, #bd8e3b, #f6d995); }
@media (max-width: 700px) { .rv-crow { grid-template-columns: 1fr; } .rv-crow--h { display: none; } }
.rv-strips { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; max-width: 900px; }
