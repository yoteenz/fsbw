<svg width="57" height="80" viewBox="0 0 57 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Bottle (Spray Bottle) - Taller, positioned slightly left -->
  <!-- Main body: elongated inverted trapezoid with subtly curved sides tapering inwards from base to neck -->
  <path d="M 8 60 L 8 20 Q 8 18, 10 18 L 18 18 Q 20 18, 20 20 L 20 60 L 8 60 Z" stroke="black" stroke-width="1.5" fill="none"/>
  <!-- Prominent tall U-shaped/arched rectangular internal outline running vertically through center (label area) -->
  <path d="M 10 23 L 10 21 Q 10 20, 11 20 L 17 20 Q 18 20, 18 21 L 18 58 L 10 58 Z" stroke="black" stroke-width="1.5" fill="none"/>
  <!-- Flat horizontal bar extending to left (trigger/lever) -->
  <line x1="5" y1="20" x2="11" y2="20" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Five short vertical parallel lines at neck (ribbed/pump structure) -->
  <line x1="9" y1="18" x2="9" y2="20" stroke="black" stroke-width="1.5"/>
  <line x1="10" y1="18" x2="10" y2="20" stroke="black" stroke-width="1.5"/>
  <line x1="11" y1="18" x2="11" y2="20" stroke="black" stroke-width="1.5"/>
  <line x1="12" y1="18" x2="12" y2="20" stroke="black" stroke-width="1.5"/>
  <line x1="13" y1="18" x2="13" y2="20" stroke="black" stroke-width="1.5"/>
  
  <!-- Right Bottle (Contoured Bottle) - Shorter, wider, positioned to right -->
  <!-- Main body: distinct curvaceous hourglass/figure-eight shape with pronounced inward curves on both sides -->
  <path d="M 22 60 Q 22 57, 23 54 Q 24 50, 25 47 Q 26 44, 27.5 42 Q 29 40, 30.5 42 Q 32 44, 33 47 Q 34 50, 35 54 Q 36 57, 36 60 L 22 60 Z" stroke="black" stroke-width="1.5" fill="none"/>
  <path d="M 22 18 Q 22 21, 23 24 Q 24 28, 25 31 Q 26 34, 27.5 36 Q 29 38, 30.5 36 Q 32 34, 33 31 Q 34 28, 35 24 Q 36 21, 36 18 L 22 18 Z" stroke="black" stroke-width="1.5" fill="none"/>
  <!-- Connect left and right sides -->
  <line x1="22" y1="18" x2="22" y2="60" stroke="black" stroke-width="1.5"/>
  <line x1="36" y1="18" x2="36" y2="60" stroke="black" stroke-width="1.5"/>
  <!-- Oval-shaped internal outline in center (label area) -->
  <ellipse cx="29" cy="39" rx="6" ry="12" stroke="black" stroke-width="1.5" fill="none"/>
  <!-- Short cylindrical neck -->
  <line x1="25" y1="18" x2="25" y2="16" stroke="black" stroke-width="1.5"/>
  <line x1="33" y1="18" x2="33" y2="16" stroke="black" stroke-width="1.5"/>
  <line x1="25" y1="16" x2="33" y2="16" stroke="black" stroke-width="1.5"/>
  <!-- Five short vertical parallel lines at top of neck (ribbed cap) -->
  <line x1="24" y1="16" x2="24" y2="13" stroke="black" stroke-width="1.5"/>
  <line x1="25" y1="16" x2="25" y2="13" stroke="black" stroke-width="1.5"/>
  <line x1="26" y1="16" x2="26" y2="13" stroke="black" stroke-width="1.5"/>
  <line x1="27" y1="16" x2="27" y2="13" stroke="black" stroke-width="1.5"/>
  <line x1="28" y1="16" x2="28" y2="13" stroke="black" stroke-width="1.5"/>
  <!-- Single clear circular opening/cap above the lines -->
  <circle cx="26" cy="11" r="1.5" stroke="black" stroke-width="1.5" fill="none"/>
  <!-- Three small outline-only circles (bubbles) of varying sizes to upper right of cap -->
  <circle cx="31" cy="8" r="1.5" stroke="black" stroke-width="1.5" fill="none"/>
  <circle cx="33" cy="6" r="2" stroke="black" stroke-width="1.5" fill="none"/>
  <circle cx="35" cy="9" r="1" stroke="black" stroke-width="1.5" fill="none"/>
</svg>
