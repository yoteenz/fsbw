# Core Studio OS Philosophy — constitutional design principles (not product features)
# Governs every Volume, Chapter, Milestone, and Design Revision authored in the Master Specification.
version: '1.2.0'
updatedAt: '2026-07-07'
amendmentNote: 'CA-002 Company Genome™ — genome-first intelligence · living company DNA'

philosophies:
  - id: philosophy-environmental-storytelling
    title: Environmental Storytelling™
    category: experiential
    summary: >-
      The environment communicates before interfaces do. Seasons, milestones, memory,
      and organizational moments should be felt through space, light, motion, and
      presence — not explained through dashboards or copy blocks.
    governs: [living-headquarters, legacy-vault, environmental-storytelling]
    alignsVolumes: [volume-i, volume-xvi]

  - id: philosophy-living-headquarters
    title: Living Headquarters™
    category: experiential
    summary: >-
      Headquarters is a living place that evolves with the organization — not a static
      admin home. Departments, wings, pulse, and memory should change as the company
      grows, celebrates, and learns.
    governs: [mission-control, headquarters-experience-v2, living-headquarters]
    alignsVolumes: [volume-i]

  - id: philosophy-studio-orb
    title: Studio Orb™
    category: experiential
    summary: >-
      Intelligence should feel ambient, respectful, and present — not trapped in a
      persistent toolbar. The Orb is a philosophy of presence: arrive, listen, guide,
      and disappear until needed again.
    governs: [studio-orb, command-dock, voice-mode]
    alignsVolumes: [volume-i]

  - id: philosophy-experience-studio
    title: Experience Studio™
    category: experiential
    summary: >-
      Experience design is authored, interviewed, and refined — not configured through
      settings panels. Founders and executives shape atmosphere, tone, and feel through
      creative direction, not technical forms.
    governs: [experience-studio, design-dna-canon, design-genome]
    alignsVolumes: [volume-i, volume-xi]

  - id: philosophy-design-dna
    title: Design DNA™
    category: design-canon
    summary: >-
      Every organization carries a visual and behavioral genome — canon, tokens,
      typography, glass, motion, and hierarchy that remain coherent across thousands
      of modules and future generations.
    governs: [design-dna-canon, design-token-engine]
    alignsVolumes: [volume-i, volume-xi]

  - id: philosophy-experience-dna
    title: Experience DNA™
    category: design-canon
    summary: >-
      Experience is inherited, not reinvented per screen. Emotional rhythm, arrival
      moments, hospitality, and environmental adaptation compose an Experience DNA
      that scales with the operating system.
    governs: [design-genome, experience-engine, arrival-experience]
    alignsVolumes: [volume-i]

  - id: philosophy-conversational-ux
    title: Conversational UX
    category: interaction
    summary: >-
      The OS speaks naturally. Command, discovery, and guidance flow through conversation
      — voice, text, and concierge dialogue — before users hunt through menus or
      documentation indexes.
    governs: [command-dock, studio-intelligence, studio-orb]
    alignsVolumes: [volume-i, volume-ii]

  - id: philosophy-invisible-complexity
    title: Invisible Complexity
    category: interaction
    summary: >-
      Sophisticated systems should feel simple. Registries, orchestration, policies,
      and intelligence pipelines remain engineering-visible — never user-visible
      complexity.
    governs: [system-registry, manifest-reconciliation, model-orchestrator]
    alignsVolumes: [volume-ii, volume-xi]

  - id: philosophy-executive-first
    title: Executive-first Design
    category: interaction
    summary: >-
      Founders and executives are the primary audience. Every surface should support
      judgment, oversight, and strategic clarity before operator or developer convenience.
    governs: [mission-control, executive-council, executive-strategy-floor]
    alignsVolumes: [volume-i, volume-iv]

  - id: philosophy-documentation-as-architecture
    title: Documentation as Architecture
    category: governance
    summary: >-
      Documentation is not an afterthought — it is part of the architecture. Knowledge,
      dependencies, and implementation status live in registries and manifest artifacts
      that are as authoritative as code.
    governs: [knowledge-registry, documentation-governance, executive-strategy-floor]
    alignsVolumes: [volume-ii, volume-0]

  - id: philosophy-ai-creative-director
    title: AI as Collaborative Creative Director
    category: intelligence
    summary: >-
      Studio Intelligence™ does not replace human judgment — it collaborates as a
      creative director: proposing, critiquing, refining, and explaining — while
      founders retain authorship and final decisions.
    governs: [studio-intelligence, experience-studio, emotional-computing]
    alignsVolumes: [volume-i, volume-ii]

  - id: philosophy-single-source-of-truth
    title: Single Source of Truth
    category: governance
    summary: >-
      Every architectural object exists exactly once in the Master Specification and
      is referenced everywhere else. No duplicate milestone definitions, no parallel
      registries, no shadow roadmaps.
    governs: [knowledge-registry, manifest-reconciliation, constitution-single-source]
    alignsVolumes: [volume-0, volume-ii]

  - id: philosophy-progressive-disclosure
    title: Progressive Disclosure
    category: interaction
    summary: >-
      Reveal depth only when needed. Onboarding, Headquarters, Command Dock, and
      intelligence surfaces should start calm and ceremonial — expanding into power
      as confidence grows.
    governs: [company-onboarding-intelligence, arrival-experience, command-dock]
    alignsVolumes: [volume-i]

  - id: philosophy-architecture-before-implementation
    title: Architecture Before Implementation
    category: governance
    summary: >-
      Specify, register, and validate before building product surfaces. Volumes,
      chapters, milestones, philosophies, and design revisions precede routes,
      components, and feature work.
    governs: [manifest-authoring, manifest-reconciliation, executive-strategy-floor]
    alignsVolumes: [volume-0, volume-ii]

  - id: philosophy-os-not-saas
    title: Operating System, Not SaaS
    category: platform
    summary: >-
      Studio OS is an organizational operating system — not a subscription dashboard.
      Founders expand Headquarters, install Expansions, and hire digital staff;
      they do not buy apps, templates, or feature packs.
    governs: [headquarters-engine, expansion-center, headquarters-marketplace, business-model-engine]
    alignsVolumes: [volume-i, volume-iii]

  - id: philosophy-places-not-pages
    title: Places Instead of Pages
    category: experiential
    summary: >-
      Users walk through destinations — Headquarters wings, departments, floors,
      registries, and studios — not disconnected admin pages. Navigation is spatial
      and narrative, not a flat route tree.
    governs: [mission-control, industry-architecture, headquarters-experience-v2]
    alignsVolumes: [volume-i, volume-iii]

  - id: philosophy-workspace-dna
    title: Workspace DNA™
    category: design-canon
    summary: >-
      Each organization workspace carries an experiential genome — isolated identity,
      atmosphere, and memory while inheriting Studio OS canon. Multi-organization
      does not mean multi-product fragmentation.
    governs: [workspace-runtime, design-genome, organization-genome]
    alignsVolumes: [volume-i]

  - id: philosophy-personalization-dna
    title: Personalization DNA™
    category: design-canon
    summary: >-
      Personalization is respectful and explicit — culture, tone, accessibility,
      grief, celebration, and privacy preferences authored through Life & Culture
      Preferences™, never inferred from assumptions.
    governs: [M89.5, studio-orb, identity-graph, command-dock]
    alignsVolumes: [volume-i]

  - id: philosophy-emotional-computing
    title: Emotional Computing™
    category: intelligence
    summary: >-
      Intelligence systems account for emotional context — sensitivity, celebration,
      grief, and tone — as first-class inputs, not afterthoughts in copy generation.
    governs: [studio-intelligence, studio-orb, experience-engine]
    alignsVolumes: [volume-i]

  - id: philosophy-ambient-intelligence
    title: Ambient Intelligence™
    category: intelligence
    summary: >-
      Intelligence is felt through the environment — briefings, presence, and guidance
      arrive when needed and recede when not. No persistent toolbar clutter.
    governs: [ambient-awareness, studio-intelligence, living-headquarters-presence]
    alignsVolumes: [volume-i, volume-ii]

  - id: philosophy-context-aware-experiences
    title: Context-Aware Experiences™
    category: interaction
    summary: >-
      Every surface adapts to organizational context — role, route, mission state,
      and executive priority — without requiring the user to reconfigure the OS.
    governs: [experience-engine, command-dock, mission-control]
    alignsVolumes: [volume-i]

  - id: philosophy-dynamic-workspace-personalization
    title: Dynamic Workspace Personalization™
    category: interaction
    summary: >-
      Workspaces personalize atmosphere dynamically — seasons, milestones, and
      organizational moments reshape Headquarters while preserving canonical integrity.
    governs: [experience-engine, workspace-runtime, living-headquarters-presence]
    alignsVolumes: [volume-i]

  - id: philosophy-release-channel-governance
    title: Release Channel Governance™
    category: governance
    summary: >-
      Organizations adopt platform capabilities at governed speeds — Stable for production,
      Preview for feedback, Beta for validation, Experimental for research. No module may
      bypass channel eligibility. Promotion requires QA Engine™, Update Engine™, and
      Deployment Engine™ channel-native approval — not ad-hoc feature flags.
    governs: [release-channel-system, qa-headquarters, release-readiness, system-registry, platform-governance]
    alignsVolumes: [volume-0, volume-ii, volume-iv, volume-xi]

  - id: philosophy-headquarters-engine
    title: Headquarters Engine™
    category: platform
    summary: >-
      Every customer owns a Headquarters that grows over time. The Headquarters Engine
      generates immersive business environments tailored to business type — buildings,
      departments, workspaces, and operational rhythm — not apps or admin pages.
    governs: [headquarters-engine, industry-architecture, mission-control, headquarters-experience-v2]
    alignsVolumes: [volume-i, volume-iii]

  - id: philosophy-headquarters-expansions
    title: Headquarters Expansions™
    category: platform
    summary: >-
      Businesses never outgrow Studio OS — they install Expansions. Each Expansion
      adds departments, workflows, AI specialists, concierges, automations, analytics,
      and progression systems into an existing Headquarters. Expansions are business
      capabilities, not templates or feature packs.
    governs: [headquarters-engine, expansion-center, monetization-architecture]
    alignsVolumes: [volume-i, volume-iii]

  - id: philosophy-headquarters-marketplace
    title: Headquarters Marketplace™
    category: platform
    summary: >-
      Creators sell business architecture — living operational systems with UI, AI
      behavior, workflows, documentation, analytics, automation, and concierge roles.
      Not graphics, page templates, or downloadable files. Cross-industry installation
      is encouraged.
    governs: [headquarters-engine, expert-marketplace, ecosystem-marketplace]
    alignsVolumes: [volume-i, volume-iii]

  - id: philosophy-business-headquarters-os
    title: Business Headquarters Operating System
    category: platform
    summary: >-
      Studio OS vision: the world's first immersive Business Headquarters Operating
      System. Founders step inside their business when they log in — not open software.
      Long-term goal is building businesses, not buying business software.
    governs: [headquarters-engine, platform-vision, arrival-experience]
    alignsVolumes: [volume-i]

  - id: philosophy-meaningful-progression
    title: Meaningful Progression
    category: experiential
    summary: >-
      Borrow progression psychology from great games — ownership, production management,
      ambient intelligence, earned mastery — without gamification theater. Users feel
      they are building something alive; achievements reflect real organizational progress.
    governs: [headquarters-engine, experience-dna, living-creative-headquarters, campus-evolution-engine]
    alignsVolumes: [volume-i, volume-xvi]

  - id: philosophy-company-genome
    title: Company Genome™
    category: platform
    constitutionalAmendment: CA-002
    summary: >-
      Every company has living DNA — not a logo, theme, or style guide. Company Genome™
      is the apex identity object learned from every interaction. Studio OS must never
      create generic experiences. Outputs must feel inevitable for that specific company.
      Two companies generating the same product type must never receive interchangeable
      experiences.
    governs: [company-genome, project-genome, organization-genome, design-genome, experience-studio]
    alignsVolumes: [volume-i, volume-ii]

  - id: philosophy-genome-first
    title: Genome-First Intelligence
    category: platform
    constitutionalAmendment: CA-002
    summary: >-
      Every AI system consults Company Genome™ and Project Genome™ before generating
      anything. Creative direction and editorial art direction precede layout, copy,
      and motion. Website generation is a final step. No intelligence may skip genome
      consultation. Rejected concepts teach the genome. Approved work strengthens it.
    governs: [genome-first-orchestration, studio-intelligence, creative-director, experience-studio, studio-production-engine]
    alignsVolumes: [volume-i, volume-ii]
