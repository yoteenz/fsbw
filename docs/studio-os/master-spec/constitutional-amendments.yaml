# Studio OS Constitutional Amendments — governed changes to frozen Foundation baseline
version: '1.1.0'
foundationVersion: '1.1.0'
updatedAt: '2026-07-07'

amendments:
  - id: CA-001
    title: Studio OS Release Channel System™
    type: constitutional-capability
    ratifiedAt: '2026-07-07'
    foundationVersion: '1.1.0'
    status: ratified
    summary: >-
      Introduces Release Channel System™ as a constitutional platform capability. Organizations
      adopt capabilities at different speeds through Stable, Preview, Beta, and Experimental
      channels. Release Channel is part of Organization Profile and System Registry. QA Engine™,
      Update Engine™, and Deployment Engine™ are channel-native.
    artifacts:
      - constitution.yaml
      - core-philosophies.yaml
      - release-channel-system.yaml
      - milestones/volume-ii.yaml
      - foundation-baseline.yaml
    milestoneTargets: [M127.14]
    principleTargets: [constitution-release-channels]
    philosophyTargets: [philosophy-release-channel-governance]
    operationalCompletion: true
    note: >-
      Final constitutional addition before Volume V authoring. Foundation v1.1 is operationally
      complete — baseline remains frozen; future changes require governed amendments only.

  - id: CA-002
    title: Company Genome™ — Foundational Platform Amendment
    type: constitutional-capability
    ratifiedAt: '2026-07-07'
    foundationVersion: '1.1.0'
    status: ratified
    summary: >-
      Introduces Company Genome™ as the apex living identity object for every organization.
      Project Genome™ extends per production. Genome-First Orchestration™ mandates that all
      intelligence systems consult genome before generating — creative direction before
      layout. Studio OS must never produce generic interchangeable experiences. Organization
      Genome™ and Design Genome™ become slices under Company Genome™. Not a feature — foundational architecture.
    artifacts:
      - constitution.yaml
      - core-philosophies.yaml
      - company-genome.yaml
      - genome-first-orchestration.yaml
      - experience-architecture.yaml
      - milestones/volume-ii.yaml
      - company-genome.md
      - project-genome.md
      - COMPANY_GENOME_AMENDMENT_REPORT.md
    milestoneTargets: [M277, M278, M279]
    principleTargets: [constitution-company-genome]
    philosophyTargets: [philosophy-company-genome, philosophy-genome-first]
    operationalCompletion: false
    note: >-
      Documentation and architecture ratified. Core module implementation requires DR.
      No UI or React per amendment sprint scope.
