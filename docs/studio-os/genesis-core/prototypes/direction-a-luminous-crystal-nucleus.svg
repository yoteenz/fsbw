<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Genesis Orb Direction A  Luminous Crystal Nucleus">
  <defs>
    <radialGradient id="a-core" cx="50%" cy="48%" r="22%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#FFF9EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-diffuse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F8EEDB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8EEDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-body" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#FFF9EE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8DFD0" stop-opacity="0.12"/>
    </radialGradient>
    <linearGradient id="a-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D8CEC0" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="a-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Layer 5 atmospheric -->
  <circle cx="60" cy="60" r="52" fill="#FFF9EE" opacity="0.08" filter="url(#a-bloom)"/>
  <!-- Layer 3 body -->
  <circle cx="60" cy="60" r="44" fill="url(#a-body)"/>
  <!-- Layer 2 diffusion -->
  <circle cx="60" cy="60" r="36" fill="url(#a-diffuse)" filter="url(#a-bloom)"/>
  <!-- Layer 1 core -->
  <circle cx="60" cy="58" r="14" fill="url(#a-core)"/>
  <!-- Layer 4 shell highlight -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#a-shell)" stroke-width="1.2"/>
  <ellipse cx="46" cy="42" rx="18" ry="10" fill="#FFFFFF" opacity="0.35"/>
  <!-- particles -->
  <circle cx="78" cy="38" r="1.2" fill="#FFFDF8" opacity="0.4"/>
  <circle cx="34" cy="72" r="0.9" fill="#FFF9EE" opacity="0.35"/>
  <circle cx="82" cy="68" r="0.8" fill="#FFFFFF" opacity="0.3"/>
</svg>
