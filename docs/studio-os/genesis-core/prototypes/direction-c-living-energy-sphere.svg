<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Genesis Orb Direction C  Living Energy Sphere">
  <defs>
    <radialGradient id="c-core" cx="50%" cy="45%" r="25%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-flow1" cx="35%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F8EEDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-flow2" cx="65%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFF9EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="c-blur"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <!-- atmospheric -->
  <circle cx="60" cy="60" r="50" fill="#FFF9EE" opacity="0.06"/>
  <!-- energy currents -->
  <circle cx="60" cy="60" r="40" fill="url(#c-flow1)" filter="url(#c-blur)"/>
  <circle cx="60" cy="60" r="38" fill="url(#c-flow2)" filter="url(#c-blur)"/>
  <!-- concentric rings -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="#FFFDF8" stroke-opacity="0.35" stroke-width="0.8"/>
  <circle cx="60" cy="60" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.6"/>
  <circle cx="60" cy="60" r="14" fill="none" stroke="#F8EEDB" stroke-opacity="0.4" stroke-width="0.5"/>
  <!-- nucleus -->
  <circle cx="60" cy="57" r="11" fill="url(#c-core)"/>
  <!-- vertical energy axis -->
  <ellipse cx="60" cy="60" rx="3" ry="28" fill="#FFFFFF" opacity="0.12" filter="url(#c-blur)"/>
  <!-- shell -->
  <circle cx="60" cy="60" r="44" fill="rgba(255,253,248,0.18)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8"/>
  <ellipse cx="44" cy="38" rx="16" ry="9" fill="#FFFFFF" opacity="0.3"/>
  <!-- particles -->
  <circle cx="72" cy="32" r="1.1" fill="#FFFDF8" opacity="0.5"/>
  <circle cx="88" cy="58" r="0.9" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="30" cy="48" r="1" fill="#FFF9EE" opacity="0.45"/>
  <circle cx="38" cy="78" r="0.8" fill="#FFFDF8" opacity="0.35"/>
  <circle cx="68" cy="82" r="0.7" fill="#FFFFFF" opacity="0.3"/>
</svg>
