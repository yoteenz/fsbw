    <script>
      (function cleanupFsLobbyBootBleed() {
        /* Revert safety — old fs-lobby-lounge-boot hid #root via cached CSS after SITE 00 bleed. */
        document.documentElement.classList.remove('fs-lobby-lounge-boot');
        var staleShell = document.getElementById('fs-lobby-lounge-boot-shell');
        if (staleShell) staleShell.remove();
      })();
    </script>
    <script>
      (function site00AsstsBootClassEarly() {
        var path = window.location.pathname || '';
        var isSite00 =
          typeof window.site00IsSite00ImmersivePath === 'function'
            ? window.site00IsSite00ImmersivePath(path)
            : path.indexOf('/assts') === 0 || path.indexOf('/origin') === 0;
        if (!isSite00) return;
        if (path === '/origin/desktop' || path.indexOf('/origin/desktop/') === 0) return;
        var shouldBoot =
          typeof window.site00ShouldBootSite00ImmersiveLoader === 'function'
            ? window.site00ShouldBootSite00ImmersiveLoader()
            : typeof window.site00ShouldBootAsstsImmersiveLoader === 'function'
              ? window.site00ShouldBootAsstsImmersiveLoader()
              : true;
        if (!shouldBoot) return;
        document.documentElement.classList.add('site00-assts-boot');
        var shell = document.getElementById('site00-assts-boot-shell');
        if (shell) shell.hidden = false;
      })();
    </script>
